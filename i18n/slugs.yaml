version: 1
description: >
  URL scheme for the GENERATED per-language static pages (emitted by
  `python3 tools/i18n/i18n.py pages` into /<lang>/<slug>.html — never
  hand-edit the output). Latin-script languages get native slugs; non-Latin
  scripts (el zh ja th hi ta ar ar-lb he) use the English slugs — cleaner
  than percent-encoded URLs. `indexable` lists the languages whose generated
  pages may be indexed (self-canonical, listed in hreflang + sitemap); every
  other language is generated with noindex,follow until a native speaker has
  reviewed it — flipping a language live is a one-line change here.
  French keeps its historic URLs at the site root and stays x-default.

# Languages whose generated pages are indexable (fr is always indexable at
# its root URLs). Product-owner decision 2026-07-24: publish ALL languages —
# every translated page displays an honest machine-translation notice
# (i18n.helpnote) with an invitation to help improve the copy.
indexable: [en, es, it, pt, de, tr, el, ro, zh, ja, th, hi, ta, ar, ar-lb, he]

# Per-page slugs. Key = the French source file; `en` doubles as the slug for
# every non-Latin-script language. index.html maps to the language root /xx/.
slugs:
