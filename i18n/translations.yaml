version: 1
description: >
  Captain.Food MARKETING-SITE translation catalog — same conventions as
  specs/translations.yaml in TheCaptainCompany/captain-food (errors.yaml-style):
  one dotted KEY per string, optional typed `params` ({placeholder} tokens the
  client interpolates), and a `messages` map that MUST cover every language
  declared under `languages` (the validator, tools/i18n/i18n.py, fails
  otherwise). French is the SOURCE language: for keys annotated in index.html
  the fr message must match the page copy exactly (drift-checked); the other
  languages are the most spoken in France (INSEE) + Arabic and Hebrew (RTL).
  Generated artifacts: i18n/generated/<lang>.json (run `make`-less:
  python3 tools/i18n/i18n.py build) — consumed at runtime by /i18n.js.
  NEVER hand-edit the generated JSON; edit THIS file and rebuild.

languages:
  fr: { label: "Français", dir: ltr }
  en: { label: "English", dir: ltr }
  es: { label: "Español", dir: ltr }
  it: { label: "Italiano", dir: ltr }
  pt: { label: "Português", dir: ltr }
  ar: { label: "العربية", dir: rtl }
  he: { label: "עברית", dir: rtl }

keys:

  # ---- a11y ----
  a11y.skip_link:
    messages:
      fr: "Aller au contenu"
      en: "Skip to content"
      es: "Ir al contenido"
      it: "Vai al contenuto"
      pt: "Saltar para o conteúdo"
      ar: "الانتقال إلى المحتوى"
      he: "דילוג לתוכן"

  # ---- ask ----
  ask.intro:
    messages:
      fr: "Moins que tu ne crois."
      en: "Less than you think."
      es: "Menos de lo que crees."
      it: "Meno di quanto credi."
      pt: "Menos do que pensas."
      ar: "أقل مما تظن."
      he: "פחות ממה שאתה חושב."
  ask.item1:
    messages:
      fr: "<strong>L'inscription est gratuite et sans engagement.</strong> Tu gardes tes plateformes actuelles."
      en: "<strong>Signing up is free, with no commitment.</strong> You keep your current platforms."
      es: "<strong>El alta es gratis y sin permanencia.</strong> Te quedas con tus plataformas actuales."
      it: "<strong>L'iscrizione è gratuita e senza vincoli.</strong> Tieni le tue piattaforme attuali."
      pt: "<strong>A inscrição é gratuita e sem compromisso.</strong> Ficas com as tuas plataformas atuais."
      ar: "<strong>التسجيل مجاني وبدون التزام.</strong> تحتفظ بمنصاتك الحالية."
      he: "<strong>ההרשמה חינם ובלי התחייבות.</strong> אתה שומר על הפלטפורמות הנוכחיות שלך."
  ask.item2:
    messages:
      fr: "<strong>On s'occupe de la mise en place.</strong> Synchronisation de ta carte, mise en ligne de ta page : on t'accompagne. Si tu n'as pas encore d'outil de synchronisation (type HubRise), on t'aide à le mettre en place — un service standard que tu gardes en main."
      en: "<strong>We handle the setup.</strong> Syncing your menu, putting your page online: we walk you through it. If you don't have a sync tool yet (like HubRise), we'll help you set one up — a standard service that stays in your hands."
      es: "<strong>De la puesta en marcha nos ocupamos nosotros.</strong> Sincronización de tu carta, publicación de tu página: te acompañamos. Si aún no tienes una herramienta de sincronización (tipo HubRise), te ayudamos a montarla — un servicio estándar que queda en tus manos."
      it: "<strong>Della configurazione ci occupiamo noi.</strong> Sincronizzazione del tuo menu, messa online della tua pagina: ti accompagniamo. Se non hai ancora uno strumento di sincronizzazione (tipo HubRise), ti aiutiamo a metterlo in piedi — un servizio standard che resta nelle tue mani."
      pt: "<strong>Nós tratamos da instalação.</strong> Sincronização do teu menu, publicação da tua página: acompanhamos-te. Se ainda não tens uma ferramenta de sincronização (tipo HubRise), ajudamos-te a montá-la — um serviço padrão que fica nas tuas mãos."
      ar: "<strong>نتكفل نحن بالتجهيز.</strong> مزامنة قائمتك، ونشر صفحتك: نرافقك خطوة بخطوة. وإن لم تكن تملك بعد أداة مزامنة (مثل HubRise)، نساعدك على تركيبها — خدمة قياسية تبقى بين يديك أنت."
      he: "<strong>אנחנו דואגים להקמה.</strong> סנכרון התפריט, העלאת העמוד שלך לאוויר: אנחנו מלווים אותך. אם עוד אין לך כלי סנכרון (כמו HubRise), נעזור לך להקים אחד — שירות סטנדרטי שנשאר בשליטתך."
  ask.item3:
    messages:
      fr: "<strong>Pas de nouvelle machine à apprendre dans l'urgence.</strong> On avance à ton rythme."
      en: "<strong>No new machine to learn in a rush.</strong> We go at your pace."
      es: "<strong>Nada de aprender otra máquina a toda prisa.</strong> Avanzamos a tu ritmo."
      it: "<strong>Nessuna nuova macchina da imparare di corsa.</strong> Andiamo al tuo ritmo."
      pt: "<strong>Nenhuma máquina nova para aprender à pressa.</strong> Avançamos ao teu ritmo."
      ar: "<strong>لا جهاز جديدًا عليك تعلّمه على عجل.</strong> نتقدم على إيقاعك."
      he: "<strong>אין מכונה חדשה ללמוד בלחץ.</strong> מתקדמים בקצב שלך."
  ask.title:
    messages:
      fr: "Et concrètement, ça me demande quoi ?"
      en: "So what does it actually ask of me?"
      es: "Y en la práctica, ¿qué me pide esto?"
      it: "E in pratica, cosa mi chiede?"
      pt: "E, na prática, o que é que isto me pede?"
      ar: "وعمليًا، ماذا يُطلب مني؟"
      he: "ובתכל'ס, מה זה דורש ממני?"

  # ---- calc ----
  calc.ca_label:
    messages:
      fr: "Ton chiffre d'affaires mensuel sur cette plateforme"
      en: "Your monthly revenue on this platform"
      es: "Tu facturación mensual en esta plataforma"
      it: "Il tuo fatturato mensile su questa piattaforma"
      pt: "A tua faturação mensal nesta plataforma"
      ar: "رقم مبيعاتك الشهري على هذه المنصة"
      he: "המחזור החודשי שלך בפלטפורמה הזאת"
  calc.ca_unit:
    messages:
      fr: "€ / mois"
      en: "€ / month"
      es: "€ / mes"
      it: "€ / mese"
      pt: "€ / mês"
      ar: "€ / الشهر"
      he: "€ / חודש"
  calc.cta:
    messages:
      fr: "Je reprends mes commandes"
      en: "I'm taking back my orders"
      es: "Recupero mis pedidos"
      it: "Mi riprendo i miei ordini"
      pt: "Retomo as minhas encomendas"
      ar: "أستعيد زمام طلباتي"
      he: "אני לוקח בחזרה את ההזמנות שלי"
  calc.fine:
    messages:
      fr: "Le calcul de commission est factuel : ton chiffre d'affaires × le taux. Taux indicatifs et modifiables : Uber Eats ~25-35 %, Deliveroo ~25-30 % (fourchettes indicatives, sources publiques, 2024). « SMIC brut employeur » : coût mensuel employeur d'un SMIC temps plein — SMIC brut 1 867,02 € au 1ᵉʳ janvier 2026 (<a href=\"https://www.service-public.gouv.fr/particuliers/vosdroits/F2300\" target=\"_blank\" rel=\"noopener\">service-public.gouv.fr</a>), charges patronales résiduelles comprises (~1 933 €). Ordre de grandeur, pas un relevé."
      en: "The commission math is factual: your revenue × the rate. Rates are indicative and editable: Uber Eats ~25-35%, Deliveroo ~25-30% (indicative ranges, public sources, 2024). “Employer-cost SMIC”: the monthly employer cost of a full-time SMIC (the French minimum wage) — gross SMIC of €1,867.02 as of January 1, 2026 (<a href=\"https://www.service-public.gouv.fr/particuliers/vosdroits/F2300\" target=\"_blank\" rel=\"noopener\">service-public.gouv.fr</a>), residual employer contributions included (~€1,933). An order of magnitude, not an invoice."
      es: "El cálculo de la comisión es puro hecho: tu facturación × la tasa. Tasas orientativas y modificables: Uber Eats ~25-35 %, Deliveroo ~25-30 % (horquillas orientativas, fuentes públicas, 2024). «SMIC bruto para el empleador»: coste mensual para el empleador de un SMIC (el salario mínimo francés) a jornada completa — SMIC bruto de 1 867,02 € a 1 de enero de 2026 (<a href=\"https://www.service-public.gouv.fr/particuliers/vosdroits/F2300\" target=\"_blank\" rel=\"noopener\">service-public.gouv.fr</a>), cotizaciones patronales residuales incluidas (~1 933 €). Un orden de magnitud, no un extracto."
      it: "Il calcolo della commissione è fattuale: il tuo fatturato × la percentuale. Percentuali indicative e modificabili: Uber Eats ~25-35%, Deliveroo ~25-30% (forchette indicative, fonti pubbliche, 2024). «SMIC lordo per il datore»: costo mensile per il datore di lavoro di uno SMIC (il salario minimo legale francese) a tempo pieno — SMIC lordo 1 867,02 € al 1º gennaio 2026 (<a href=\"https://www.service-public.gouv.fr/particuliers/vosdroits/F2300\" target=\"_blank\" rel=\"noopener\">service-public.gouv.fr</a>), contributi datoriali residui inclusi (~1 933 €). Un ordine di grandezza, non un estratto conto."
      pt: "O cálculo da comissão é factual: a tua faturação × a taxa. Taxas indicativas e ajustáveis: Uber Eats ~25-35%, Deliveroo ~25-30% (intervalos indicativos, fontes públicas, 2024). «SMIC bruto para o empregador»: custo mensal, para o empregador, de um SMIC (o salário mínimo francês) a tempo inteiro — SMIC bruto de 1 867,02 € a 1 de janeiro de 2026 (<a href=\"https://www.service-public.gouv.fr/particuliers/vosdroits/F2300\" target=\"_blank\" rel=\"noopener\">service-public.gouv.fr</a>), encargos patronais residuais incluídos (~1 933 €). Uma ordem de grandeza, não um extrato."
      ar: "حساب العمولة حساب واقعي: رقم مبيعاتك × النسبة. نسب استرشادية قابلة للتعديل: Uber Eats ~25-35%، وDeliveroo ~25-30% (نطاقات استرشادية، مصادر عامة، 2024). «SMIC الإجمالي على صاحب العمل»: التكلفة الشهرية على صاحب العمل لأجر SMIC بدوام كامل — وهو الحد الأدنى القانوني للأجور في فرنسا، 1 867,02 € إجماليًا في 1 يناير 2026 (<a href=\"https://www.service-public.gouv.fr/particuliers/vosdroits/F2300\" target=\"_blank\" rel=\"noopener\">service-public.gouv.fr</a>)، متضمنةً الأعباء الاجتماعية المتبقية على صاحب العمل (~1 933 €). ترتيب حجم تقريبي، وليس كشف حساب."
      he: "חישוב העמלה הוא עובדתי: המחזור שלך × השיעור. השיעורים משוערים וניתנים לשינוי: Uber Eats כ-25-35%, Deliveroo כ-25-30% (טווחים משוערים, מקורות פומביים, 2024). ״SMIC ברוטו למעסיק״: SMIC הוא שכר המינימום החוקי בצרפת — העלות החודשית למעסיק של משרה מלאה בשכר מינימום — SMIC ברוטו 1,867.02 € נכון ל-1 בינואר 2026 (<a href=\"https://www.service-public.gouv.fr/particuliers/vosdroits/F2300\" target=\"_blank\" rel=\"noopener\">service-public.gouv.fr</a>), כולל יתרת הפרשות המעסיק (כ-1,933 €). סדר גודל, לא תלוש שכר."
  calc.habitues:
    messages:
      fr: "Tes habitués, eux, peuvent commander en direct : <strong>sans commission</strong>."
      en: "Your regulars, though, can order direct: <strong>commission-free</strong>."
      es: "Tus habituales, en cambio, pueden pedirte en directo: <strong>sin comisión</strong>."
      it: "I tuoi clienti abituali, invece, possono ordinare direttamente da te: <strong>senza commissioni</strong>."
      pt: "Os teus clientes habituais, esses, podem encomendar em direto: <strong>sem comissão</strong>."
      ar: "أما زبائنك الأوفياء، فيمكنهم الطلب منك مباشرة: <strong>بدون عمولة</strong>."
      he: "והלקוחות הקבועים שלך? הם יכולים להזמין ישירות: <strong>בלי עמלה</strong>."
  calc.intro:
    messages:
      fr: "Choisis ta plateforme, entre ton chiffre d'affaires mensuel — et vois où part chaque euro, chaque mois et chaque année."
      en: "Pick your platform, enter your monthly revenue — and see where every euro goes, every month and every year."
      es: "Elige tu plataforma, introduce tu facturación mensual — y mira adónde va cada euro, cada mes y cada año."
      it: "Scegli la tua piattaforma, inserisci il tuo fatturato mensile — e guarda dove finisce ogni euro, ogni mese e ogni anno."
      pt: "Escolhe a tua plataforma, indica a tua faturação mensal — e vê para onde vai cada euro, todos os meses e todos os anos."
      ar: "اختر منصتك، وأدخل رقم مبيعاتك الشهري — وشاهد أين يذهب كل يورو، كل شهر وكل سنة."
      he: "בחר את הפלטפורמה שלך, הקלד את המחזור החודשי — ותראה לאן הולך כל יורו, כל חודש וכל שנה."
  calc.lead_title:
    messages:
      fr: "La commission ronge ta marge."
      en: "Commission eats your margin."
      es: "La comisión se come tu margen."
      it: "La commissione ti divora il margine."
      pt: "A comissão corrói a tua margem."
      ar: "العمولة تلتهم هامش ربحك."
      he: "העמלה מכרסמת לך את הרווח."
  calc.loss_empty:
    messages:
      fr: "Entre ton chiffre d'affaires mensuel pour voir ce que la commission t'arrache."
      en: "Enter your monthly revenue to see what the commission strips from you."
      es: "Introduce tu facturación mensual para ver lo que te arranca la comisión."
      it: "Inserisci il tuo fatturato mensile per vedere quanto ti strappa la commissione."
      pt: "Indica a tua faturação mensal para veres o que a comissão te arranca."
      ar: "أدخل رقم مبيعاتك الشهري لترى ما تنتزعه منك العمولة."
      he: "הקלד את המחזור החודשי שלך כדי לראות מה העמלה חוטפת ממך."
  calc.loss_lead:
    messages:
      fr: "Cette plateforme t'arrache"
      en: "This platform strips you of"
      es: "Esta plataforma te arranca"
      it: "Questa piattaforma ti strappa"
      pt: "Esta plataforma arranca-te"
      ar: "هذه المنصة تنتزع منك"
      he: "הפלטפורמה הזאת חוטפת ממך"
  calc.loss_sub:
    params:
      perMonth: "formatted monthly commission, e.g. « 1 500 € »"
    messages:
      fr: "soit {perMonth} / mois — souvent plus que toute ta marge."
      en: "that's {perMonth} / month — often more than your entire margin."
      es: "es decir, {perMonth} / mes — a menudo más que todo tu margen."
      it: "cioè {perMonth} / mese — spesso più di tutto il tuo margine."
      pt: "ou seja {perMonth} / mês — muitas vezes mais do que toda a tua margem."
      ar: "أي {perMonth} / الشهر — غالبًا أكثر من كل هامش ربحك."
      he: "כלומר {perMonth} / חודש — לעיתים קרובות יותר מכל הרווח שלך."
  calc.loss_year_unit:
    messages:
      fr: "/ an"
      en: "/ year"
      es: "/ año"
      it: "/ anno"
      pt: "/ ano"
      ar: "/ السنة"
      he: "/ שנה"
  calc.platforms_aria:
    messages:
      fr: "Choisis ta plateforme"
      en: "Pick your platform"
      es: "Elige tu plataforma"
      it: "Scegli la tua piattaforma"
      pt: "Escolhe a tua plataforma"
      ar: "اختر منصتك"
      he: "בחר את הפלטפורמה שלך"
  calc.prefill:
    params:
      ca: "formatted monthly revenue"
      rate: "commission rate in percent"
      perMonth: "formatted monthly commission"
      perYear: "formatted yearly commission"
    messages:
      fr: "Via le calculateur : CA {ca}/mois sur la plateforme, commission ~{rate} % = {perMonth}/mois ({perYear}/an)."
      en: "Via the calculator: {ca}/month in revenue on the platform, ~{rate}% commission = {perMonth}/month ({perYear}/year)."
      es: "Vía la calculadora: facturación de {ca}/mes en la plataforma, comisión ~{rate} % = {perMonth}/mes ({perYear}/año)."
      it: "Dal calcolatore: fatturato {ca}/mese sulla piattaforma, commissione ~{rate}% = {perMonth}/mese ({perYear}/anno)."
      pt: "Via calculadora: faturação de {ca}/mês na plataforma, comissão ~{rate}% = {perMonth}/mês ({perYear}/ano)."
      ar: "عبر الحاسبة: مبيعات {ca}/الشهر على المنصة، عمولة ~{rate}% = {perMonth}/الشهر ({perYear}/السنة)."
      he: "דרך המחשבון: מחזור {ca}/חודש בפלטפורמה, עמלה של כ-{rate}% = {perMonth}/חודש ({perYear}/שנה)."
  calc.rate_hint:
    messages:
      fr: "(modifiable)"
      en: "(editable)"
      es: "(modificable)"
      it: "(modificabile)"
      pt: "(ajustável)"
      ar: "(قابلة للتعديل)"
      he: "(ניתן לשינוי)"
  calc.rate_label:
    messages:
      fr: "Taux de commission"
      en: "Commission rate"
      es: "Tasa de comisión"
      it: "Percentuale di commissione"
      pt: "Taxa de comissão"
      ar: "نسبة العمولة"
      he: "שיעור העמלה"
  calc.reassure:
    messages:
      fr: "0 € pour toi, dans tous les cas — <strong>c'est le client qui contribue, pas toi.</strong> <a href=\"financement.html\">Comment on se finance →</a>"
      en: "€0 for you, no matter what — <strong>the customer contributes, not you.</strong> <a href=\"financement.html\">How we fund ourselves →</a>"
      es: "0 € para ti, en todos los casos — <strong>contribuye el cliente, no tú.</strong> <a href=\"financement.html\">Cómo nos financiamos →</a>"
      it: "0 € per te, in ogni caso — <strong>è il cliente che contribuisce, non tu.</strong> <a href=\"financement.html\">Come ci finanziamo →</a>"
      pt: "0 € para ti, em qualquer caso — <strong>é o cliente que contribui, não tu.</strong> <a href=\"financement.html\">Como nos financiamos →</a>"
      ar: "0 € عليك، في كل الحالات — <strong>الزبون هو من يساهم، لا أنت.</strong> <a href=\"financement.html\">كيف نموّل أنفسنا ←</a>"
      he: "0 € בשבילך, בכל מקרה — <strong>הלקוח הוא שתורם, לא אתה.</strong> <a href=\"financement.html\">איך אנחנו מממנים את עצמנו →</a>"
  calc.smic:
    params:
      months: "number of SMIC salary-months the yearly commission equals, e.g. « 9,3 »"
    messages:
      fr: "C'est ≈ <strong>{months} mois de salaire</strong> au SMIC (charges comprises). Chaque année."
      en: "That's ≈ <strong>{months} months of salary</strong> at the SMIC, the French minimum wage (employer costs included). Every single year."
      es: "Eso son ≈ <strong>{months} meses de sueldo</strong> al SMIC, el salario mínimo francés (cotizaciones incluidas). Cada año."
      it: "Sono ≈ <strong>{months} mensilità</strong> allo SMIC, il salario minimo francese (contributi inclusi). Ogni anno."
      pt: "É ≈ <strong>{months} meses de salário</strong> ao SMIC (o salário mínimo francês, encargos incluídos). Todos os anos."
      ar: "هذا يعادل ≈ <strong>{months} شهرًا من الراتب</strong> بالحد الأدنى الفرنسي للأجور SMIC (شاملًا الأعباء). كل سنة."
      he: "זה ≈ <strong>{months} חודשי משכורת</strong> לפי SMIC, שכר המינימום הצרפתי (כולל הפרשות מעסיק). כל שנה."

  # ---- channel ----
  channel.delivery_body:
    messages:
      fr: "Tes clients commandent en ligne sur ton site, à ton nom. Pas d'intermédiaire qui se sert au passage."
      en: "Your customers order online on your site, under your name. No middleman helping themselves along the way."
      es: "Tus clientes piden online en tu web, con tu nombre. Sin intermediarios que se sirvan por el camino."
      it: "I tuoi clienti ordinano online sul tuo sito, a tuo nome. Nessun intermediario che si serve al passaggio."
      pt: "Os teus clientes encomendam online no teu site, com o teu nome. Sem intermediário a servir-se pelo caminho."
      ar: "زبائنك يطلبون أونلاين من موقعك، وباسمك. لا وسيط يقتطع نصيبه في الطريق."
      he: "הלקוחות שלך מזמינים אונליין באתר שלך, על שמך. בלי מתווך שגוזר קופון בדרך."
