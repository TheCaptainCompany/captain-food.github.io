  mockups.intro:
    messages:
      fr: "Voici la maquette du produit qu'on veut mettre en place. <strong>Rien n'est encore construit</strong> — c'est là qu'on a besoin de toi. Teste les vues client, restaurateur et livreur, puis fais tes retours sur le WhatsApp de la communauté ou via le formulaire sous chaque maquette."
      en: "Here's the mockup of the product we want to build. <strong>Nothing is built yet</strong> — and that's exactly where we need you. Try out the customer, restaurateur and rider views, then share your feedback on the community WhatsApp or via the form under each mockup."
      es: "Esta es la maqueta del producto que queremos levantar. <strong>Aún no hay nada construido</strong> — y ahí es donde te necesitamos. Prueba las vistas de cliente, hostelero y repartidor, y cuéntanos qué te parece en el WhatsApp de la comunidad o en el formulario bajo cada maqueta."
      it: "Ecco il mockup del prodotto che vogliamo realizzare. <strong>Non c'è ancora niente di costruito</strong> — ed è qui che abbiamo bisogno di te. Prova le viste cliente, ristoratore e rider, poi facci sapere sul WhatsApp della community o tramite il modulo sotto ogni mockup."
      pt: "Aqui está a maquete do produto que queremos pôr de pé. <strong>Ainda nada está construído</strong> — é aí que precisamos de ti. Testa as vistas de cliente, restaurador e estafeta, e depois dá-nos a tua opinião no WhatsApp da comunidade ou no formulário por baixo de cada maquete."
      de: "Hier ist das Mockup des Produkts, das wir bauen wollen. <strong>Noch ist nichts gebaut</strong> — genau da brauchen wir dich. Teste die Ansichten für Gäste, Gastronomen und Fahrer und gib dann dein Feedback in der WhatsApp-Community oder über das Formular unter jedem Mockup."
      tr: "İşte kurmak istediğimiz ürünün taslağı. <strong>Henüz hiçbir şey inşa edilmedi</strong> — sana tam da bu yüzden ihtiyacımız var. Müşteri, restorancı ve kurye ekranlarını dene, sonra görüşlerini topluluğun WhatsApp grubunda ya da her taslağın altındaki formdan bize ilet."
      el: "Να η μακέτα του προϊόντος που θέλουμε να στήσουμε. <strong>Τίποτα δεν έχει χτιστεί ακόμα</strong> — και ακριβώς εδώ σε χρειαζόμαστε. Δοκίμασε τις οθόνες πελάτη, εστιάτορα και διανομέα, και πες μας τη γνώμη σου στο WhatsApp της κοινότητας ή μέσα από τη φόρμα κάτω από κάθε μακέτα."
      ro: "Iată macheta produsului pe care vrem să-l punem pe picioare. <strong>Nimic nu e încă construit</strong> — exact aici avem nevoie de tine. Testează vederile de client, restaurator și curier, apoi spune-ne părerea pe WhatsApp-ul comunității sau prin formularul de sub fiecare machetă."
      zh: "这是我们想打造的产品原型。<strong>一切尚未建成</strong>——正因如此才需要你。试试客人端、餐厅端和骑手端的界面，然后在社区 WhatsApp 群里，或通过每个原型下方的表单告诉我们你的想法。"
      ja: "これが、私たちが作ろうとしているプロダクトのモックアップです。<strong>まだ何も完成していません</strong> — だからこそ、あなたの力が必要です。お客様・店主・配達員それぞれの画面を試して、コミュニティのWhatsAppか各モックアップ下のフォームから感想を聞かせてください。"
      th: "นี่คือแบบร่างของผลิตภัณฑ์ที่เราตั้งใจจะสร้าง <strong>ยังไม่มีอะไรถูกสร้างขึ้นจริง</strong> — และตรงนี้แหละที่เราต้องการคุณ ลองเล่นมุมมองของลูกค้า เจ้าของร้าน และไรเดอร์ แล้วส่งความเห็นมาทาง WhatsApp ของชุมชน หรือผ่านฟอร์มใต้แบบร่างแต่ละอัน"
      hi: "यह रहा उस प्रोडक्ट का मॉकअप जिसे हम खड़ा करना चाहते हैं। <strong>अभी कुछ भी बना नहीं है</strong> — और यहीं हमें आपकी ज़रूरत है। ग्राहक, रेस्टोरेंट मालिक और डिलीवरी-राइडर वाले व्यू आज़माइए, फिर कम्युनिटी के WhatsApp पर या हर मॉकअप के नीचे दिए फ़ॉर्म से अपनी राय भेजिए।"
      ta: "நாங்கள் உருவாக்க விரும்பும் தயாரிப்பின் மாதிரி இதோ. <strong>இன்னும் எதுவும் கட்டப்படவில்லை</strong> — இங்குதான் உங்கள் உதவி தேவை. வாடிக்கையாளர், உணவக உரிமையாளர், டெலிவரி பார்வைகளைச் சோதித்துவிட்டு, சமூக WhatsApp-ல் அல்லது ஒவ்வொரு மாதிரிக்கும் கீழுள்ள படிவத்தில் உங்கள் கருத்துகளைச் சொல்லுங்கள்."
      ar: "هذا نموذج المنتج الذي نريد إطلاقه. <strong>لم يُبنَ شيء بعد</strong> — وهنا بالضبط نحتاج إليك. جرّب واجهات الزبون وصاحب المطعم والسائق، ثم شاركنا ملاحظاتك على مجموعة WhatsApp الخاصة بالمجتمع أو عبر الاستمارة أسفل كل نموذج."
      ar-lb: "هيدي نماذج المنتج يلّي بدنا نعمله. <strong>لسّا ما في شي مبني</strong> — وهون نحنا محتاجينك. جرّب شاشات الزبون وصاحب المطعم والدليفري، وبعدين خبّرنا رأيك على غروب الـWhatsApp تبع المجموعة أو بالفورم يلّي تحت كل نموذج."
      he: "הנה המוקאפ של המוצר שאנחנו רוצים להקים. <strong>עוד לא בנינו כלום</strong> — ובדיוק בגלל זה אנחנו צריכים אותך. נסה את תצוגות הלקוח, המסעדן והשליח, ואז שתף פידבק ב-WhatsApp של הקהילה או בטופס שמתחת לכל מוקאפ."
  mockups.note:
    messages:
      fr: "Sous chaque maquette, un formulaire pour laisser ton avis. On avance ensemble. ⚓"
      en: "Under each mockup, a form to leave your feedback. We move forward together. ⚓"
      es: "Bajo cada maqueta, un formulario para dejar tu opinión. Avanzamos juntos. ⚓"
      it: "Sotto ogni mockup, un modulo per lasciare la tua opinione. Andiamo avanti insieme. ⚓"
      pt: "Por baixo de cada maquete, um formulário para deixares a tua opinião. Avançamos juntos. ⚓"
      de: "Unter jedem Mockup findest du ein Formular für dein Feedback. Wir kommen gemeinsam voran. ⚓"
      tr: "Her taslağın altında görüşünü bırakabileceğin bir form var. Birlikte ilerliyoruz. ⚓"
      el: "Κάτω από κάθε μακέτα, μια φόρμα για τη γνώμη σου. Προχωράμε μαζί. ⚓"
      ro: "Sub fiecare machetă, un formular unde îți lași părerea. Înaintăm împreună. ⚓"
      zh: "每个原型下方都有表单，等你留下意见。我们一起前进。⚓"
      ja: "各モックアップの下に、感想を残せるフォームがあります。一緒に進みましょう。⚓"
      th: "ใต้แบบร่างแต่ละอันมีฟอร์มให้คุณแสดงความเห็น เราเดินหน้าไปด้วยกัน ⚓"
      hi: "हर मॉकअप के नीचे अपनी राय देने के लिए एक फ़ॉर्म है। हम साथ-साथ आगे बढ़ते हैं। ⚓"
      ta: "ஒவ்வொரு மாதிரிக்கும் கீழே உங்கள் கருத்துக்கான படிவம். ஒன்றாக முன்னேறுவோம். ⚓"
      ar: "أسفل كل نموذج، استمارة لترك رأيك. نتقدم معًا. ⚓"
      ar-lb: "تحت كل نموذج، في فورم لتترك رأيك. عم نتقدّم سوا. ⚓"
      he: "מתחת לכל מוקאפ יש טופס להשארת פידבק. מתקדמים יחד. ⚓"
  mockups.resto_desc:
    messages:
      fr: "Recevoir les commandes, gérer sa carte, voir sa journée."
      en: "Receive orders, manage your menu, see your day at a glance."
      es: "Recibir los pedidos, gestionar la carta, ver el día de un vistazo."
      it: "Ricevere gli ordini, gestire il menu, vedere la propria giornata."
      pt: "Receber as encomendas, gerir o menu, ver o dia num relance."
      de: "Bestellungen empfangen, die Speisekarte pflegen, den Tag im Blick behalten."
      tr: "Siparişleri al, menünü yönet, gününü gör."
      el: "Λήψη παραγγελιών, διαχείριση μενού, εικόνα της ημέρας."
      ro: "Primești comenzile, îți gestionezi meniul, îți vezi ziua dintr-o privire."
      zh: "接单、管理菜单、纵览当天营业。"
