  # ---- who ----
  who.card1_body:
    messages:
      fr: "qui en ont assez de travailler pour la commission des autres."
      en: "tired of working to pay someone else's commission."
      es: "que están hartos de trabajar para la comisión de otros."
      it: "che ne hanno abbastanza di lavorare per le commissioni degli altri."
      pt: "que estão fartos de trabalhar para a comissão dos outros."
      de: "die es satthaben, für die Provision anderer zu arbeiten."
      tr: "başkalarının komisyonu için çalışmaktan bıkanlar."
      el: "που βαρέθηκαν να δουλεύουν για την προμήθεια των άλλων."
      ro: "sătule să muncească pentru comisionul altora."
      zh: "受够了辛苦干活，却在给别人的佣金打工。"
      ja: "他人の手数料のために働くのは、もううんざりという方。"
      th: "ที่เบื่อเต็มทีกับการทำงานเพื่อจ่ายค่าคอมมิชชั่นให้คนอื่น"
      hi: "जो दूसरों के कमीशन के लिए खटते-खटते थक चुके हैं।"
      ta: "மற்றவர்களின் கமிஷனுக்காக உழைத்துச் சலித்துப்போனவர்கள்."
      ar: "التي سئمت العمل لتسديد عمولات الآخرين."
      ar-lb: "يلّي طفح فيها الكيل من الشغل لتدفع عمولة غيرها."
      he: "שנמאס להן לעבוד בשביל העמלה של אחרים."
