  hero.sub:
    messages:
      fr: "Tes plats à tes prix, tes clients à toi. <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> veut te rendre ce que les grandes plateformes t'ont pris."
      en: "Your dishes at your prices, your customers as your own. <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> is here to give you back what the big platforms took from you."
      es: "Tus platos a tus precios, tus clientes para ti. <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> quiere devolverte lo que las grandes plataformas te han quitado."
      it: "I tuoi piatti ai tuoi prezzi, i tuoi clienti tutti tuoi. <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> vuole restituirti quello che le grandi piattaforme ti hanno preso."
      pt: "Os teus pratos aos teus preços, os teus clientes só teus. A <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> quer devolver-te o que as grandes plataformas te tiraram."
      de: "Deine Gerichte zu deinen Preisen, deine Gäste gehören dir. <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> will dir zurückgeben, was die großen Plattformen dir genommen haben."
      tr: "Kendi fiyatlarınla kendi yemeklerin, kendi müşterilerin. <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>, büyük platformların senden aldığını sana geri vermek istiyor."
      el: "Τα πιάτα σου στις τιμές σου, οι πελάτες σου δικοί σου. Το <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> θέλει να σου επιστρέψει ό,τι σου πήραν οι μεγάλες πλατφόρμες."
      ro: "Preparatele tale la prețurile tale, clienții tăi rămân ai tăi. <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> vrea să-ți dea înapoi ce ți-au luat marile platforme."
      zh: "你的菜你定价，你的客人归你。<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> 要把大平台从你手里拿走的，一样样还给你。"
      ja: "あなたの料理をあなたの価格で、お客様はあなたのもの。<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>は、大手プラットフォームに奪われたものをあなたに返します。"
      th: "อาหารของคุณในราคาของคุณ ลูกค้าเป็นของคุณ <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> อยากคืนสิ่งที่แพลตฟอร์มยักษ์ใหญ่เอาไปจากคุณ"
      hi: "आपके पकवान आपके दामों पर, आपके ग्राहक सिर्फ़ आपके। <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> आपको वह लौटाना चाहता है जो बड़ी प्लेटफ़ॉर्मों ने आपसे छीन लिया।"
      ta: "உங்கள் உணவுகள் உங்கள் விலையில், உங்கள் வாடிக்கையாளர்கள் உங்களுக்கே. பெரிய தளங்கள் உங்களிடமிருந்து பறித்ததை <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> உங்களிடம் திரும்பத் தர விரும்புகிறது."
      ar: "أطباقك بأسعارك، وزبائنك ملك لك. <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> يريد أن يعيد إليك ما أخذته منك المنصات الكبرى."
      ar-lb: "أكلك بأسعارك، وزبايناتك إلك إنت. <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> بدها ترجّعلك يلّي أخدوه منّك المنصّات الكبيرة."
      he: "המנות שלך במחירים שלך, והלקוחות — שלך בלבד. <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> רוצה להחזיר לך את מה שהפלטפורמות הגדולות לקחו ממך."
