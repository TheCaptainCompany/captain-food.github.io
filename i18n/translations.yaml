      es: "30 € por tus platos + 2,99 € de contribución libre del cliente (ejemplo)"
      it: "30 € per i tuoi piatti + 2,99 € di contributo libero del cliente (esempio)"
      pt: "30 € pelos teus pratos + 2,99 € de contribuição livre do cliente (exemplo)"
      de: "30 € für deine Gerichte + 2,99 € freiwilliger Beitrag des Gastes (Beispiel)"
      tr: "Yemeklerin için 30 € + müşterinin 2,99 € gönüllü katkısı (örnek)"
      el: "30 € για τα πιάτα σου + 2,99 € ελεύθερη συνεισφορά του πελάτη (παράδειγμα)"
      ro: "30 € pentru preparatele tale + 2,99 € contribuție liberă a clientului (exemplu)"
      zh: "30 € 菜品 + 2,99 € 客人随心支持金（示例）"
      ja: "料理代30€ ＋ お客様の任意の応援金2.99€（一例）"
