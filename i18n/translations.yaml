  # ---- example ----
  example.compare:
    messages:
      fr: "Sur une plateforme à ~30 % de commission, il ne te resterait qu'environ <strong>21 €</strong> sur la même commande."
      en: "On a platform charging ~30% commission, you'd be left with only about <strong>€21</strong> on the same order."
      es: "En una plataforma con ~30 % de comisión, del mismo pedido te quedarían solo unos <strong>21 €</strong>."
      it: "Su una piattaforma con ~30% di commissione, dello stesso ordine ti resterebbero solo <strong>21 €</strong> circa."
      pt: "Numa plataforma com ~30% de comissão, sobrar-te-iam apenas cerca de <strong>21 €</strong> na mesma encomenda."
      ar: "على منصة بعمولة ~30%، لن يبقى لك سوى نحو <strong>21 €</strong> من الطلب نفسه."
      he: "בפלטפורמה עם כ-30% עמלה, היו נשארים לך רק בערך <strong>21 €</strong> מאותה הזמנה."
  example.delivery:
    messages:
      fr: "S'il s'agit d'une commande <strong>livrée</strong> (canal à venir), un coût de service s'ajoutera pour payer le livreur dignement — partagé avec le client et plafonné par la marge que tu fixes, jamais une commission. <a href=\"livraison.html\">Voir comment on paiera la livraison →</a>"
      en: "If it's a <strong>delivered</strong> order (a channel to come), a service cost will be added to pay the rider decently — shared with the customer and capped by the margin you set, never a commission. <a href=\"livraison.html\">See how we'll pay for delivery →</a>"
      es: "Si es un pedido <strong>a domicilio</strong> (canal por llegar), se añadirá un coste de servicio para pagar dignamente al repartidor — compartido con el cliente y limitado por el margen que tú fijes, nunca una comisión. <a href=\"livraison.html\">Ver cómo pagaremos el reparto →</a>"
      it: "Se si tratta di un ordine <strong>consegnato</strong> (canale in arrivo), si aggiungerà un costo di servizio per pagare dignitosamente il rider — condiviso con il cliente e limitato dal margine che fissi tu, mai una commissione. <a href=\"livraison.html\">Guarda come pagheremo la consegna →</a>"
      pt: "Se for uma encomenda <strong>entregue</strong> (canal a chegar), acrescentar-se-á um custo de serviço para pagar dignamente ao estafeta — partilhado com o cliente e limitado pela margem que tu defines, nunca uma comissão. <a href=\"livraison.html\">Ver como pagaremos a entrega →</a>"
      ar: "إذا كان الطلب <strong>مع التوصيل</strong> (قناة قادمة)، ستُضاف تكلفة خدمة لدفع أجر كريم للسائق — تُتقاسم مع الزبون وتُسقَّف بالهامش الذي تحدده أنت، وليست عمولة أبدًا. <a href=\"livraison.html\">شاهد كيف سندفع أجر التوصيل ←</a>"
      he: "אם מדובר בהזמנה <strong>במשלוח</strong> (ערוץ שעוד יגיע), תתווסף עלות שירות כדי לשלם לשליח בכבוד — מתחלקת עם הלקוח ומוגבלת לפי הרווח שאתה קובע, לעולם לא עמלה. <a href=\"livraison.html\">איך נשלם על המשלוח →</a>"
  example.detail:
    messages:
      fr: "30 € pour tes plats + 2,99 € de contribution libre du client (exemple)"
      en: "€30 for your dishes + a €2.99 pay-what-you-want customer contribution (example)"
      es: "30 € por tus platos + 2,99 € de contribución libre del cliente (ejemplo)"
      it: "30 € per i tuoi piatti + 2,99 € di contributo libero del cliente (esempio)"
      pt: "30 € pelos teus pratos + 2,99 € de contribuição livre do cliente (exemplo)"
      ar: "30 € لأطباقك + 2,99 € مساهمة حرة من الزبون (مثال)"
      he: "30 € על המנות שלך + 2.99 € תרומה חופשית של הלקוח (דוגמה)"
  example.fine:
    messages:
      fr: "Montants donnés à titre d'exemple pour illustrer le principe, pas une grille tarifaire."
      en: "Amounts shown as an example to illustrate the principle, not a price list."
      es: "Importes a título de ejemplo para ilustrar el principio, no una tabla de tarifas."
      it: "Importi dati a titolo di esempio per illustrare il principio, non un listino."
      pt: "Montantes dados a título de exemplo para ilustrar o princípio, não uma tabela de preços."
      ar: "المبالغ معروضة كمثال لتوضيح المبدأ، وليست جدول أسعار."
      he: "הסכומים ניתנים כדוגמה להמחשת העיקרון, לא מחירון."
  example.note:
    messages:
      fr: "Le client ne souhaite pas contribuer ? C'est OK, sans jugement : pas de contribution sur cette commande. <strong>Toi, tu ne verses aucune commission sur tes plats, dans tous les cas.</strong>"
      en: "The customer doesn't want to contribute? That's fine, no judgment: no contribution on that order. <strong>You never pay any commission on your dishes, no matter what.</strong>"
      es: "¿El cliente no quiere contribuir? No pasa nada, sin juicios: sin contribución en ese pedido. <strong>Tú no pagas ninguna comisión sobre tus platos, en ningún caso.</strong>"
      it: "Il cliente non vuole contribuire? Va bene, senza giudizi: nessun contributo su quell'ordine. <strong>Tu, in ogni caso, non versi nessuna commissione sui tuoi piatti.</strong>"
      pt: "O cliente não quer contribuir? Tudo bem, sem julgamentos: não há contribuição nessa encomenda. <strong>Tu não pagas nenhuma comissão sobre os teus pratos, em qualquer caso.</strong>"
      ar: "الزبون لا يرغب في المساهمة؟ لا بأس، وبلا أي إحراج: لا مساهمة على هذا الطلب. <strong>أما أنت، فلا تدفع أي عمولة على أطباقك، في كل الحالات.</strong>"
      he: "הלקוח לא רוצה לתרום? זה בסדר, בלי שיפוטיות: אין תרומה על ההזמנה הזאת. <strong>אתה לא משלם שום עמלה על המנות שלך, בכל מקרה.</strong>"
