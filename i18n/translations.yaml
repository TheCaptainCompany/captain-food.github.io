  success.text:
    messages:
      fr: "On te recontacte très vite. Envie d'échanger tout de suite ?"
      en: "We'll get back to you very soon. Want to chat right away?"
      es: "Te contactamos muy pronto. ¿Quieres hablar ya mismo?"
      it: "Ti ricontattiamo prestissimo. Vuoi parlarne subito?"
      pt: "Contactamos-te muito em breve. Queres falar já?"
      de: "Wir melden uns ganz bald bei dir. Lust, gleich loszulegen?"
      tr: "En kısa sürede seni arayacağız. Hemen sohbet etmek ister misin?"
      el: "Θα σε βρούμε πολύ σύντομα. Θες να τα πούμε αμέσως;"
      ro: "Revenim spre tine foarte curând. Vrei să stăm de vorbă chiar acum?"
      zh: "我们会很快联系你。想现在就聊聊？"
      ja: "近いうちにご連絡します。今すぐ話したいですか？"
      th: "เราจะติดต่อกลับเร็ว ๆ นี้ อยากคุยกันเลยตอนนี้ไหม?"
      hi: "हम बहुत जल्द आपसे संपर्क करेंगे। अभी बात करने का मन है?"
      ta: "விரைவிலேயே உங்களைத் தொடர்பு கொள்கிறோம். இப்போதே பேச விருப்பமா?"
      ar: "سنتواصل معك قريبًا جدًا. تريد الحديث فورًا؟"
      ar-lb: "منرجعلك بأسرع وقت. حابب نحكي هلّق دغري؟"
      he: "נחזור אליך ממש בקרוב. בא לך לדבר כבר עכשיו?"
