      tr: "Her taslağın altında görüşünü bırakabileceğin bir form var. Birlikte ilerliyoruz. ⚓"
      el: "Κάτω από κάθε μακέτα, μια φόρμα για τη γνώμη σου. Προχωράμε μαζί. ⚓"
