      tr: "Tours'un bağımsız restoranları için %0 komisyonlu online sipariş. Yemeklerin, fiyatların, müşterilerin senin. Kâr amacı gütmeyen yerel proje (hedef: SCIC, ESUS)."
      el: "Online παραγγελίες με 0% προμήθεια για ανεξάρτητα εστιατόρια και food trucks στην Tours. Τα πιάτα σου, οι τιμές σου, οι πελάτες σου. Μη κερδοσκοπικό τοπικό project."
      ro: "Comenzi online cu 0% comision pentru restaurantele și food truck-urile independente din Tours. Preparatele tale, prețurile tale, clienții tăi. Proiect local non-profit."
      zh: "为 Tours 的独立餐厅和餐车打造的0%佣金在线点餐平台。你的菜、你的价、你的客人。本地非营利项目（目标取得 SCIC 合作社与 ESUS 认证——均为法国社会互助经济法律地位）。"
      ja: "Toursの独立系レストラン＆フードトラックのための手数料0%オンライン注文。あなたの料理、あなたの価格、あなたのお客様。地域密着の非営利プロジェクト（フランスの協同組合SCIC・ESUS認定の取得を目指しています）。"
      th: "สั่งอาหารออนไลน์แบบ 0% ค่าคอมมิชชั่น สำหรับร้านอาหารและฟู้ดทรัคอิสระในเมือง Tours อาหารของคุณ ราคาของคุณ ลูกค้าของคุณ โครงการท้องถิ่นไม่แสวงหากำไร (ตั้งเป้าเป็นสหกรณ์ SCIC และขอการรับรอง ESUS ตามกฎหมายฝรั่งเศส)"
      hi: "Tours के स्वतंत्र रेस्टोरेंट और फ़ूड ट्रकों के लिए 0% कमीशन ऑनलाइन ऑर्डरिंग। आपके पकवान, आपके दाम, आपके ग्राहक। स्थानीय गैर-लाभकारी परियोजना (लक्ष्य: SCIC सहकारी और ESUS दर्जा — फ़्रांस के क़ानूनी दर्जे)।"
      ta: "Tours நகரின் சுயாதீன உணவகங்கள் மற்றும் ஃபுட் டிரக்குகளுக்கான 0% கமிஷன் ஆன்லைன் ஆர்டர். உங்கள் உணவுகள், உங்கள் விலைகள், உங்கள் வாடிக்கையாளர்கள். இலாப நோக்கமற்ற உள்ளூர் திட்டம் (SCIC கூட்டுறவு, ESUS அங்கீகாரம் — எங்கள் இலக்குகள்)."
      ar: "طلب أونلاين بدون أي عمولة لمطاعم وشاحنات الطعام المستقلة في Tours. أطباقك، أسعارك، زبائنك. مشروع محلي غير ربحي يستهدف وضع SCIC التعاوني واعتماد ESUS الفرنسيين."
      ar-lb: "طلب أونلاين بـ0% عمولة للمطاعم والفود تراكس المستقلّين بـTours. أكلك، أسعارك، زبايناتك. مشروع محلّي غير ربحي (هدفنا تعاونية SCIC واعتماد ESUS بفرنسا)."
      he: "הזמנות אונליין בלי עמלות למסעדות ולפודטראקים עצמאיים ב-Tours שבצרפת. המנות שלך, המחירים שלך, הלקוחות שלך. מיזם מקומי ללא מטרות רווח (יעד: מעמד SCIC קואופרטיבי והכרת ESUS)."
