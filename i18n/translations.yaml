  footer.langs:
    messages:
      fr: "Captain.Food parlera, à terme, les 16 langues de cette page : français, anglais, espagnol, italien, portugais, allemand, turc, grec, roumain, arabe, arabe libanais, hébreu, chinois (mandarin), japonais, thaï et hindi."
      en: "In time, Captain.Food will speak this page's 16 languages: French, English, Spanish, Italian, Portuguese, German, Turkish, Greek, Romanian, Arabic, Lebanese Arabic, Hebrew, Chinese (Mandarin), Japanese, Thai and Hindi."
      es: "Con el tiempo, Captain.Food hablará los 16 idiomas de esta página: francés, inglés, español, italiano, portugués, alemán, turco, griego, rumano, árabe, árabe libanés, hebreo, chino (mandarín), japonés, tailandés e hindi."
      it: "Col tempo, Captain.Food parlerà le 16 lingue di questa pagina: francese, inglese, spagnolo, italiano, portoghese, tedesco, turco, greco, rumeno, arabo, arabo libanese, ebraico, cinese (mandarino), giapponese, thailandese e hindi."
      pt: "A prazo, a Captain.Food falará as 16 línguas desta página: francês, inglês, espanhol, italiano, português, alemão, turco, grego, romeno, árabe, árabe libanês, hebraico, chinês (mandarim), japonês, tailandês e hindi."
      de: "Mit der Zeit wird Captain.Food die 16 Sprachen dieser Seite sprechen: Französisch, Englisch, Spanisch, Italienisch, Portugiesisch, Deutsch, Türkisch, Griechisch, Rumänisch, Arabisch, Libanesisches Arabisch, Hebräisch, Chinesisch (Mandarin), Japanisch, Thailändisch und Hindi."
      tr: "Zamanla Captain.Food bu sayfanın 16 dilini konuşacak: Fransızca, İngilizce, İspanyolca, İtalyanca, Portekizce, Almanca, Türkçe, Yunanca, Rumence, Arapça, Lübnan Arapçası, İbranice, Çince (Mandarin), Japonca, Tayca ve Hintçe."
      el: "Με τον καιρό, το Captain.Food θα μιλά τις 16 γλώσσες αυτής της σελίδας: γαλλικά, αγγλικά, ισπανικά, ιταλικά, πορτογαλικά, γερμανικά, τουρκικά, ελληνικά, ρουμανικά, αραβικά, λιβανέζικα αραβικά, εβραϊκά, κινεζικά (μανδαρινικά), ιαπωνικά, ταϊλανδικά και χίντι."
      ar: "مع الوقت، سيتحدث Captain.Food لغات هذه الصفحة الست عشرة: الفرنسية والإنجليزية والإسبانية والإيطالية والبرتغالية والألمانية والتركية واليونانية والرومانية والعربية والعربية اللبنانية والعبرية والصينية (الماندرين) واليابانية والتايلاندية والهندية."
      he: "עם הזמן, Captain.Food ידבר את 16 השפות של הדף הזה: צרפתית, אנגלית, ספרדית, איטלקית, פורטוגזית, גרמנית, טורקית, יוונית, רומנית, ערבית, ערבית לבנונית, עברית, סינית (מנדרינית), יפנית, תאית והינדי."
