      en: "<em>“Take back your orders!”</em><br><em>A local, solidarity-driven alternative, in Tours.</em>"
      es: "<em>«¡Recuperemos el mando!»</em><br><em>Una alternativa local y solidaria, en Tours.</em>"
      it: "<em>«Riprendiamoci le comande!»</em><br><em>Un'alternativa locale e solidale, a Tours.</em>"
      pt: "<em>«Retomemos as comandas!»</em><br><em>Uma alternativa local e solidária, em Tours.</em>"
      de: "<em>„Zurück ans Ruder!“</em><br><em>Eine lokale, solidarische Alternative in Tours.</em>"
      tr: "<em>« Dümeni geri alalım! »</em><br><em>Tours'da yerel ve dayanışmacı bir alternatif.</em>"
      el: "<em>«Παίρνουμε πίσω το τιμόνι!»</em><br><em>Μια τοπική και αλληλέγγυα εναλλακτική, στην Tours.</em>"
      ro: "<em>„Preluăm comenzile!”</em><br><em>O alternativă locală și solidară, la Tours.</em>"
      zh: "<em>「把订单夺回来！」</em><br><em>本地互助的替代方案，就在 Tours。</em>"
      ja: "<em>「注文の舵を取り戻そう！」</em><br><em>Toursの、地域と連帯の選択肢。</em>"
      th: "<em>« ทวงคืนออร์เดอร์ของเรากันเถอะ! »</em><br><em>ทางเลือกท้องถิ่นเพื่อสังคม ที่เมือง Tours</em>"
      hi: "<em>« आइए, कमान वापस थामें! »</em><br><em>एक स्थानीय और सहयोगी विकल्प — Tours में।</em>"
      ta: "<em>« சுக்கானை மீண்டும் கையில் எடுப்போம்! »</em><br><em>Tours-ல் ஒரு உள்ளூர், ஒற்றுமை மாற்று.</em>"
      ar: "<em>«لنستعيد زمام الطلبات!»</em><br><em>بديل محلي وتضامني، في Tours.</em>"
      ar-lb: "<em>« رجّع الطلبات لإيدك! »</em><br><em>بديل محلّي وتضامني، بـTours.</em>"
      he: "<em>״לוקחים בחזרה את ההגה!״</em><br><em>אלטרנטיבה מקומית וסולידרית, ב-Tours.</em>"

  # ---- form ----
  form.consent:
    messages:
      fr: "J'accepte que mes coordonnées soient utilisées par <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> pour me recontacter au sujet de ce projet. Elles ne seront ni revendues, ni partagées. Je peux demander leur suppression à tout moment. <a href=\"confidentialite.html\">Voir la politique de confidentialité</a>. <span class=\"req\" aria-hidden=\"true\">*</span>"
      en: "I agree that my contact details may be used by <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> to get back to me about this project. They will never be sold or shared. I can ask for them to be deleted at any time. <a href=\"confidentialite.html\">See the privacy policy</a>. <span class=\"req\" aria-hidden=\"true\">*</span>"
      es: "Acepto que <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> use mis datos de contacto para escribirme sobre este proyecto. No se venderán ni se compartirán. Puedo pedir que se eliminen en cualquier momento. <a href=\"confidentialite.html\">Ver la política de privacidad</a>. <span class=\"req\" aria-hidden=\"true\">*</span>"
      it: "Accetto che i miei dati di contatto siano usati da <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> per ricontattarmi riguardo a questo progetto. Non saranno né rivenduti né condivisi. Posso chiederne la cancellazione in qualsiasi momento. <a href=\"confidentialite.html\">Leggi l'informativa sulla privacy</a>. <span class=\"req\" aria-hidden=\"true\">*</span>"
      pt: "Aceito que os meus dados de contacto sejam utilizados pela <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> para me contactar sobre este projeto. Não serão revendidos nem partilhados. Posso pedir a sua eliminação a qualquer momento. <a href=\"confidentialite.html\">Ver a política de privacidade</a>. <span class=\"req\" aria-hidden=\"true\">*</span>"
      de: "Ich bin einverstanden, dass <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> meine Kontaktdaten nutzt, um mich zu diesem Projekt zu kontaktieren. Sie werden weder verkauft noch weitergegeben. Ich kann jederzeit ihre Löschung verlangen. <a href=\"confidentialite.html\">Zur Datenschutzerklärung</a>. <span class=\"req\" aria-hidden=\"true\">*</span>"
      tr: "İletişim bilgilerimin, bu proje hakkında benimle iletişime geçmek üzere <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> tarafından kullanılmasını kabul ediyorum. Bilgilerim satılmaz ve paylaşılmaz. Silinmelerini istediğim an talep edebilirim. <a href=\"confidentialite.html\">Gizlilik politikasına bak</a>. <span class=\"req\" aria-hidden=\"true\">*</span>"
      el: "Δέχομαι τα στοιχεία μου να χρησιμοποιηθούν από το <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> για να επικοινωνήσει μαζί μου σχετικά με αυτό το project. Δεν θα πουληθούν ούτε θα μοιραστούν με κανέναν. Μπορώ να ζητήσω τη διαγραφή τους ανά πάσα στιγμή. <a href=\"confidentialite.html\">Δες την πολιτική απορρήτου</a>. <span class=\"req\" aria-hidden=\"true\">*</span>"
      ro: "Sunt de acord ca datele mele de contact să fie folosite de <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> pentru a mă recontacta în legătură cu acest proiect. Nu vor fi nici vândute, nici partajate. Pot cere ștergerea lor oricând. <a href=\"confidentialite.html\">Vezi politica de confidențialitate</a>. <span class=\"req\" aria-hidden=\"true\">*</span>"
      zh: "我同意 <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> 使用我的联系方式，就本项目与我联系。这些信息绝不会被出售或共享，我可以随时要求删除。<a href=\"confidentialite.html\">查看隐私政策</a>。<span class=\"req\" aria-hidden=\"true\">*</span>"
      ja: "この計画について連絡を受け取るため、<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>が私の連絡先を使用することに同意します。連絡先が転売・共有されることはありません。削除はいつでも依頼できます。<a href=\"confidentialite.html\">プライバシーポリシーを見る</a>。<span class=\"req\" aria-hidden=\"true\">*</span>"
      th: "ฉันยินยอมให้ <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> ใช้ข้อมูลติดต่อของฉันเพื่อติดต่อกลับเกี่ยวกับโครงการนี้ ข้อมูลจะไม่ถูกขายต่อหรือแบ่งปันให้ใคร และฉันขอให้ลบข้อมูลได้ทุกเมื่อ <a href=\"confidentialite.html\">ดูนโยบายความเป็นส่วนตัว</a> <span class=\"req\" aria-hidden=\"true\">*</span>"
      hi: "मैं सहमत हूँ कि <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> मेरी संपर्क-जानकारी का उपयोग इस परियोजना के सिलसिले में मुझसे दोबारा संपर्क करने के लिए करे। यह जानकारी न बेची जाएगी, न साझा की जाएगी। मैं कभी भी इसे हटाने की माँग कर सकता/सकती हूँ। <a href=\"confidentialite.html\">गोपनीयता नीति देखें</a>। <span class=\"req\" aria-hidden=\"true\">*</span>"
      ta: "இந்தத் திட்டம் குறித்து என்னைத் தொடர்பு கொள்ள <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> என் தொடர்பு விவரங்களைப் பயன்படுத்த ஒப்புக்கொள்கிறேன். அவை விற்கப்படவோ பகிரப்படவோ மாட்டா. எப்போது வேண்டுமானாலும் அவற்றை நீக்கக் கோரலாம். <a href=\"confidentialite.html\">தனியுரிமைக் கொள்கையைப் பார்க்க</a>. <span class=\"req\" aria-hidden=\"true\">*</span>"
      ar: "أوافق على أن تستخدم <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> بياناتي للتواصل معي بخصوص هذا المشروع. لن تُباع ولن تُشارَك مع أي جهة. ويمكنني طلب حذفها في أي وقت. <a href=\"confidentialite.html\">اطّلع على سياسة الخصوصية</a>. <span class=\"req\" aria-hidden=\"true\">*</span>"
      ar-lb: "موافق إنّه <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> يستعمل معلوماتي ليرجعلي بخصوص هالمشروع. ما رح تنباع ولا تنشارك مع حدا. وفيني اطلب مسحها بأي وقت. <a href=\"confidentialite.html\">شوف سياسة الخصوصية</a>. <span class=\"req\" aria-hidden=\"true\">*</span>"
      he: "אני מאשר ש-<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> ישתמש בפרטים שלי כדי לחזור אליי בנוגע לפרויקט הזה. הם לא יימכרו ולא ישותפו. אני יכול לבקש למחוק אותם בכל רגע. <a href=\"confidentialite.html\">למדיניות הפרטיות</a>. <span class=\"req\" aria-hidden=\"true\">*</span>"
