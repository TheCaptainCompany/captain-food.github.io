  # ---- example ----
  example.compare:
    messages:
      fr: "Sur une plateforme à ~30 % de commission, il ne te resterait qu'environ <strong>21 €</strong> sur la même commande."
      en: "On a platform charging ~30% commission, you'd be left with only about <strong>€21</strong> on the same order."
      es: "En una plataforma con ~30 % de comisión, del mismo pedido te quedarían solo unos <strong>21 €</strong>."
      it: "Su una piattaforma con ~30% di commissione, dello stesso ordine ti resterebbero solo <strong>21 €</strong> circa."
      pt: "Numa plataforma com ~30% de comissão, sobrar-te-iam apenas cerca de <strong>21 €</strong> na mesma encomenda."
      de: "Auf einer Plattform mit ~30 % Provision blieben dir bei derselben Bestellung nur rund <strong>21 €</strong>."
      tr: "~%30 komisyonlu bir platformda aynı siparişten eline yalnızca yaklaşık <strong>21 €</strong> geçerdi."
      el: "Σε μια πλατφόρμα με ~30 % προμήθεια, από την ίδια παραγγελία θα σου έμεναν μόνο περίπου <strong>21 €</strong>."
      ro: "Pe o platformă cu ~30% comision, ți-ar rămâne doar vreo <strong>21 €</strong> din aceeași comandă."
      zh: "换作一家抽约30%佣金的平台，同样这一单你只能剩下约<strong>21 €</strong>。"
      ja: "手数料約30%のプラットフォームなら、同じ注文で手元に残るのは約<strong>21€</strong>です。"
      th: "บนแพลตฟอร์มที่เก็บค่าคอมมิชชั่น ~30 % ออร์เดอร์เดียวกันนี้จะเหลือถึงมือคุณแค่ราว <strong>21 €</strong>"
      hi: "~30% कमीशन वाली किसी प्लेटफ़ॉर्म पर इसी ऑर्डर से आपके हाथ में क़रीब <strong>21 €</strong> ही बचते।"
      ta: "~30 % கமிஷன் தளத்தில், அதே ஆர்டரில் உங்களுக்கு எஞ்சுவது சுமார் <strong>21 €</strong> மட்டுமே."
      ar: "على منصة بعمولة ~30%، لن يبقى لك سوى نحو <strong>21 €</strong> من الطلب نفسه."
      ar-lb: "على منصّة بعمولة ~30%، كان رح يضلّلك بس حوالي <strong>21 €</strong> من نفس الطلب."
      he: "בפלטפורמה עם כ-30% עמלה, היו נשארים לך רק בערך <strong>21 €</strong> מאותה הזמנה."
  example.delivery:
    messages:
      fr: "S'il s'agit d'une commande <strong>livrée</strong> (canal à venir), un coût de service s'ajoutera pour payer le livreur dignement — partagé avec le client et plafonné par la marge que tu fixes, jamais une commission. <a href=\"livraison.html\">Voir comment on paiera la livraison →</a>"
      en: "If it's a <strong>delivered</strong> order (a channel to come), a service cost will be added to pay the rider decently — shared with the customer and capped by the margin you set, never a commission. <a href=\"livraison.html\">See how we'll pay for delivery →</a>"
      es: "Si es un pedido <strong>a domicilio</strong> (canal por llegar), se añadirá un coste de servicio para pagar dignamente al repartidor — compartido con el cliente y limitado por el margen que tú fijes, nunca una comisión. <a href=\"livraison.html\">Ver cómo pagaremos el reparto →</a>"
      it: "Se si tratta di un ordine <strong>consegnato</strong> (canale in arrivo), si aggiungerà un costo di servizio per pagare dignitosamente il rider — condiviso con il cliente e limitato dal margine che fissi tu, mai una commissione. <a href=\"livraison.html\">Guarda come pagheremo la consegna →</a>"
      pt: "Se for uma encomenda <strong>entregue</strong> (canal a chegar), acrescentar-se-á um custo de serviço para pagar dignamente ao estafeta — partilhado com o cliente e limitado pela margem que tu defines, nunca uma comissão. <a href=\"livraison.html\">Ver como pagaremos a entrega →</a>"
      de: "Bei einer <strong>gelieferten</strong> Bestellung (Kanal in Planung) kommt ein Servicekostenanteil dazu, damit der Fahrer anständig bezahlt wird — geteilt mit dem Gast und gedeckelt durch die Marge, die du festlegst, nie eine Provision. <a href=\"livraison.html\">So wollen wir die Lieferung bezahlen →</a>"
      tr: "<strong>Teslimatlı</strong> bir siparişse (yakında gelecek kanal), kuryeye insanca ödeme yapmak için bir hizmet bedeli eklenecek — müşteriyle paylaşılan ve senin belirlediğin marjla sınırlanan bir bedel, asla bir komisyon değil. <a href=\"livraison.html\">Teslimatı nasıl ödeyeceğimize bak →</a>"
      el: "Αν πρόκειται για παραγγελία <strong>με διανομή</strong> (κανάλι που έρχεται), θα προστίθεται ένα κόστος υπηρεσίας για να πληρώνεται ο διανομέας αξιοπρεπώς — μοιρασμένο με τον πελάτη και με ανώτατο όριο το περιθώριο που ορίζεις εσύ, ποτέ προμήθεια. <a href=\"livraison.html\">Δες πώς θα πληρώνουμε τη διανομή →</a>"
      ro: "Dacă e o comandă <strong>livrată</strong> (canal în pregătire), se va adăuga un cost de serviciu ca să plătim curierul demn — împărțit cu clientul și plafonat de marja pe care o fixezi tu, niciodată un comision. <a href=\"livraison.html\">Vezi cum vom plăti livrarea →</a>"
      zh: "如果是<strong>外送</strong>订单（即将上线的渠道），会另加一笔配送服务费，用来体面地支付骑手报酬——与客人分摊，并以你设定的利润线为上限，永远不是佣金。<a href=\"livraison.html\">看看我们打算怎么支付配送 →</a>"
      ja: "<strong>配達</strong>注文の場合（今後追加予定のチャネル）は、配達員にまっとうな報酬を払うためのサービス料が加わります。お客様と分担し、あなたが決める利益幅が上限 — 手数料には決してなりません。<a href=\"livraison.html\">配達費の考え方を見る →</a>"
      th: "ถ้าเป็นออร์เดอร์แบบ<strong>เดลิเวอรี</strong> (ช่องทางที่จะเปิดในอนาคต) จะมีค่าบริการเพิ่มเข้ามาเพื่อจ่ายค่าตอบแทนไรเดอร์อย่างมีศักดิ์ศรี — แบ่งจ่ายร่วมกับลูกค้าและมีเพดานตามกำไรที่คุณกำหนดเอง ไม่มีวันเป็นค่าคอมมิชชั่น <a href=\"livraison.html\">ดูว่าเราจะจ่ายค่าส่งกันอย่างไร →</a>"
      hi: "अगर ऑर्डर <strong>डिलीवरी</strong> वाला है (यह चैनल आगे आएगा), तो डिलीवरी-राइडर को सम्मानजनक भुगतान के लिए एक सेवा-लागत जुड़ेगी — ग्राहक के साथ साझा और आपकी तय की हुई मार्जिन-सीमा से बँधी, कमीशन कभी नहीं। <a href=\"livraison.html\">देखिए, डिलीवरी का भुगतान कैसे होगा →</a>"
      ta: "இது <strong>டெலிவரி</strong> ஆர்டர் என்றால் (வரவிருக்கும் சேவை), டெலிவரி செய்பவருக்கு மரியாதையான ஊதியம் தர ஒரு சேவைச் செலவு சேரும் — வாடிக்கையாளருடன் பகிரப்பட்டு, நீங்கள் நிர்ணயிக்கும் லாப வரம்பால் கட்டுப்படுத்தப்படும்; ஒருபோதும் கமிஷன் அல்ல. <a href=\"livraison.html\">டெலிவரிக்கு எப்படி ஊதியம் தருவோம் என்று பாருங்கள் →</a>"
      ar: "إذا كان الطلب <strong>مع التوصيل</strong> (قناة قادمة)، ستُضاف تكلفة خدمة لدفع أجر كريم للسائق — تُتقاسم مع الزبون وتُسقَّف بالهامش الذي تحدده أنت، وليست عمولة أبدًا. <a href=\"livraison.html\">شاهد كيف سندفع أجر التوصيل ←</a>"
      ar-lb: "إذا كان الطلب <strong>مع توصيل</strong> (قناة جايي بالمستقبل)، رح تنضاف كلفة خدمة ليندفع للدليفري بكرامة — بتنقسم مع الزبون ومسقوفة بالهامش يلّي بتحدّده إنت، وعمرها ما بتكون عمولة. <a href=\"livraison.html\">شوف كيف رح ندفع للتوصيل ←</a>"
      he: "אם מדובר בהזמנה <strong>במשלוח</strong> (ערוץ שעוד יגיע), תתווסף עלות שירות כדי לשלם לשליח בכבוד — מתחלקת עם הלקוח ומוגבלת לפי הרווח שאתה קובע, לעולם לא עמלה. <a href=\"livraison.html\">איך נשלם על המשלוח →</a>"
  example.detail:
    messages:
      fr: "30 € pour tes plats + 2,99 € de contribution libre du client (exemple)"
