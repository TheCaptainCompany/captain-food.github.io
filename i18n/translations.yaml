  solution.intro:
    messages:
      fr: "<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> est une plateforme de commande en ligne locale qui te redonne le contrôle. En ligne et à table, sous ton nom."
      en: "<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> is a local online-ordering platform that puts you back in control. Online and at the table, under your name."
      es: "<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> es una plataforma local de pedidos online que te devuelve el control. Online y en mesa, con tu nombre."
      it: "<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> è una piattaforma di ordini online locale che ti ridà il controllo. Online e al tavolo, a tuo nome."
      pt: "A <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> é uma plataforma local de encomendas online que te devolve o controlo. Online e à mesa, com o teu nome."
      de: "<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> ist eine lokale Online-Bestellplattform, die dir die Kontrolle zurückgibt. Online und am Tisch, unter deinem Namen."
      tr: "<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>, kontrolü sana geri veren yerel bir online sipariş platformu. Online'da da masada da, senin adınla."
      el: "Το <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> είναι μια τοπική πλατφόρμα online παραγγελιών που σου ξαναδίνει τον έλεγχο. Online και στο τραπέζι, με το όνομά σου."
      ar: "<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> منصة طلب أونلاين محلية تعيد إليك زمام التحكم. على الإنترنت وعلى الطاولة، وباسمك."
      he: "<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> היא פלטפורמת הזמנות אונליין מקומית שמחזירה לך את השליטה. אונליין וליד השולחן, על שמך."
