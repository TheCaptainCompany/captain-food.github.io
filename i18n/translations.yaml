  # ---- faq ----
  faq.a1:
    messages:
      fr: "Pour toi : 0 % de commission sur tes plats, inscription gratuite, dans tous les cas. Le service est financé par une <strong>contribution libre du client</strong>, ajoutée à sa commande en toute transparence (0 € possible, sans jugement) — jamais par toi. Les frais de paiement par carte sont les frais bancaires standards de tout encaissement en ligne, jamais une surcharge ajoutée au client. <a href=\"financement.html\">Voir le détail complet, exemple à l'appui.</a>"
      en: "For you: 0% commission on your dishes, free signup, no matter what. The service is funded by a <strong>pay-what-you-want customer contribution</strong>, added to their order in full transparency (€0 is fine, no judgment) — never by you. Card payment fees are the standard banking fees of any online payment, never a surcharge added for the customer. <a href=\"financement.html\">See the full details, worked example included.</a>"
      es: "Para ti: 0 % de comisión sobre tus platos, alta gratuita, en todos los casos. El servicio se financia con una <strong>contribución libre del cliente</strong>, añadida a su pedido con total transparencia (0 € posible, sin juicios) — nunca la pagas tú. Las comisiones de pago con tarjeta son las bancarias estándar de cualquier cobro online, nunca un recargo añadido al cliente. <a href=\"financement.html\">Ver el detalle completo, con ejemplo incluido.</a>"
      it: "Per te: 0% di commissioni sui tuoi piatti, iscrizione gratuita, in ogni caso. Il servizio si finanzia con un <strong>contributo libero del cliente</strong>, aggiunto al suo ordine in piena trasparenza (0 € possibile, senza giudizi) — mai da te. Le spese di pagamento con carta sono i costi bancari standard di qualsiasi incasso online, mai un sovrapprezzo aggiunto al cliente. <a href=\"financement.html\">Guarda il dettaglio completo, esempio alla mano.</a>"
      pt: "Para ti: 0% de comissão sobre os teus pratos, inscrição gratuita, em qualquer caso. O serviço é financiado por uma <strong>contribuição livre do cliente</strong>, adicionada à encomenda com toda a transparência (0 € possível, sem julgamentos) — nunca por ti. As taxas de pagamento por cartão são as taxas bancárias padrão de qualquer cobrança online, nunca uma sobretaxa cobrada ao cliente. <a href=\"financement.html\">Ver o detalhe completo, com exemplo.</a>"
      de: "Für dich: 0 % Provision auf deine Gerichte, kostenlose Anmeldung, in jedem Fall. Der Service wird durch einen <strong>freiwilligen Beitrag des Gastes</strong> finanziert, der ganz transparent zur Bestellung dazukommt (0 € möglich, ohne Wertung) — nie durch dich. Die Kartenzahlungsgebühren sind die üblichen Bankgebühren jeder Online-Zahlung, nie ein Aufschlag für den Gast. <a href=\"financement.html\">Alle Details, mit Rechenbeispiel.</a>"
      tr: "Senin için: yemeklerinde %0 komisyon, ücretsiz kayıt, her durumda. Hizmet, siparişe tam bir şeffaflıkla eklenen <strong>gönüllü müşteri katkısıyla</strong> finanse edilir (0 € da olabilir, yargı yok) — asla senin tarafından değil. Kartla ödeme masrafları her online tahsilatın standart banka masraflarıdır; müşteriye eklenen bir ek ücret asla değildir. <a href=\"financement.html\">Örnekli tüm ayrıntıya bak.</a>"
      el: "Για σένα: 0 % προμήθεια στα πιάτα σου, δωρεάν εγγραφή, σε κάθε περίπτωση. Η υπηρεσία χρηματοδοτείται από μια <strong>ελεύθερη συνεισφορά του πελάτη</strong>, που προστίθεται στην παραγγελία του με πλήρη διαφάνεια (0 € γίνεται, χωρίς κριτική) — ποτέ από σένα. Τα έξοδα πληρωμής με κάρτα είναι τα στάνταρ τραπεζικά έξοδα κάθε online είσπραξης, ποτέ επιπλέον χρέωση στον πελάτη. <a href=\"financement.html\">Δες όλες τις λεπτομέρειες, με παράδειγμα.</a>"
      ro: "Pentru tine: 0% comision pe preparatele tale, înscriere gratuită, în orice caz. Serviciul e finanțat printr-o <strong>contribuție liberă a clientului</strong>, adăugată la comanda lui în deplină transparență (0 € e posibil, fără judecăți) — niciodată de tine. Comisioanele de plată cu cardul sunt cele bancare standard ale oricărei încasări online, niciodată o suprataxă pusă clientului. <a href=\"financement.html\">Vezi detaliile complete, cu exemplu.</a>"
      zh: "对你来说：菜品0%佣金、注册免费，任何情况下都是。服务靠客人下单时透明添加的<strong>随心支持金</strong>来维持（给0 €也可以，绝不评判）——永远不由你出。银行卡手续费就是任何线上收款都有的标准银行费用，绝不会额外转嫁给客人。<a href=\"financement.html\">看完整说明，附实例。</a>"
      ja: "あなたにとっては：料理への手数料0%、登録無料。どんな場合でも。サービスの運営費は、注文に透明性をもって添えられる<strong>お客様の任意の応援金</strong>でまかないます（0€でもOK、詮索なし） — あなたが払うことは決してありません。カード決済手数料は、あらゆるオンライン決済に共通の標準的な銀行手数料で、お客様への上乗せ請求ではありません。<a href=\"financement.html\">実例つきの詳細を見る。</a>"
      th: "สำหรับคุณ: ค่าคอมมิชชั่น 0 % จากอาหาร สมัครฟรี ในทุกกรณี บริการนี้หาทุนจาก<strong>เงินสมทบตามใจสมัครของลูกค้า</strong> ที่เพิ่มเข้าไปในออร์เดอร์อย่างโปร่งใส (ให้ 0 € ก็ได้ ไม่มีการตัดสิน) — ไม่ใช่จากคุณเด็ดขาด ค่าธรรมเนียมบัตรเป็นค่าธรรมเนียมธนาคารมาตรฐานของการรับชำระเงินออนไลน์ทั่วไป ไม่ใช่ค่าบวกเพิ่มที่ผลักให้ลูกค้า <a href=\"financement.html\">ดูรายละเอียดทั้งหมด พร้อมตัวอย่างประกอบ</a>"
      hi: "आपके लिए: पकवानों पर 0% कमीशन, मुफ़्त साइन-अप — हर हाल में। सेवा चलती है ग्राहक के <strong>स्वैच्छिक योगदान</strong> से, जो पूरी पारदर्शिता के साथ उसके ऑर्डर में जुड़ता है (0 € भी ठीक है, कोई सवाल नहीं) — आपसे कभी नहीं। कार्ड-भुगतान की फ़ीस हर ऑनलाइन वसूली की मानक बैंक-फ़ीस है, ग्राहक पर थोपा गया सरचार्ज कभी नहीं। <a href=\"financement.html\">पूरा ब्योरा देखिए, उदाहरण सहित।</a>"
      ta: "உங்களுக்கு: உங்கள் உணவுகளில் 0 % கமிஷன், பதிவு இலவசம், எந்தச் சூழலிலும். சேவை வாடிக்கையாளரின் <strong>விருப்பப் பங்களிப்பால்</strong> நிதியாகிறது — முழு வெளிப்படைத்தன்மையுடன் அவரது ஆர்டரில் சேர்க்கப்படுகிறது (0 € என்பதும் சாத்தியம், எந்தக் குறையும் இல்லை) — ஒருபோதும் உங்களிடமிருந்து அல்ல. கார்டு கட்டணங்கள் எந்த ஆன்லைன் வசூலுக்கும் உள்ள நிலையான வங்கிக் கட்டணங்கள்தான், வாடிக்கையாளர் மீது கூடுதல் சுமை இல்லை. <a href=\"financement.html\">முழு விவரத்தை உதாரணத்துடன் பார்க்க.</a>"
      ar: "بالنسبة لك: عمولة 0% على أطباقك، وتسجيل مجاني، في كل الحالات. الخدمة تُموَّل من <strong>مساهمة حرة من الزبون</strong>، تُضاف إلى طلبه بكل شفافية (0 € خيار وارد، وبلا إحراج) — ولا تُموَّل منك أبدًا. رسوم الدفع بالبطاقة هي الرسوم البنكية القياسية لأي تحصيل عبر الإنترنت، وليست أبدًا رسمًا إضافيًا على الزبون. <a href=\"financement.html\">اطّلع على التفاصيل كاملة، مع مثال عملي.</a>"
      ar-lb: "عليك إنت: 0% عمولة على أكلك، والتسجيل ببلاش، بكل الحالات. الخدمة متموّلة من <strong>مساهمة حرّة من الزبون</strong>، بتنضاف على طلبه بكل شفافية (فيها تكون 0 €، وبلا أحكام) — وعمرها ما بتكون منّك إنت. رسوم الدفع بالبطاقة هيّي الرسوم البنكية العادية لأي دفع أونلاين، وعمرها ما بتكون زيادة عالزبون. <a href=\"financement.html\">شوف كل التفاصيل، مع مثال.</a>"
      he: "בשבילך: 0% עמלה על המנות, הרשמה חינם, בכל מקרה. השירות ממומן על ידי <strong>תרומה חופשית של הלקוח</strong>, שמתווספת להזמנה שלו בשקיפות מלאה (גם 0 € זה בסדר, בלי שיפוטיות) — אף פעם לא על ידך. עמלות הסליקה בכרטיס הן העמלות הבנקאיות הסטנדרטיות של כל תשלום אונליין, אף פעם לא תוספת שמגולגלת על הלקוח. <a href=\"financement.html\">לפירוט המלא, כולל דוגמה.</a>"
  faq.a2:
    messages:
      fr: "Ce qui se paie dans ta caisse habituelle (sur place, au comptoir), on n'y touche pas : c'est <strong>gratuit, point</strong>, hors de notre flux. La contribution ne concerne que les commandes <strong>payées en ligne</strong> via <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>."
      en: "Whatever goes through your usual till (on site, at the counter), we don't touch: it's <strong>free, full stop</strong> — outside our flow. The contribution only applies to orders <strong>paid online</strong> through <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>."
      es: "Lo que se paga en tu caja de siempre (en el local, en barra) no lo tocamos: es <strong>gratis, y punto</strong>, fuera de nuestro flujo. La contribución solo afecta a los pedidos <strong>pagados online</strong> vía <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>."
      it: "Quello che si paga nella tua cassa abituale (sul posto, al banco) non lo tocchiamo: è <strong>gratis, punto</strong>, fuori dal nostro flusso. Il contributo riguarda solo gli ordini <strong>pagati online</strong> tramite <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>."
      pt: "No que se paga na tua caixa habitual (no local, ao balcão), não tocamos: é <strong>grátis, ponto final</strong>, fora do nosso fluxo. A contribuição só diz respeito às encomendas <strong>pagas online</strong> via <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>."
      de: "Was in deiner gewohnten Kasse bezahlt wird (vor Ort, am Tresen), rühren wir nicht an: Das ist <strong>gratis, Punkt</strong> — außerhalb unseres Zahlungsflusses. Der Beitrag betrifft nur Bestellungen, die <strong>online</strong> über <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> bezahlt werden."
      tr: "Her zamanki kasanda ödenen her şeye (yerinde, tezgâhta) karışmayız: <strong>ücretsizdir, nokta</strong> — akışımızın dışındadır. Katkı yalnızca <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> üzerinden <strong>online ödenen</strong> siparişler içindir."
      el: "Ό,τι πληρώνεται στο ταμείο σου, όπως πάντα (επιτόπου, στον πάγκο), δεν το αγγίζουμε: είναι <strong>δωρεάν, τελεία</strong> — εκτός της ροής μας. Η συνεισφορά αφορά μόνο τις παραγγελίες που <strong>πληρώνονται online</strong> μέσω του <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>."
      ro: "De ce se plătește în casa ta obișnuită (la fața locului, la tejghea) nu ne atingem: e <strong>gratuit, punct</strong>, în afara fluxului nostru. Contribuția privește doar comenzile <strong>plătite online</strong> prin <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>."
      zh: "凡是走你自家收银台的（堂食、柜台），我们一概不碰：<strong>免费，就这么简单</strong>，完全在我们的资金流之外。支持金只涉及通过 <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> <strong>在线支付</strong>的订单。"
      ja: "いつものレジで支払われる分（店内・カウンター）には手を触れません：<strong>無料、以上</strong>。私たちの決済フローの外です。応援金がつくのは、<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>経由で<strong>オンライン決済</strong>された注文だけ。"
      th: "อะไรที่จ่ายเข้าเครื่องเก็บเงินตามปกติของคุณ (ที่ร้าน หน้าเคาน์เตอร์) เราไม่ยุ่งเลย: <strong>ฟรี จบ</strong> อยู่นอกระบบของเรา เงินสมทบเกี่ยวข้องเฉพาะออร์เดอร์ที่<strong>จ่ายออนไลน์</strong>ผ่าน <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> เท่านั้น"
      hi: "जो आपके हमेशा वाले कैश-काउंटर पर चुकाया जाता है (दुकान में, काउंटर पर), उसे हम छूते तक नहीं: वह <strong>मुफ़्त है, बस</strong> — हमारे फ़्लो से बाहर। योगदान सिर्फ़ उन ऑर्डरों पर लागू होता है जो <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> के ज़रिए <strong>ऑनलाइन चुकाए</strong> जाते हैं।"
      ta: "உங்கள் வழக்கமான கல்லாவில் (கடையில், கவுண்டரில்) செலுத்தப்படுவதில் நாங்கள் கை வைப்பதில்லை: அது <strong>இலவசம், அவ்வளவுதான்</strong> — எங்கள் பரிவர்த்தனைக்கு வெளியே. பங்களிப்பு <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> வழியாக <strong>ஆன்லைனில் செலுத்தப்படும்</strong> ஆர்டர்களுக்கு மட்டுமே."
      ar: "ما يُدفع في صندوقك المعتاد (في المحل، عند الكاونتر) لا نمسّه: إنه <strong>مجاني، نقطة</strong>، وخارج تدفقنا تمامًا. المساهمة تخص فقط الطلبات <strong>المدفوعة أونلاين</strong> عبر <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>."
      ar-lb: "يلّي بينحاسب بصندوقك العادي (بالمحل، عالكاونتر)، ما منقرّب عليه: هيدا <strong>ببلاش، ونقطة عالسطر</strong>، برّات فلوسنا كلياً. المساهمة بس على الطلبات <strong>المدفوعة أونلاين</strong> عبر <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>."
      he: "מה שמשולם בקופה הרגילה שלך (במקום, בדלפק) — אנחנו לא נוגעים בו: זה <strong>חינם, נקודה</strong>, מחוץ לזרימה שלנו. התרומה נוגעת רק להזמנות <strong>שמשולמות אונליין</strong> דרך <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>."
  faq.a3:
    messages:
      fr: "La livraison sera un <strong>canal à venir</strong>, pas encore actif. L'idée : payer correctement le livreur (on vise au moins 7 € la course). Tu y participerais uniquement sur tes commandes livrées, à hauteur de ce que ta marge permet — tu fixerais ton plancher, on ne descendrait jamais dessous. Le client paierait la différence, en transparence. Jamais une commission sur tes plats. <a href=\"livraison.html\">Voir le calcul en détail, exemple à l'appui.</a>"
      en: "Delivery will be a <strong>future channel</strong>, not active yet. The idea: pay the rider properly (we're aiming for at least €7 per ride). You'd only chip in on your delivered orders, up to what your margin allows — you'd set your floor, and we'd never go below it. The customer would pay the difference, transparently. Never a commission on your dishes. <a href=\"livraison.html\">See the math in detail, worked example included.</a>"
      es: "El reparto será un <strong>canal por llegar</strong>, aún no activo. La idea: pagar bien al repartidor (apuntamos a 7 € mínimo por carrera). Tú participarías solo en tus pedidos entregados, en la medida que tu margen permita — fijarías tu suelo y nunca bajaríamos de ahí. El cliente pagaría la diferencia, con transparencia. Nunca una comisión sobre tus platos. <a href=\"livraison.html\">Ver el cálculo en detalle, con ejemplo incluido.</a>"
      it: "La consegna sarà un <strong>canale in arrivo</strong>, non ancora attivo. L'idea: pagare bene il rider (puntiamo ad almeno 7 € a corsa). Tu parteciperesti solo sui tuoi ordini consegnati, nei limiti di quanto il tuo margine permette — fisseresti la tua soglia, e sotto non si scenderebbe mai. Il cliente pagherebbe la differenza, in trasparenza. Mai una commissione sui tuoi piatti. <a href=\"livraison.html\">Guarda il calcolo nel dettaglio, esempio alla mano.</a>"
      pt: "A entrega será um <strong>canal a chegar</strong>, ainda não ativo. A ideia: pagar corretamente ao estafeta (visamos pelo menos 7 € por corrida). Só participarias nas tuas encomendas entregues, na medida do que a tua margem permitir — fixarias o teu mínimo, e nunca desceríamos abaixo dele. O cliente pagaria a diferença, com transparência. Nunca uma comissão sobre os teus pratos. <a href=\"livraison.html\">Ver o cálculo em detalhe, com exemplo.</a>"
      de: "Die Lieferung wird ein <strong>künftiger Kanal</strong> sein, noch nicht aktiv. Die Idee: den Fahrer anständig bezahlen (wir peilen mindestens 7 € pro Fahrt an). Du würdest dich nur bei deinen gelieferten Bestellungen beteiligen — so weit, wie deine Marge es erlaubt: Du legst deine Untergrenze fest, darunter gehen wir nie. Der Gast zahlt die Differenz, ganz transparent. Nie eine Provision auf deine Gerichte. <a href=\"livraison.html\">Die Rechnung im Detail, mit Beispiel.</a>"
      tr: "Teslimat <strong>ileride gelecek bir kanal</strong>, henüz aktif değil. Fikir şu: kuryeye düzgün ödeme yapmak (sefer başına en az 7 € hedefliyoruz). Sen yalnızca teslim edilen siparişlerinde, marjının el verdiği kadar katılırdın — tabanını sen belirlerdin, altına asla inmezdik. Farkı müşteri öderdi, tam şeffaflıkla. Yemeklerinden asla komisyon alınmaz. <a href=\"livraison.html\">Hesabı örnekli ayrıntısıyla gör.</a>"
      el: "Η διανομή θα είναι <strong>κανάλι που έρχεται</strong>, όχι ακόμα ενεργό. Η ιδέα: να πληρώνεται σωστά ο διανομέας (στοχεύουμε τουλάχιστον 7 € τη διαδρομή). Εσύ θα συμμετείχες μόνο στις δικές σου παραγγελίες με διανομή, στο μέτρο που το επιτρέπει το περιθώριό σου — εσύ θα όριζες το κατώφλι σου, και δεν θα κατεβαίναμε ποτέ κάτω από αυτό. Ο πελάτης θα πλήρωνε τη διαφορά, με διαφάνεια. Ποτέ προμήθεια στα πιάτα σου. <a href=\"livraison.html\">Δες τον υπολογισμό αναλυτικά, με παράδειγμα.</a>"
      ro: "Livrarea va fi un <strong>canal în pregătire</strong>, încă inactiv. Ideea: să plătim corect curierul (țintim cel puțin 7 € pe cursă). Ai participa doar la comenzile tale livrate, atât cât îți permite marja — tu ți-ai fixa pragul, noi nu am coborî niciodată sub el. Clientul ar plăti diferența, transparent. Niciodată un comision pe preparatele tale. <a href=\"livraison.html\">Vezi calculul în detaliu, cu exemplu.</a>"
      zh: "配送将是一个<strong>即将上线的渠道</strong>，目前还没启用。思路是：让骑手拿到公道报酬（目标每单至少7 €）。你只在自己的外送订单上出一部分，出多少以你的利润承受度为限——底线由你来定，我们绝不越过。差额由客人透明补足。永远不会是菜品佣金。<a href=\"livraison.html\">看详细算法，附实例。</a>"
      ja: "配達は<strong>今後追加予定のチャネル</strong>で、まだ動いていません。考え方はこうです：配達員にきちんと払う（1配達あたり最低7€を目指します）。あなたが負担するのは自分の配達注文の分だけで、利益幅が許す範囲まで — 下限はあなたが決め、それを下回ることはありません。差額はお客様が、透明性をもって負担します。料理への手数料には決してなりません。<a href=\"livraison.html\">実例つきの計算を見る。</a>"
      th: "เดลิเวอรีจะเป็น<strong>ช่องทางในอนาคต</strong> ยังไม่เปิดใช้ แนวคิดคือ: จ่ายค่าตอบแทนไรเดอร์อย่างเหมาะสม (เราตั้งเป้าอย่างน้อย 7 € ต่อเที่ยว) คุณจะมีส่วนร่วมเฉพาะในออร์เดอร์เดลิเวอรีของคุณ ตามที่กำไรของคุณเอื้อ — คุณกำหนดขั้นต่ำเอง และเราจะไม่มีวันลดต่ำกว่านั้น ลูกค้าจ่ายส่วนต่างอย่างโปร่งใส และจะไม่มีวันเป็นค่าคอมมิชชั่นจากอาหารของคุณ <a href=\"livraison.html\">ดูการคำนวณโดยละเอียด พร้อมตัวอย่างประกอบ</a>"
      hi: "डिलीवरी एक <strong>आने वाला चैनल</strong> होगी — अभी सक्रिय नहीं। सोच यह है: राइडर को सही भुगतान (लक्ष्य: प्रति डिलीवरी कम-से-कम 7 €)। आप सिर्फ़ अपने डिलीवर हुए ऑर्डरों पर, उतना ही हिस्सा देंगे जितनी आपकी मार्जिन इजाज़त दे — निचली सीमा आप तय करेंगे, हम उससे नीचे कभी नहीं जाएँगे। बाक़ी फ़र्क़ ग्राहक देगा, पूरी पारदर्शिता से। आपके पकवानों पर कमीशन — कभी नहीं। <a href=\"livraison.html\">पूरा हिसाब देखिए, उदाहरण सहित।</a>"
      ta: "டெலிவரி ஒரு <strong>வரவிருக்கும் சேவை</strong>, இன்னும் செயலில் இல்லை. யோசனை: டெலிவரி செய்பவருக்கு முறையான ஊதியம் (ஒரு பயணத்திற்குக் குறைந்தது 7 € இலக்கு). உங்கள் டெலிவரி ஆர்டர்களில் மட்டும், உங்கள் லாபம் அனுமதிக்கும் அளவுக்கே நீங்கள் பங்களிப்பீர்கள் — உங்கள் கீழ்வரம்பை நீங்களே நிர்ணயிப்பீர்கள், அதற்குக் கீழே நாங்கள் ஒருபோதும் இறங்க மாட்டோம். மீதியை வாடிக்கையாளர் வெளிப்படையாகச் செலுத்துவார். உங்கள் உணவுகளில் ஒருபோதும் கமிஷன் இல்லை. <a href=\"livraison.html\">கணக்கை விரிவாக, உதாரணத்துடன் பார்க்க.</a>"
      ar: "التوصيل سيكون <strong>قناة قادمة</strong>، غير نشطة بعد. الفكرة: دفع أجر عادل للسائق (نستهدف 7 € على الأقل للتوصيلة الواحدة). ستشارك فيها فقط على طلباتك الموصَّلة، وبقدر ما يسمح به هامشك — أنت من سيحدد حدّك الأدنى، ولن ننزل تحته أبدًا. والزبون سيدفع الفرق، بكل شفافية. وليست أبدًا عمولة على أطباقك. <a href=\"livraison.html\">شاهد الحساب بالتفصيل، مع مثال عملي.</a>"
      ar-lb: "التوصيل رح يكون <strong>قناة جايي بالمستقبل</strong>، لسّا مش شغّالة. الفكرة: ندفع للدليفري بالعدل (هدفنا عالأقل 7 € للمشوار). إنت بتشارك بس على طلباتك الموصّلة، وعقد ما بيسمح هامشك — إنت بتحدّد الحد الأدنى تبعك، ونحنا عمرنا ما مننزل تحته. الزبون بيدفع الفرق، بكل شفافية. وعمرها ما بتكون عمولة على أكلك. <a href=\"livraison.html\">شوف الحساب بالتفصيل، مع مثال.</a>"
      he: "המשלוח יהיה <strong>ערוץ עתידי</strong>, עוד לא פעיל. הרעיון: לשלם לשליח כמו שצריך (אנחנו שואפים ל-7 € לפחות לנסיעה). אתה תשתתף רק על ההזמנות שלך במשלוח, ורק כמה שהרווח שלך מאפשר — אתה תקבע את הרצפה שלך, ולעולם לא נרד מתחתיה. הלקוח ישלם את ההפרש, בשקיפות. אף פעם לא עמלה על המנות שלך. <a href=\"livraison.html\">לחישוב המפורט, כולל דוגמה.</a>"
  faq.a4:
    messages:
      fr: "Non. <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> vient en plus, sans exclusivité. Beaucoup de restaurants gardent les deux et voient <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> comme leur canal direct, celui qu'ils maîtrisent."
      en: "No. <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> comes on top, with no exclusivity. Many restaurants keep both and see <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> as their direct channel — the one they control."
      es: "No. <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> viene a sumar, sin exclusividad. Muchos restaurantes mantienen ambos y ven <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> como su canal directo, el que controlan ellos."
      it: "No. <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> si aggiunge, senza esclusiva. Molti ristoranti tengono entrambi e vedono <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> come il loro canale diretto, quello che controllano."
      pt: "Não. A <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> vem por acréscimo, sem exclusividade. Muitos restaurantes ficam com os dois e veem a <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> como o seu canal direto, aquele que controlam."
      de: "Nein. <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> kommt einfach dazu, ohne Exklusivität. Viele Restaurants behalten beides und sehen <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> als ihren Direktkanal — den, den sie selbst steuern."
      tr: "Hayır. <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> bunların yanına gelir, hiçbir münhasırlık yok. Birçok restoran ikisini birden tutuyor ve <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>'u kendi hâkim oldukları doğrudan kanal olarak görüyor."
      el: "Όχι. Το <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> έρχεται επιπλέον, χωρίς αποκλειστικότητα. Πολλά εστιατόρια κρατούν και τα δύο και βλέπουν το <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> ως το απευθείας κανάλι τους — αυτό που ελέγχουν."
      ro: "Nu. <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> vine în plus, fără exclusivitate. Multe restaurante le păstrează pe amândouă și văd în <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> canalul lor direct, cel pe care îl controlează."
      zh: "不用。<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> 是加法，没有排他。很多餐厅两边都留着，把 <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> 当作自己的直连渠道——真正握在自己手里的那一个。"
      ja: "いいえ。<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>は追加の選択肢で、独占契約はありません。多くの店は両方を続けながら、<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>を自分でコントロールできる直接チャネルと位置づけています。"
      th: "ไม่ต้อง <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> เป็นช่องทางเสริม ไม่มีข้อผูกมัดเอ็กซ์คลูซีฟ ร้านอาหารจำนวนมากใช้ทั้งสองทาง และมอง <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> เป็นช่องทางตรงของตัวเอง ช่องทางที่พวกเขาควบคุมได้เอง"
      hi: "नहीं। <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> इनके साथ-साथ चलता है, बिना एक्सक्लूसिविटी के। कई रेस्टोरेंट दोनों रखते हैं और <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> को अपना सीधा चैनल मानते हैं — वह चैनल जिसकी कमान उनके हाथ में है।"
      ta: "இல்லை. <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> கூடுதலாக வருகிறது, ஏகபோகம் இல்லை. பல உணவகங்கள் இரண்டையும் வைத்துக்கொண்டு, <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>-ஐத் தங்கள் நேரடி வழியாக — தங்கள் கட்டுப்பாட்டிலுள்ள வழியாக — பார்க்கின்றன."
      ar: "لا. <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> يأتي كإضافة، بدون حصرية. كثير من المطاعم تحتفظ بالاثنين وترى في <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> قناتها المباشرة، تلك التي تتحكم فيها بنفسها."
      ar-lb: "لأ. <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> بيجي زيادة، بلا حصرية. كتير مطاعم بتحتفظ بالتنين وبتعتبر <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> قناتها المباشرة، يلّي هيّي ماسكة دفّتها."
      he: "לא. <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> מגיע כתוספת, בלי בלעדיות. הרבה מסעדות שומרות על שניהם ורואות ב-<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> את הערוץ הישיר שלהן — זה שבשליטתן."
  faq.a5:
    messages:
      fr: "Parce que ça ne te coûte rien et que tu n'as aucune exclusivité à donner. Tu es référencé, tu récupères ta base clients dès tes premières commandes directes, et tu façonnes l'outil pendant qu'on démarre. Les premiers embarqués sont ceux qui pèsent le plus."
      en: "Because it costs you nothing and you give up no exclusivity. You get listed, you recover your customer base from your first direct orders, and you shape the tool while we're starting out. The first ones aboard are the ones who weigh the most."
      es: "Porque no te cuesta nada y no cedes ninguna exclusividad. Apareces en el directorio, recuperas tu base de clientes desde tus primeros pedidos directos y das forma a la herramienta mientras arrancamos. Los primeros a bordo son los que más pesan."
      it: "Perché non ti costa niente e non dai nessuna esclusiva. Sei in vetrina, recuperi la tua base clienti dai primi ordini diretti, e plasmi lo strumento mentre partiamo. I primi a salire a bordo sono quelli che contano di più."
      pt: "Porque não te custa nada e não tens nenhuma exclusividade a dar. Ficas referenciado, recuperas a tua base de clientes desde as primeiras encomendas em direto, e moldas a ferramenta enquanto arrancamos. Os primeiros a embarcar são os que mais pesam."
      de: "Weil es dich nichts kostet und du keinerlei Exklusivität abgibst. Du bist gelistet, sicherst dir ab deinen ersten Direktbestellungen deine Kundendatei und formst das Werkzeug mit, während wir starten. Wer zuerst an Bord ist, hat das meiste Gewicht."
      tr: "Çünkü sana hiçbir maliyeti yok ve verecek hiçbir münhasırlığın yok. Listeye girersin, ilk doğrudan siparişlerinden itibaren müşteri veritabanını kazanırsın ve biz yola çıkarken aracı sen şekillendirirsin. Gemiye ilk atlayanlar, en çok söz sahibi olanlardır."
      el: "Γιατί δεν σου κοστίζει τίποτα και δεν δίνεις καμία αποκλειστικότητα. Μπαίνεις στον κατάλογο, παίρνεις τη βάση πελατών σου από τις πρώτες κιόλας απευθείας παραγγελίες, και διαμορφώνεις το εργαλείο όσο ξεκινάμε. Όσοι ανέβουν πρώτοι στο πλοίο έχουν και τον μεγαλύτερο λόγο."
      ro: "Pentru că nu te costă nimic și nu dai nicio exclusivitate. Ești listat, îți recuperezi baza de clienți de la primele comenzi directe și modelezi instrumentul cât timp pornim la drum. Primii urcați la bord sunt cei care cântăresc cel mai mult."
      zh: "因为它不花你一分钱，也不要求任何排他。你先占好位置，从第一笔直接订单起就开始积累自己的客户名单，还能在起步阶段亲手塑造这个工具。最早登船的人，话语权最大。"
      ja: "コストがゼロで、独占契約を差し出す必要もないからです。掲載され、最初の直接注文から顧客リストが手に入り、立ち上げ期のツールをあなたが形づくれます。最初に乗船した人こそ、いちばん重みを持つのです。"
      th: "เพราะมันไม่มีต้นทุนอะไรสำหรับคุณเลย และคุณไม่ต้องมอบความเอ็กซ์คลูซีฟให้ใคร ร้านของคุณถูกลงทะเบียนไว้ คุณได้ฐานลูกค้ากลับมาตั้งแต่ออร์เดอร์ตรงแรก ๆ และคุณได้ร่วมหล่อหลอมเครื่องมือนี้ตั้งแต่ช่วงเริ่มต้น คนที่ขึ้นเรือก่อนคือคนที่มีน้ำหนักเสียงมากที่สุด"
      hi: "क्योंकि इसकी आपको कोई क़ीमत नहीं चुकानी और कोई एक्सक्लूसिविटी नहीं देनी। आप सूची में आ जाते हैं, पहले सीधे ऑर्डरों से ही अपना ग्राहक-डेटा पाने लगते हैं, और शुरुआती दौर में औज़ार को गढ़ते हैं। जो पहले जहाज़ पर चढ़ते हैं, उन्हीं की आवाज़ सबसे भारी होती है।"
      ta: "ஏனெனில் உங்களுக்கு எந்தச் செலவும் இல்லை, எந்த ஏகபோகமும் தரத் தேவையில்லை. நீங்கள் பட்டியலில் இருப்பீர்கள், முதல் நேரடி ஆர்டர்களிலிருந்தே உங்கள் வாடிக்கையாளர் தரவைப் பெறுவீர்கள், நாங்கள் தொடங்கும் போதே கருவியை வடிவமைப்பீர்கள். முதலில் கப்பலில் ஏறியவர்களின் குரலுக்கே அதிக எடை."
      ar: "لأن ذلك لا يكلفك شيئًا، ولا حصرية عليك تقديمها. تكون مدرَجًا منذ البداية، وتسترجع قاعدة زبائنك من أول طلباتك المباشرة، وتصوغ الأداة ونحن ننطلق. أوائل من يصعدون على المتن هم أصحاب الوزن الأكبر."
      ar-lb: "لأنّه ما بيكلّفك شي وما في أي حصرية عليك. بتنحطّ عالدليل، بتاخد قاعدة زبايناتك من أوّل طلباتك المباشرة، وبتشكّل الأداة ونحنا لسّا عم نبلّش. أوّل ناس بتطلع عالمركب هنّي يلّي وزنهن أتقل."
      he: "כי זה לא עולה לך כלום ואתה לא נותן שום בלעדיות. אתה מופיע במדריך, אתה מקבל את מאגר הלקוחות שלך כבר מההזמנות הישירות הראשונות, ואתה מעצב את הכלי בזמן שאנחנו יוצאים לדרך. הראשונים שעולים לסיפון הם אלה שמשפיעים הכי הרבה."
  faq.a6:
    messages:
      fr: "Chaque commande passée en direct sur ta page t'appartient : tu accèdes aux coordonnées de tes clients (avec leur consentement) pour les fidéliser toi-même. Contrairement aux grandes plateformes, on ne confisque pas ta clientèle."
      en: "Every order placed directly on your page belongs to you: you get access to your customers' contact details (with their consent) to build loyalty yourself. Unlike the big platforms, we don't confiscate your customer base."
      es: "Cada pedido hecho en directo en tu página te pertenece: accedes a los datos de contacto de tus clientes (con su consentimiento) para fidelizarlos tú mismo. A diferencia de las grandes plataformas, no confiscamos tu clientela."
      it: "Ogni ordine fatto direttamente sulla tua pagina ti appartiene: accedi ai contatti dei tuoi clienti (con il loro consenso) per fidelizzarli tu stesso. A differenza delle grandi piattaforme, la tua clientela non te la confischiamo."
      pt: "Cada encomenda feita em direto na tua página pertence-te: acedes aos contactos dos teus clientes (com o consentimento deles) para os fidelizares tu mesmo. Ao contrário das grandes plataformas, não confiscamos a tua clientela."
      de: "Jede Bestellung, die direkt über deine Seite läuft, gehört dir: Du bekommst Zugriff auf die Kontaktdaten deiner Gäste (mit deren Einwilligung), um sie selbst zu binden. Anders als die großen Plattformen konfiszieren wir deine Kundschaft nicht."
      tr: "Sayfanda doğrudan verilen her sipariş sana aittir: müşterilerinin iletişim bilgilerine (onların onayıyla) erişir, bağlılığı kendin kurarsın. Büyük platformların aksine, müşteri kitlene el koymayız."
      el: "Κάθε παραγγελία που γίνεται απευθείας στη σελίδα σου σού ανήκει: έχεις πρόσβαση στα στοιχεία των πελατών σου (με τη συγκατάθεσή τους) για να τους κρατήσεις κοντά μόνος σου. Σε αντίθεση με τις μεγάλες πλατφόρμες, εμείς δεν κατάσχουμε την πελατεία σου."
      ro: "Fiecare comandă dată direct pe pagina ta îți aparține: ai acces la datele de contact ale clienților tăi (cu consimțământul lor) ca să-i fidelizezi tu însuți. Spre deosebire de marile platforme, noi nu-ți confiscăm clientela."
      zh: "每一笔在你页面上直接下的订单都归你：你可以拿到客人的联系方式（经其同意），自己去维护熟客。和大平台不一样，我们不没收你的客源。"
      ja: "あなたのページで直接された注文はすべてあなたのもの：お客様の連絡先に（本人の同意のもと）アクセスして、自分の手で常連にできます。大手プラットフォームと違い、私たちは顧客を没収しません。"
      th: "ทุกออร์เดอร์ที่สั่งตรงบนหน้าเพจของคุณเป็นของคุณ: คุณเข้าถึงข้อมูลติดต่อของลูกค้า (ด้วยความยินยอมของพวกเขา) เพื่อดูแลลูกค้าด้วยตัวเอง ต่างจากแพลตฟอร์มยักษ์ใหญ่ เราไม่ยึดฐานลูกค้าของคุณ"
      hi: "आपके पेज पर सीधे आया हर ऑर्डर आपका है: आपको अपने ग्राहकों की संपर्क-जानकारी (उनकी सहमति से) मिलती है, ताकि आप ख़ुद उन्हें जोड़े रखें। बड़ी प्लेटफ़ॉर्मों के उलट, हम आपके ग्राहक ज़ब्त नहीं करते।"
      ta: "உங்கள் பக்கத்தில் நேரடியாக வரும் ஒவ்வொரு ஆர்டரும் உங்களுடையது: வாடிக்கையாளர்களின் தொடர்பு விவரங்களை (அவர்களின் ஒப்புதலுடன்) நீங்களே பெற்று, நீங்களே அவர்களை நிலைநிறுத்தலாம். பெரிய தளங்களைப் போல் அல்லாமல், உங்கள் வாடிக்கையாளர்களை நாங்கள் பறிப்பதில்லை."
      ar: "كل طلب يمرّ مباشرة عبر صفحتك ملك لك: تصل إلى بيانات تواصل زبائنك (بموافقتهم) لتكسب ولاءهم بنفسك. على عكس المنصات الكبرى، نحن لا نصادر زبائنك."
      ar-lb: "كل طلب بيصير دغري على صفحتك هو إلك: بتوصل لمعلومات زبايناتك (بموافقتهن) لتخلّيهن يرجعولك بنفسك. عكس المنصّات الكبيرة، نحنا ما منحجز زبايناتك عنّا."
      he: "כל הזמנה שמתבצעת ישירות בעמוד שלך שייכת לך: אתה מקבל גישה לפרטי הלקוחות שלך (בהסכמתם) כדי לשמר אותם בעצמך. בניגוד לפלטפורמות הגדולות, אנחנו לא מחרימים את קהל הלקוחות שלך."
  faq.a7:
    messages:
      fr: "« Entreprise solidaire d'utilité sociale » : un agrément qui encadre juridiquement la lucrativité et impose une finalité sociale. C'est le cap qu'on vise — une garantie, à terme, que <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> ne pourra pas dériver vers ce qu'on dénonce."
      en: "ESUS stands for “entreprise solidaire d'utilité sociale” — a solidarity-based social utility enterprise, a French accreditation that legally caps profit-taking and requires a social purpose. It's the course we're aiming for — a guarantee, in time, that <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> can never drift into what we denounce."
      es: "«Empresa solidaria de utilidad social», por sus siglas en francés: una acreditación legal francesa que limita jurídicamente el lucro e impone una finalidad social. Es el rumbo que nos hemos marcado — una garantía, a la larga, de que <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> no podrá derivar hacia lo que denunciamos."
      it: "«Entreprise solidaire d'utilité sociale», cioè impresa solidale di utilità sociale: un'abilitazione francese che limita giuridicamente la lucratività e impone una finalità sociale. È la rotta che puntiamo a seguire — una garanzia, col tempo, che <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> non potrà deviare verso ciò che denunciamo."
      pt: "«Empresa solidária de utilidade social»: uma acreditação legal francesa que enquadra juridicamente a lucratividade e impõe uma finalidade social. É o rumo que visamos — uma garantia, a prazo, de que a <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> não poderá derivar para aquilo que denunciamos."
      de: "„Entreprise solidaire d'utilité sociale“ — ein französischer Rechtsstatus für solidarische Unternehmen mit gesellschaftlichem Nutzen: eine staatliche Anerkennung, die Gewinnstreben rechtlich begrenzt und einen sozialen Zweck vorschreibt. Das ist der Kurs, den wir anstreben — auf Dauer eine Garantie, dass <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> nie zu dem abdriften kann, was wir anprangern."
      tr: "« Toplumsal fayda amaçlı dayanışma şirketi »: Fransa'da kâr dağıtımını yasal olarak sınırlayan ve sosyal bir amaç şart koşan bir statü. Hedeflediğimiz rota bu — <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>'un, karşı çıktığımız şeye zamanla savrulamayacağının güvencesi."
      el: "«Entreprise solidaire d'utilité sociale» — γαλλική κρατική πιστοποίηση αλληλέγγυας επιχείρησης κοινωνικής ωφέλειας: βάζει νομικά όρια στην κερδοσκοπία και επιβάλλει κοινωνικό σκοπό. Είναι η ρότα που έχουμε βάλει — μια εγγύηση, στην πορεία, ότι το <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> δεν θα μπορέσει να ξεστρατίσει προς αυτό που καταγγέλλουμε."
      ro: "„Întreprindere solidară de utilitate socială” — o acreditare, statut juridic francez, care limitează profitul și impune o finalitate socială. E cursul pe care îl țintim — o garanție, în timp, că <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> nu va putea devia spre ceea ce denunțăm."
      zh: "「社会公益互助企业」：一种法国官方认证，从法律上限制逐利、要求企业承担社会使命。这是我们瞄准的航向——最终确保 <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> 永远不会滑向我们所抨击的模样。"
      ja: "「社会的有用性連帯企業」 — 営利性を法的に枠づけ、社会的目的を義務づけるフランスの認定です。私たちが目指す針路であり、ゆくゆくは<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>が自ら告発する存在に堕ちられない保証になります。"
      th: "« กิจการเพื่อสังคมและประโยชน์สาธารณะ » (ESUS) คือการรับรองตามกฎหมายฝรั่งเศสที่จำกัดการแสวงหากำไรและกำหนดให้ต้องมีพันธกิจทางสังคม นี่คือเป้าหมายที่เรากำลังมุ่งไป — หลักประกันในระยะยาวว่า <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> จะไม่มีวันไถลไปเป็นสิ่งที่เราประณาม"
      hi: "« Entreprise solidaire d'utilité sociale » — फ़्रांस का एक क़ानूनी दर्जा, जो मुनाफ़ाख़ोरी पर क़ानूनी लगाम लगाता है और सामाजिक मक़सद अनिवार्य करता है। यही हमारा लक्ष्य है — एक गारंटी कि आगे चलकर <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> उस राह पर नहीं भटक पाएगा जिसकी हम मुख़ालफ़त करते हैं।"
      ta: "« சமூக நல ஒற்றுமை நிறுவனம் » (ESUS — பிரெஞ்சு சட்ட அங்கீகாரம்): லாப நோக்கை சட்டப்படி கட்டுப்படுத்தி, சமூக நோக்கத்தைக் கட்டாயமாக்கும் அங்கீகாரம். இதுவே நாங்கள் இலக்காகக் கொண்ட திசை — காலப்போக்கில், <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> நாங்கள் கண்டிப்பதாகவே திசை மாறிவிட முடியாது என்பதற்கான உத்தரவாதம்."
      ar: "«المؤسسة التضامنية ذات المنفعة الاجتماعية»: اعتماد قانوني فرنسي يقيّد الربحية ويفرض غاية اجتماعية. هذه هي الوجهة التي نستهدفها — ضمانة، على المدى البعيد، بأن <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> لن يستطيع الانحراف نحو ما نندد به."
      ar-lb: "« شركة تضامنية ذات منفعة اجتماعية »: اعتماد قانوني فرنسي بيحدّ الربحية وبيفرض هدف اجتماعي. هيدي الوجهة يلّي قاصدينها — ضمانة، مع الوقت، إنّه <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> ما فيه ينحرف صوب يلّي عم نشهّر فيه."
      he: "ESUS — ״עסק סולידרי לתועלת חברתית״ — הוא מעמד משפטי צרפתי שמגביל את הרווחיות ומחייב ייעוד חברתי. זה היעד שאנחנו שואפים אליו — ערובה, בהמשך הדרך, לכך ש-<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> לא יוכל לסטות אל מה שאנחנו יוצאים נגדו."
  faq.a8:
    messages:
      fr: "Deux cas. Si le client <strong>paie en caisse</strong> ou sur place, c'est <strong>hors de notre flux</strong> : 100 % gratuit, on n'y touche pas. S'il <strong>paie en ligne</strong> via le QR, une contribution libre peut s'ajouter, comme pour une commande en ligne. Dans tous les cas, sous ton nom, et 0 commission sur tes plats."
      en: "Two cases. If the customer <strong>pays at the till</strong> or on site, it's <strong>outside our flow</strong>: 100% free, we don't touch it. If they <strong>pay online</strong> via the QR code, a pay-what-you-want contribution can be added, just like for an online order. In every case, under your name, and 0% commission on your dishes."
      es: "Dos casos. Si el cliente <strong>paga en caja</strong> o en el local, queda <strong>fuera de nuestro flujo</strong>: 100 % gratis, no lo tocamos. Si <strong>paga online</strong> vía el QR, puede añadirse una contribución libre, como en un pedido online. En todos los casos, con tu nombre, y 0 comisión sobre tus platos."
      it: "Due casi. Se il cliente <strong>paga in cassa</strong> o sul posto, è <strong>fuori dal nostro flusso</strong>: 100% gratis, non lo tocchiamo. Se <strong>paga online</strong> tramite il QR, può aggiungersi un contributo libero, come per un ordine online. In ogni caso, a tuo nome, e 0 commissioni sui tuoi piatti."
      pt: "Dois casos. Se o cliente <strong>paga na caixa</strong> ou no local, fica <strong>fora do nosso fluxo</strong>: 100% grátis, não lhe tocamos. Se <strong>paga online</strong> via QR, pode acrescentar-se uma contribuição livre, como numa encomenda online. Em qualquer caso, com o teu nome, e 0 comissão sobre os teus pratos."
      de: "Zwei Fälle. Zahlt der Gast <strong>an der Kasse</strong> oder vor Ort, ist das <strong>außerhalb unseres Zahlungsflusses</strong>: 100 % gratis, wir rühren es nicht an. Zahlt er <strong>online</strong> über den QR-Code, kann wie bei einer Online-Bestellung ein freiwilliger Beitrag dazukommen. In jedem Fall: unter deinem Namen, und 0 % Provision auf deine Gerichte."
      tr: "İki durum var. Müşteri <strong>kasada</strong> ya da yerinde ödüyorsa, bu <strong>akışımızın dışındadır</strong>: %100 ücretsiz, karışmayız. QR üzerinden <strong>online ödüyorsa</strong>, tıpkı bir online siparişte olduğu gibi gönüllü bir katkı eklenebilir. Her durumda senin adınla ve yemeklerinde 0 komisyon."
      el: "Δύο περιπτώσεις. Αν ο πελάτης <strong>πληρώνει στο ταμείο</strong> ή επιτόπου, είναι <strong>εκτός της ροής μας</strong>: 100 % δωρεάν, δεν το αγγίζουμε. Αν <strong>πληρώνει online</strong> μέσω του QR, μπορεί να προστεθεί μια ελεύθερη συνεισφορά, όπως σε κάθε online παραγγελία. Σε κάθε περίπτωση, με το όνομά σου, και 0 προμήθεια στα πιάτα σου."
      ro: "Două cazuri. Dacă clientul <strong>plătește la casă</strong> sau la fața locului, e <strong>în afara fluxului nostru</strong>: 100% gratuit, nu ne atingem. Dacă <strong>plătește online</strong> prin QR, se poate adăuga o contribuție liberă, ca la o comandă online. În orice caz, pe numele tău, și 0 comision pe preparatele tale."
      zh: "分两种情况。客人<strong>在收银台</strong>或当面付款，就<strong>完全在我们的资金流之外</strong>：100%免费，我们不碰。客人扫码后<strong>在线付款</strong>，则和普通在线订单一样，可以自愿添加支持金。无论哪种，都挂你的名字，菜品0佣金。"
      ja: "2つのケースがあります。お客様が<strong>レジで払う</strong>か店内で払うなら、<strong>私たちの決済フローの外</strong>：100%無料で、手を触れません。QR経由で<strong>オンライン決済</strong>するなら、オンライン注文と同じく任意の応援金がつくことがあります。どちらの場合も、あなたの名前で、料理への手数料は0です。"
      th: "มีสองกรณี ถ้าลูกค้า<strong>จ่ายที่เคาน์เตอร์</strong>หรือจ่ายที่ร้าน นั่น<strong>อยู่นอกระบบของเรา</strong>: ฟรี 100 % เราไม่ยุ่งเลย แต่ถ้าลูกค้า<strong>จ่ายออนไลน์</strong>ผ่าน QR อาจมีเงินสมทบตามใจสมัครเพิ่มเข้ามา เหมือนออร์เดอร์ออนไลน์ทั่วไป ไม่ว่ากรณีไหน ทุกอย่างอยู่ในชื่อร้านของคุณ และ 0 คอมมิชชั่นจากอาหารของคุณ"
      hi: "दो सूरतें। अगर ग्राहक <strong>काउंटर पर चुकाता है</strong> या दुकान में, तो वह <strong>हमारे फ़्लो से बाहर</strong> है: 100% मुफ़्त, हम छूते तक नहीं। अगर वह QR से <strong>ऑनलाइन चुकाता है</strong>, तो ऑनलाइन ऑर्डर की तरह एक स्वैच्छिक योगदान जुड़ सकता है। हर हाल में — आपके नाम तले, और आपके पकवानों पर 0 कमीशन।"
      ta: "இரண்டு நிலைகள். வாடிக்கையாளர் <strong>கல்லாவில்</strong> அல்லது கடையிலேயே செலுத்தினால், அது <strong>எங்கள் பரிவர்த்தனைக்கு வெளியே</strong>: 100 % இலவசம், நாங்கள் கை வைப்பதில்லை. QR வழியாக <strong>ஆன்லைனில் செலுத்தினால்</strong>, ஆன்லைன் ஆர்டர் போலவே விருப்பப் பங்களிப்பு சேரலாம். எந்நிலையிலும், உங்கள் பெயரில், உங்கள் உணவுகளில் 0 கமிஷன்."
      ar: "حالتان. إذا <strong>دفع الزبون في الصندوق</strong> أو في المحل، فهذا <strong>خارج تدفقنا</strong>: مجاني 100%، ولا نمسّه. أما إذا <strong>دفع أونلاين</strong> عبر رمز QR، فقد تُضاف مساهمة حرة، كما في أي طلب أونلاين. وفي كل الحالات، باسمك أنت، وعمولة 0% على أطباقك."
      ar-lb: "حالتين. إذا الزبون <strong>دفع عالكاشير</strong> أو بالمحل، هيدا <strong>برّات فلوسنا</strong>: ببلاش 100%، ما منقرّب عليه. وإذا <strong>دفع أونلاين</strong> عبر الـQR، فيها تنضاف مساهمة حرّة، متل أي طلب أونلاين. بكل الحالات، باسمك إنت، و0 عمولة على أكلك."
      he: "שני מצבים. אם הלקוח <strong>משלם בקופה</strong> או במקום, זה <strong>מחוץ לזרימה שלנו</strong>: 100% חינם, אנחנו לא נוגעים בזה. אם הוא <strong>משלם אונליין</strong> דרך ה-QR, תרומה חופשית יכולה להתווסף, כמו בהזמנה אונליין. בכל מקרה — על שמך, ו-0 עמלה על המנות שלך."
  faq.a9:
    messages:
      fr: "<strong>17, pour commencer</strong> — celles qu'on parle autour de nous. Cette page les parle déjà toutes (essaie le sélecteur en haut). Et le produit suivra le même cap : le site de commande de tes clients, ton espace restaurateur et, à terme, l'app des livreurs. Chacun dans sa langue — ton client commande en thaï ou en arabe, toi tu travailles dans la tienne."
      en: "<strong>17, to start with</strong> — the ones spoken around us. This page already speaks them all (try the switcher at the top). And the product will hold the same course: your customers' ordering site, your restaurateur space and, in time, the riders' app. Everyone in their own language — your customer orders in Thai or Arabic, you work in yours."
      es: "<strong>17, para empezar</strong> — los que se hablan a nuestro alrededor. Esta página ya los habla todos (prueba el selector de arriba). Y el producto seguirá el mismo rumbo: el sitio de pedidos de tus clientes, tu espacio de hostelero y, con el tiempo, la app de los repartidores. Cada uno en su idioma — tu cliente pide en tailandés o en árabe, y tú trabajas en el tuyo."
      it: "<strong>17, per cominciare</strong> — quelle che si parlano intorno a noi. Questa pagina le parla già tutte (prova il selettore in alto). E il prodotto seguirà la stessa rotta: il sito di ordinazione dei tuoi clienti, il tuo spazio da ristoratore e, col tempo, l'app dei rider. Ognuno nella sua lingua — il tuo cliente ordina in thailandese o in arabo, tu lavori nella tua."
      pt: "<strong>17, para começar</strong> — as que se falam à nossa volta. Esta página já as fala todas (experimenta o seletor lá em cima). E o produto seguirá o mesmo rumo: o site de encomendas dos teus clientes, o teu espaço de restaurador e, a prazo, a app dos estafetas. Cada um na sua língua — o teu cliente encomenda em tailandês ou em árabe, tu trabalhas na tua."
      de: "<strong>17, für den Anfang</strong> — die, die um uns herum gesprochen werden. Diese Seite spricht sie schon alle (probier die Sprachauswahl oben). Und das Produkt hält denselben Kurs: die Bestellseite deiner Gäste, dein Gastronomen-Bereich und mit der Zeit die Fahrer-App. Jeder in seiner Sprache — dein Gast bestellt auf Thai oder Arabisch, du arbeitest in deiner."
      tr: "<strong>Başlangıç olarak 17</strong> — çevremizde konuşulan diller. Bu sayfa şimdiden hepsini konuşuyor (yukarıdaki dil seçiciyi dene). Ürün de aynı rotayı izleyecek: müşterilerinin sipariş sitesi, senin restorancı panelin ve zamanla kuryelerin uygulaması. Herkes kendi dilinde — müşterin Tayca ya da Arapça sipariş verir, sen kendi dilinde çalışırsın."
      el: "<strong>17, για αρχή</strong> — αυτές που μιλιούνται γύρω μας. Αυτή η σελίδα τις μιλά ήδη όλες (δοκίμασε τον επιλογέα πάνω). Και το προϊόν θα κρατήσει την ίδια ρότα: το site παραγγελιών των πελατών σου, ο χώρος σου ως εστιάτορα και, με τον καιρό, η εφαρμογή των διανομέων. Ο καθένας στη γλώσσα του — ο πελάτης σου παραγγέλνει στα ταϊλανδικά ή στα αραβικά, εσύ δουλεύεις στη δική σου."
      ro: "<strong>17, pentru început</strong> — cele care se vorbesc în jurul nostru. Această pagină le vorbește deja pe toate (încearcă selectorul de sus). Iar produsul va ține același curs: site-ul de comenzi al clienților tăi, spațiul tău de restaurator și, cu timpul, aplicația curierilor. Fiecare în limba lui — clientul tău comandă în thailandeză sau în arabă, tu lucrezi în a ta."
      zh: "<strong>17种，这只是开始</strong>——都是我们身边人在说的语言。这个页面已经全都会说了（试试顶部的语言切换）。产品也会沿着同一条航线走：你客人的点餐网站、你的餐厅管理端，以及以后的骑手App。各说各的语言——你的客人用泰语或阿拉伯语下单，你用自己的语言干活。"
      ja: "<strong>まずは17言語</strong> — 私たちの身の回りで話されている言語です。このページはすでにその全部を話します（上の言語切り替えを試してみて）。そしてプロダクトも同じ針路を進みます：お客様の注文サイト、あなたの店主用スペース、そしてゆくゆくは配達員アプリ。それぞれが自分の言語で — あなたのお客様はタイ語やアラビア語で注文し、あなたは自分の言語で仕事ができます。"
      th: "<strong>17 ภาษา เอาไว้เริ่มต้น</strong> — ภาษาที่ผู้คนรอบตัวเราพูดกัน หน้านี้พูดได้ครบทุกภาษาแล้ว (ลองตัวเลือกภาษาด้านบนดู) และตัวผลิตภัณฑ์ก็จะมุ่งไปตามเส้นทางเดียวกัน: เว็บไซต์สั่งอาหารของลูกค้าคุณ พื้นที่เจ้าของร้านของคุณ และในอนาคตแอปของไรเดอร์ แต่ละคนในภาษาของตัวเอง — ลูกค้าของคุณสั่งเป็นภาษาไทยหรืออาหรับ ส่วนคุณทำงานในภาษาของคุณเอง"
      hi: "<strong>शुरुआत के लिए 17</strong> — वही भाषाएँ, जो हमारे आस-पास बोली जाती हैं। यह पेज पहले से ही ये सारी बोलता है (ऊपर का भाषा-चयनकर्ता आज़माइए)। और प्रोडक्ट भी इसी दिशा में आगे बढ़ेगा: आपके ग्राहकों की ऑर्डर साइट, आपका रेस्टोरेंट स्पेस और आगे चलकर डिलीवरी-राइडरों का ऐप। हर कोई अपनी भाषा में — आपका ग्राहक थाई या अरबी में ऑर्डर करता है, और आप अपनी भाषा में काम करते हैं।"
      ta: "<strong>தொடக்கத்திற்கு 17</strong> — நம்மைச் சுற்றி பேசப்படும் மொழிகள். இந்தப் பக்கம் ஏற்கெனவே அவை அனைத்தையும் பேசுகிறது (மேலே உள்ள மொழித் தேர்வியை முயன்று பாருங்கள்). தயாரிப்பும் அதே திசையிலேயே பயணிக்கும்: உங்கள் வாடிக்கையாளர்களின் ஆர்டர் தளம், உங்கள் உணவக உரிமையாளர் பகுதி, பின்னர் டெலிவரி செய்பவர்களின் ஆப். ஒவ்வொருவரும் தத்தம் மொழியில் — உங்கள் வாடிக்கையாளர் தாய் அல்லது அரபு மொழியில் ஆர்டர் செய்கிறார், நீங்கள் உங்கள் மொழியில் வேலை செய்கிறீர்கள்."
      ar: "<strong>17 لغة، للبداية</strong> — اللغات التي تُتحدَّث من حولنا. هذه الصفحة تتحدثها كلها بالفعل (جرّب مُبدِّل اللغة في الأعلى). والمنتج سيتبع المسار نفسه: موقع الطلب لزبائنك، ومساحتك كصاحب مطعم، ثم تطبيق السائقين لاحقًا. كلٌّ بلغته — زبونك يطلب بالتايلاندية أو بالعربية، وأنت تعمل بلغتك."
      ar-lb: "<strong>17، لنبلّش</strong> — اللغات يلي منحكيها حوالينا. هالصفحة صارت بتحكيهن كلّهن (جرّب مبدّل اللغة فوق). والمنتج رح يمشي عنفس الخط: موقع الطلبات تبع زبايتك، ومساحتك كصاحب مطعم، ومع الوقت تطبيق الدليفري. كل واحد بلغته — زبونك بيطلب بالتايلاندي أو بالعربي، وإنت بتشتغل بلغتك."
      he: "<strong>17, בתור התחלה</strong> — השפות שמדברים סביבנו. הדף הזה כבר מדבר את כולן (נסה את בורר השפות למעלה). והמוצר ימשיך באותו כיוון: אתר ההזמנות של הלקוחות שלך, אזור המסעדן שלך, ובהמשך אפליקציית השליחים. כל אחד בשפה שלו — הלקוח שלך מזמין בתאית או בערבית, ואתה עובד בשלך."
  faq.img_alt:
    messages:
      fr: "Le Capitaine Food, l'index sur la tempe, invite à réfléchir aux questions"
      en: "Captain Food, finger to his temple, inviting you to think it over"
      es: "El Capitán Food, con el índice en la sien, invita a reflexionar sobre las preguntas"
      it: "Il Capitan Food, con l'indice sulla tempia, invita a riflettere sulle domande"
      pt: "O Capitão Food, com o indicador na têmpora, convida a refletir sobre as perguntas"
      de: "Captain Food, den Zeigefinger an der Schläfe, lädt zum Nachdenken über die Fragen ein"
      tr: "Kaptan Food, işaret parmağı şakağında, soruları düşünmeye davet ediyor"
      el: "Ο Captain Food, με τον δείκτη στον κρόταφο, σε καλεί να σκεφτείς τις ερωτήσεις"
      ro: "Căpitanul Food, cu degetul la tâmplă, te invită să cugeți la întrebări"
      zh: "Food 船长手指点着太阳穴，邀你一起想想这些问题"
      ja: "こめかみに人差し指を当てて、質問を考えるよう誘うキャプテン・フード"
      th: "กัปตัน Food เอานิ้วชี้แตะขมับ ชวนให้ขบคิดกับคำถาม"
      hi: "कैप्टन फ़ूड, कनपटी पर उँगली रखे, सवालों पर सोचने का न्योता देता है"
      ta: "நெற்றியில் விரல் வைத்து யோசிக்கத் தூண்டும் கேப்டன் ஃபுட்"
      ar: "الكابتن فود واضعًا سبابته على صدغه، يدعوك للتفكير في الأسئلة"
      ar-lb: "الكابتن فود، حاطط إصبعه على صدغه، عم يعزمك تفكّر بالأسئلة"
      he: "קפטן פוד, אצבע על הרקה, מזמין לחשוב על השאלות"
  faq.intro:
    messages:
      fr: "Tout ce que les restaurateurs nous demandent — en clair, sans détour."
      en: "Everything restaurateurs ask us — in plain words, no dodging."
      es: "Todo lo que los hosteleros nos preguntan — claro y sin rodeos."
      it: "Tutto quello che i ristoratori ci chiedono — in chiaro, senza giri di parole."
      pt: "Tudo o que os restauradores nos perguntam — às claras, sem rodeios."
      de: "Alles, was Gastronomen uns fragen — klar und ohne Umschweife."
      tr: "Restorancıların bize sorduğu her şey — açık açık, lafı dolandırmadan."
      el: "Όλα όσα μας ρωτούν οι εστιάτορες — καθαρά, χωρίς περιστροφές."
      ro: "Tot ce ne întreabă restauratorii — pe șleau, fără ocolișuri."
      zh: "餐饮人问过我们的一切——直截了当，明明白白。"
      ja: "店主のみなさんから届く質問のすべてに — 遠回しなし、はっきりと。"
      th: "ทุกอย่างที่เจ้าของร้านถามเรา — ตอบชัด ๆ ไม่อ้อมค้อม"
      hi: "रेस्टोरेंट मालिक हमसे जो भी पूछते हैं — साफ़-साफ़, बिना घुमाए।"
      ta: "உணவக உரிமையாளர்கள் எங்களிடம் கேட்பவை எல்லாம் — தெளிவாக, சுற்றி வளைக்காமல்."
      ar: "كل ما يسألنا عنه أصحاب المطاعم — بوضوح وبلا مواربة."
      ar-lb: "كل شي أصحاب المطاعم بيسألونا ياه — عالمكشوف، وبلا لفّ ودوران."
      he: "כל מה שמסעדנים שואלים אותנו — ברור, בלי סיבובים."
  faq.q1:
    messages:
      fr: "C'est gratuit pour moi — et vous vivez de quoi ?"
      en: "It's free for me — so what do you live on?"
      es: "Es gratis para mí — ¿y vosotros de qué vivís?"
      it: "Per me è gratis — e voi di cosa vivete?"
      pt: "É grátis para mim — então vivem de quê?"
      de: "Für mich ist es gratis — und wovon lebt ihr?"
      tr: "Benim için ücretsiz — peki siz neyle geçiniyorsunuz?"
      el: "Για μένα είναι δωρεάν — κι εσείς από τι ζείτε;"
      ro: "Pentru mine e gratuit — și voi din ce trăiți?"
      zh: "对我免费——那你们靠什么活？"
      ja: "私は無料 — で、あなたたちは何で食べていくの？"
      th: "ฟรีสำหรับฉัน — แล้วพวกคุณอยู่ได้ด้วยอะไร?"
      hi: "मेरे लिए मुफ़्त है — तो आप चलते किससे हैं?"
      ta: "எனக்கு இலவசம் என்றால் — நீங்கள் எதில் வாழ்கிறீர்கள்?"
      ar: "مجاني بالنسبة لي — إذن ممّ تعيشون؟"
      ar-lb: "ببلاش عليّي — طيّب إنتو عايشين من شو؟"
      he: "זה חינם בשבילי — אז ממה אתם חיים?"
  faq.q2:
    messages:
      fr: "Et ce que mes clients paient en caisse ?"
      en: "What about what my customers pay at the till?"
      es: "¿Y lo que mis clientes pagan en caja?"
      it: "E quello che i miei clienti pagano in cassa?"
      pt: "E o que os meus clientes pagam na caixa?"
      de: "Und was meine Gäste an der Kasse zahlen?"
      tr: "Peki müşterilerimin kasada ödediği?"
      el: "Και αυτά που πληρώνουν οι πελάτες μου στο ταμείο;"
      ro: "Și ce plătesc clienții mei la casă?"
      zh: "那客人在收银台付的钱呢？"
      ja: "レジで支払われる分は？"
      th: "แล้วเงินที่ลูกค้าจ่ายหน้าเคาน์เตอร์ล่ะ?"
      hi: "और जो मेरे ग्राहक काउंटर पर चुकाते हैं?"
      ta: "என் வாடிக்கையாளர்கள் கல்லாவில் செலுத்துவது?"
      ar: "وماذا عمّا يدفعه زبائني في الصندوق؟"
      ar-lb: "ويلّي زبايني بيدفعوه عالكاشير؟"
      he: "ומה עם מה שהלקוחות שלי משלמים בקופה?"
  faq.q3:
    messages:
      fr: "Et le coût de la livraison, qui le paiera ?"
      en: "And the cost of delivery — who'll pay for it?"
      es: "¿Y el coste del reparto, quién lo pagará?"
      it: "E il costo della consegna, chi lo pagherà?"
      pt: "E o custo da entrega, quem o vai pagar?"
      de: "Und die Lieferkosten — wer zahlt die?"
      tr: "Ya teslimat maliyeti — onu kim ödeyecek?"
      el: "Και το κόστος της διανομής, ποιος θα το πληρώνει;"
      ro: "Și costul livrării, cine îl va plăti?"
      zh: "那配送费，谁来出？"
      ja: "配達コストは、誰が払うの？"
      th: "แล้วค่าส่งล่ะ ใครจะเป็นคนจ่าย?"
      hi: "और डिलीवरी की लागत — वह कौन देगा?"
      ta: "டெலிவரி செலவை யார் கட்டுவார்கள்?"
      ar: "وتكلفة التوصيل، من سيدفعها؟"
      ar-lb: "وكلفة التوصيل، مين رح يدفعها؟"
      he: "ועלות המשלוח, מי ישלם אותה?"
  faq.q4:
    messages:
      fr: "Je dois quitter Uber Eats / Deliveroo ?"
      en: "Do I have to leave Uber Eats / Deliveroo?"
      es: "¿Tengo que dejar Uber Eats / Deliveroo?"
      it: "Devo lasciare Uber Eats / Deliveroo?"
      pt: "Tenho de deixar o Uber Eats / Deliveroo?"
      de: "Muss ich Uber Eats / Deliveroo verlassen?"
      tr: "Uber Eats / Deliveroo'dan çıkmam mı gerekiyor?"
      el: "Πρέπει να φύγω από Uber Eats / Deliveroo;"
      ro: "Trebuie să renunț la Uber Eats / Deliveroo?"
      zh: "我得退出 Uber Eats / Deliveroo 吗？"
      ja: "Uber Eats / Deliverooをやめないといけない？"
      th: "ฉันต้องเลิกใช้ Uber Eats / Deliveroo ไหม?"
      hi: "क्या मुझे Uber Eats / Deliveroo छोड़ना होगा?"
      ta: "நான் Uber Eats / Deliveroo-வை விட்டு வெளியேற வேண்டுமா?"
      ar: "هل يجب أن أغادر Uber Eats / Deliveroo؟"
      ar-lb: "لازم اترك Uber Eats / Deliveroo؟"
      he: "אני חייב לעזוב את Uber Eats / Deliveroo?"
  faq.q5:
    messages:
      fr: "Il n'y a pas encore de clients sur la plateforme, pourquoi m'inscrire maintenant ?"
      en: "There are no customers on the platform yet — why sign up now?"
      es: "Todavía no hay clientes en la plataforma, ¿por qué apuntarme ya?"
      it: "Non ci sono ancora clienti sulla piattaforma: perché iscrivermi adesso?"
      pt: "Ainda não há clientes na plataforma, porquê inscrever-me agora?"
      de: "Es gibt noch keine Gäste auf der Plattform — warum sollte ich mich jetzt anmelden?"
      tr: "Platformda henüz müşteri yok, neden şimdi kaydolayım?"
      el: "Δεν υπάρχουν ακόμα πελάτες στην πλατφόρμα — γιατί να γραφτώ τώρα;"
      ro: "Încă nu sunt clienți pe platformă — de ce să mă înscriu acum?"
      zh: "平台上还没有客人，我现在注册图什么？"
      ja: "まだお客がいないのに、なぜ今登録するの？"
      th: "ยังไม่มีลูกค้าบนแพลตฟอร์มเลย ทำไมฉันต้องสมัครตอนนี้?"
      hi: "प्लेटफ़ॉर्म पर अभी ग्राहक ही नहीं हैं — मैं अभी क्यों साइन-अप करूँ?"
      ta: "தளத்தில் இன்னும் வாடிக்கையாளர்கள் இல்லை, ஏன் இப்போதே பதிவு செய்ய வேண்டும்?"
      ar: "لا يوجد زبائن على المنصة بعد، فلماذا أسجّل الآن؟"
      ar-lb: "لسّا ما في زباين عالمنصّة، ليش سجّل هلّق؟"
      he: "עוד אין לקוחות בפלטפורמה, למה להירשם עכשיו?"
  faq.q6:
    messages:
      fr: "Comment je récupère mes clients ?"
      en: "How do I get my customers back?"
      es: "¿Cómo recupero a mis clientes?"
      it: "Come recupero i miei clienti?"
      pt: "Como é que recupero os meus clientes?"
      de: "Wie komme ich an meine Gäste?"
      tr: "Müşterilerimi nasıl geri kazanırım?"
      el: "Πώς παίρνω πίσω τους πελάτες μου;"
      ro: "Cum îmi recuperez clienții?"
      zh: "我怎么拿回我的客人？"
      ja: "顧客はどうやって取り戻せる？"
      th: "ฉันจะได้ข้อมูลลูกค้ากลับมาได้ยังไง?"
      hi: "मैं अपने ग्राहक वापस कैसे पाऊँगा?"
      ta: "என் வாடிக்கையாளர்களை நான் எப்படி மீட்பது?"
      ar: "كيف أسترجع زبائني؟"
      ar-lb: "كيف برجّع زبايني لعندي؟"
      he: "איך אני מקבל את הלקוחות שלי?"
  faq.q7:
    messages:
      fr: "C'est quoi, une entreprise ESUS ?"
      en: "What's an ESUS company?"
      es: "¿Qué es eso de una empresa ESUS?"
      it: "Cos'è un'impresa ESUS?"
      pt: "O que é uma empresa ESUS?"
      de: "Was ist ein ESUS-Unternehmen?"
      tr: "ESUS şirketi ne demek?"
      el: "Τι είναι μια επιχείρηση ESUS;"
      ro: "Ce e aia o întreprindere ESUS?"
      zh: "ESUS 企业是什么？"
      ja: "ESUS企業って何？"
      th: "ESUS คืออะไร?"
      hi: "यह ESUS कंपनी क्या होती है?"
      ta: "ESUS நிறுவனம் என்றால் என்ன?"
      ar: "ما معنى مؤسسة ESUS؟"
      ar-lb: "شو يعني شركة ESUS؟"
      he: "מה זה בכלל עסק ESUS?"
  faq.q8:
    messages:
      fr: "Et pour la commande à table (QR code) ?"
      en: "What about ordering at the table (QR code)?"
      es: "¿Y el pedido en mesa (código QR)?"
      it: "E per l'ordine al tavolo (QR code)?"
      pt: "E a encomenda à mesa (código QR)?"
      de: "Und die Bestellung am Tisch (QR-Code)?"
      tr: "Peki masada sipariş (QR kod)?"
      el: "Και για την παραγγελία στο τραπέζι (QR code);"
      ro: "Și comanda la masă (cod QR)?"
      zh: "那桌边扫码点餐（QR code）呢？"
      ja: "テーブル注文（QRコード）は？"
      th: "แล้วการสั่งที่โต๊ะ (QR โค้ด) ล่ะ?"
      hi: "और टेबल पर ऑर्डर (QR कोड) का क्या?"
      ta: "டேபிள் ஆர்டர் (QR கோடு) பற்றி என்ன?"
      ar: "وماذا عن الطلب على الطاولة (رمز QR)؟"
      ar-lb: "والطلب عالطاولة (QR كود)؟"
      he: "ומה עם הזמנה ליד השולחן (QR)?"
  faq.q9:
    messages:
      fr: "Vous parlez combien de langues — pour mes clients, pour moi, pour les livreurs ?"
      en: "How many languages do you speak — for my customers, for me, for the riders?"
      es: "¿Cuántos idiomas habláis — para mis clientes, para mí, para los repartidores?"
      it: "Quante lingue parlate — per i miei clienti, per me, per i rider?"
      pt: "Quantas línguas falam — para os meus clientes, para mim, para os estafetas?"
      de: "Wie viele Sprachen sprecht ihr — für meine Gäste, für mich, für die Fahrer?"
      tr: "Kaç dil konuşuyorsunuz — müşterilerim için, benim için, kuryeler için?"
      el: "Πόσες γλώσσες μιλάτε — για τους πελάτες μου, για μένα, για τους διανομείς;"
      ro: "Câte limbi vorbiți — pentru clienții mei, pentru mine, pentru curieri?"
      zh: "你们会说几种语言——为我的客人、为我自己，还有为骑手？"
      ja: "いくつの言語を話せるの — 私のお客様に、私に、配達員に？"
      th: "คุณพูดได้กี่ภาษา — สำหรับลูกค้าของฉัน สำหรับฉัน แล้วก็สำหรับไรเดอร์?"
      hi: "आप कितनी भाषाएँ बोलते हैं — मेरे ग्राहकों के लिए, मेरे लिए, डिलीवरी-राइडरों के लिए?"
      ta: "நீங்கள் எத்தனை மொழிகள் பேசுகிறீர்கள் — என் வாடிக்கையாளர்களுக்கு, எனக்கு, டெலிவரி செய்பவர்களுக்கு?"
      ar: "كم لغة تتحدثون — لزبائني، ولي، وللسائقين؟"
      ar-lb: "قدّيش لغة بتحكو — لزبايني، وإلي، وللدليفري؟"
      he: "כמה שפות אתם מדברים — בשביל הלקוחות שלי, בשבילי, בשביל השליחים?"
  faq.title:
    messages:
      fr: "Les questions qu'on nous pose"
      en: "The questions we get asked"
      es: "Las preguntas que nos hacen"
      it: "Le domande che ci fanno"
      pt: "As perguntas que nos fazem"
      de: "Die Fragen, die man uns stellt"
      tr: "Bize sorulan sorular"
      el: "Οι ερωτήσεις που μας κάνουν"
      ro: "Întrebările pe care ni le pune lumea"
      zh: "大家常问我们的问题"
      ja: "よく聞かれる質問"
      th: "คำถามที่มีคนถามเราบ่อย ๆ"
      hi: "जो सवाल हमसे पूछे जाते हैं"
      ta: "எங்களிடம் கேட்கப்படும் கேள்விகள்"
      ar: "الأسئلة التي تصلنا"
      ar-lb: "الأسئلة يلّي بيسألونا ياها"
      he: "השאלות ששואלים אותנו"

  # ---- feature ----
  feature.clients_body:
    messages:
      fr: "Dès la première commande en direct, tu accèdes à ta base clients — pour les fidéliser et les faire revenir. C'est à toi."
      en: "From the very first direct order, you get access to your customer base — to build loyalty and bring them back. It's yours."
      es: "Desde el primer pedido directo, accedes a tu base de clientes — para fidelizarlos y hacer que vuelvan. Es tuya."
      it: "Dal primo ordine diretto, accedi alla tua base clienti — per fidelizzarli e farli tornare. È tua."
      pt: "Desde a primeira encomenda em direto, acedes à tua base de clientes — para os fidelizar e os fazer voltar. É tua."
      de: "Ab der ersten Direktbestellung hast du Zugriff auf deine Kundendatei — um Stammgäste zu binden und sie zurückzuholen. Sie gehört dir."
      tr: "İlk doğrudan siparişten itibaren müşteri veritabanına erişirsin — onlarla bağ kurmak ve geri getirmek için. Bu senin."
      el: "Από την πρώτη απευθείας παραγγελία, έχεις πρόσβαση στη βάση πελατών σου — για να τους κρατήσεις κοντά και να τους ξαναφέρεις. Είναι δική σου."
      ro: "De la prima comandă directă, ai acces la baza ta de clienți — ca să-i fidelizezi și să-i faci să revină. E a ta."
      zh: "从第一笔直接订单起，你就能拿到自己的客户资料——自己维护熟客，让他们常回来。这是你的。"
      ja: "最初の直接注文から、顧客リストにアクセスできます。リピートにつなげ、常連にする — あなたのものだから。"
      th: "ตั้งแต่ออร์เดอร์ตรงรายการแรก คุณเข้าถึงฐานข้อมูลลูกค้าของคุณได้ — เพื่อดูแลความสัมพันธ์และทำให้พวกเขากลับมาอีก มันเป็นของคุณ"
      hi: "पहले सीधे ऑर्डर से ही आपको अपना ग्राहक-डेटा मिलता है — उन्हें जोड़े रखने और वापस बुलाने के लिए। यह आपका है।"
      ta: "முதல் நேரடி ஆர்டரிலிருந்தே உங்கள் வாடிக்கையாளர் தரவு உங்கள் கையில் — அவர்களை நிலைநிறுத்தவும், மீண்டும் வர வைக்கவும். அது உங்களுடையது."
      ar: "من أول طلب مباشر، تصل إلى قاعدة زبائنك — لتكسب ولاءهم وتجعلهم يعودون. إنها ملكك."
      ar-lb: "من أوّل طلب مباشر، بتوصل لقاعدة زبايناتك — لتخلّيهن يرجعوا ويضلّوا وفيين. هيدي إلك."
      he: "מההזמנה הישירה הראשונה יש לך גישה למאגר הלקוחות שלך — כדי לשמר אותם ולהחזיר אותם. זה שלך."
  feature.clients_title:
    messages:
      fr: "Ta clientèle t'appartient."
      en: "Your customer base belongs to you."
      es: "Tu clientela te pertenece."
      it: "La tua clientela appartiene a te."
      pt: "A tua clientela pertence-te."
      de: "Deine Gäste gehören dir."
      tr: "Müşteri kitlen sana ait."
      el: "Η πελατεία σου σού ανήκει."
      ro: "Clientela ta îți aparține."
      zh: "客源归你所有。"
      ja: "顧客はあなたのもの。"
      th: "ฐานลูกค้าเป็นของคุณ"
      hi: "आपके ग्राहक आपकी अमानत हैं।"
      ta: "உங்கள் வாடிக்கையாளர்கள் உங்கள் சொத்து."
      ar: "زبائنك ملك لك."
      ar-lb: "زبايناتك ملكك إنت."
      he: "קהל הלקוחות שייך לך."
  feature.commission_body:
    messages:
      fr: "Tu gardes 100 % du prix de ce que tu vends. Toujours."
      en: "You keep 100% of the price of what you sell. Always."
      es: "Te quedas con el 100 % del precio de lo que vendes. Siempre."
      it: "Tieni il 100% del prezzo di quello che vendi. Sempre."
      pt: "Ficas com 100% do preço do que vendes. Sempre."
      de: "Du behältst 100 % vom Preis dessen, was du verkaufst. Immer."
      tr: "Sattığın her şeyin fiyatının %100'ü sende kalır. Her zaman."
      el: "Κρατάς το 100 % της τιμής όσων πουλάς. Πάντα."
      ro: "Păstrezi 100% din prețul a tot ce vinzi. Mereu."
      zh: "你卖多少，就拿多少，100%归你。永远如此。"
      ja: "売った金額の100%が、あなたのもの。いつでも。"
      th: "คุณเก็บราคาขายของทุกจานไว้เต็ม 100 % เสมอ"
      hi: "जो बेचते हैं, उसकी 100% क़ीमत आपकी। हमेशा।"
      ta: "நீங்கள் விற்பதன் விலையில் 100 % உங்களுக்கே. எப்போதும்."
      ar: "تحتفظ بـ100% من سعر ما تبيعه. دائمًا."
      ar-lb: "بتحتفظ بـ100% من سعر يلّي عم تبيعه. دايماً."
      he: "אתה שומר 100% מהמחיר של מה שאתה מוכר. תמיד."
  feature.commission_title:
    messages:
      fr: "0 % de commission sur tes plats."
      en: "0% commission on your dishes."
      es: "0 % de comisión sobre tus platos."
      it: "0% di commissioni sui tuoi piatti."
      pt: "0% de comissão sobre os teus pratos."
      de: "0 % Provision auf deine Gerichte."
      tr: "Yemeklerinde %0 komisyon."
      el: "0 % προμήθεια στα πιάτα σου."
      ro: "0% comision pe preparatele tale."
      zh: "菜品0%佣金。"
      ja: "料理への手数料は0%。"
      th: "ค่าคอมมิชชั่น 0 % จากอาหารของคุณ"
      hi: "आपके पकवानों पर 0% कमीशन।"
      ta: "உங்கள் உணவுகளில் 0 % கமிஷன்."
      ar: "عمولة 0% على أطباقك."
      ar-lb: "0% عمولة على أكلك."
      he: "0% עמלה על המנות שלך."
  feature.prices_body:
    messages:
      fr: "Les mêmes prix qu'en salle. Rien à gonfler, rien à cacher."
      en: "The same prices as dine-in. Nothing to inflate, nothing to hide."
      es: "Los mismos precios que en sala. Nada que hinchar, nada que esconder."
      it: "Gli stessi prezzi che in sala. Niente da gonfiare, niente da nascondere."
      pt: "Os mesmos preços da sala. Nada a inflacionar, nada a esconder."
      de: "Dieselben Preise wie im Lokal. Nichts aufblasen, nichts verstecken."
      tr: "Salondakiyle aynı fiyatlar. Şişirecek bir şey yok, saklayacak bir şey yok."
      el: "Οι ίδιες τιμές με του μαγαζιού. Τίποτα να φουσκώσεις, τίποτα να κρύψεις."
      ro: "Aceleași prețuri ca în local. Nimic de umflat, nimic de ascuns."
      zh: "和堂食一个价。不用抬价，不用藏着掖着。"
      ja: "店内とまったく同じ価格。水増しも、隠しごともなし。"
      th: "ราคาเดียวกับหน้าร้าน ไม่ต้องบวกเพิ่ม ไม่ต้องปิดบัง"
      hi: "वही दाम जो रेस्टोरेंट में। न कुछ फुलाना, न कुछ छिपाना।"
      ta: "உணவகத்தில் இருப்பது போலவே அதே விலைகள். உயர்த்த எதுவும் இல்லை, மறைக்க எதுவும் இல்லை."
      ar: "الأسعار نفسها كما في الصالة. لا شيء ترفعه، ولا شيء تخفيه."
      ar-lb: "نفس الأسعار متل بالصالة. ما في شي تنفخه، ولا شي تخبّيه."
      he: "אותם מחירים כמו במסעדה. אין מה לנפח, אין מה להסתיר."
  feature.prices_title:
    messages:
      fr: "Tes prix, sans double carte."
      en: "Your prices, no double menu."
      es: "Tus precios, sin carta doble."
      it: "I tuoi prezzi, senza doppio listino."
      pt: "Os teus preços, sem menus a dobrar."
      de: "Deine Preise, ohne doppelte Karte."
      tr: "Fiyatların, çift menü derdi olmadan."
      el: "Οι τιμές σου, χωρίς διπλό τιμοκατάλογο."
      ro: "Prețurile tale, fără meniu dublu."
      zh: "你的价格，无需两套菜单。"
      ja: "二重価格のない、あなたの価格。"
      th: "ราคาของคุณ ไม่ต้องมีเมนูสองราคา"
      hi: "आपके दाम — बिना दोहरी मेन्यू-लिस्ट के।"
      ta: "உங்கள் விலைகள் — இரட்டை மெனு இல்லை."
      ar: "أسعارك، بدون قائمة مزدوجة."
      ar-lb: "أسعارك، بلا لائحتين."
      he: "המחירים שלך, בלי תפריט כפול."
  feature.site_body:
    messages:
      fr: "Pas une fiche noyée dans l'annuaire d'un autre : un vrai site de commande à toi, <code>tonresto.captain.food</code>, ta vitrine en ligne. Inclus. (Ton propre domaine <code>tonresto.fr</code> ? On te le met en place, en option.)"
      en: "Not a listing drowned in someone else's directory: a real ordering site of your own, <code>yourresto.captain.food</code>, your online storefront. Included. (Want your own domain, <code>yourresto.fr</code>? We'll set it up for you, as an option.)"
      es: "No una ficha perdida en el directorio de otro: una web de pedidos de verdad, tuya, <code>turesto.captain.food</code>, tu escaparate online. Incluida. (¿Tu propio dominio <code>turesto.fr</code>? Te lo montamos, como opción.)"
      it: "Non una scheda affogata nell'elenco di qualcun altro: un vero sito di ordini tutto tuo, <code>iltuoristorante.captain.food</code>, la tua vetrina online. Incluso. (Vuoi il tuo dominio <code>iltuoristorante.fr</code>? Te lo configuriamo noi, come opzione.)"
      pt: "Nada de seres uma ficha afogada no diretório de outro: um verdadeiro site de encomendas teu, <code>oteuresto.captain.food</code>, a tua montra online. Incluído. (O teu próprio domínio <code>oteuresto.fr</code>? Configuramo-lo por ti, como opção.)"
      de: "Kein Eintrag, der im Verzeichnis eines anderen untergeht: eine echte, eigene Bestell-Website, <code>deinresto.captain.food</code>, deine Online-Vitrine. Inklusive. (Deine eigene Domain <code>deinresto.fr</code>? Richten wir dir ein, optional.)"
      tr: "Başkasının rehberinde kaybolan bir kart değil: sana ait gerçek bir sipariş sitesi, <code>restoranin.captain.food</code> — online vitrinin. Dahil. (Kendi alan adın <code>restoranin.fr</code> mi olsun? İstersen onu da biz kurarız, opsiyonel.)"
      el: "Όχι μια καταχώριση χαμένη στον κατάλογο κάποιου άλλου: ένα πραγματικό site παραγγελιών, δικό σου, <code>toestiatoriosou.captain.food</code>, η online βιτρίνα σου. Περιλαμβάνεται. (Δικό σου domain <code>toestiatoriosou.fr</code>; Σ' το στήνουμε, προαιρετικά.)"
      ro: "Nu o fișă înecată în catalogul altcuiva: un site de comenzi cu adevărat al tău, <code>restaurantultau.captain.food</code>, vitrina ta online. Inclus. (Propriul tău domeniu <code>restaurantultau.fr</code>? Ți-l punem noi pe picioare, opțional.)"
      zh: "不是淹没在别人目录里的一个条目，而是真正属于你的点餐网站：<code>nidecanting.captain.food</code>，你的线上门面。已包含。（想要自己的域名 <code>nidecanting.fr</code>？我们帮你配好，可选。）"
      ja: "誰かのディレクトリに埋もれた1ページではなく、あなた専用の本物の注文サイト、<code>anatanomise.captain.food</code>。あなたのオンラインの顔です。料金に込み。（独自ドメイン<code>anatanomise.fr</code>が欲しい？オプションで設定をお手伝いします。）"
      th: "ไม่ใช่หน้าร้านเล็ก ๆ ที่จมหายอยู่ในสารบัญของคนอื่น แต่เป็นเว็บไซต์รับออร์เดอร์ของคุณจริง ๆ <code>ranahan.captain.food</code> หน้าร้านออนไลน์ของคุณ รวมอยู่ในบริการแล้ว (อยากได้โดเมนของตัวเองแบบ <code>ranahan.fr</code>? เราติดตั้งให้ได้ เป็นตัวเลือกเสริม)"
      hi: "किसी और की डायरेक्टरी में गुम एक लिस्टिंग नहीं: आपकी अपनी असली ऑर्डरिंग साइट, <code>aapkarestaurant.captain.food</code> — आपकी ऑनलाइन दुकान। शामिल है। (अपना ख़ुद का डोमेन <code>aapkarestaurant.fr</code> चाहिए? हम लगा देंगे — वैकल्पिक।)"
      ta: "வேறொருவரின் அட்டவணையில் மூழ்கிப்போன ஒரு பட்டியல் அல்ல: <code>ungal-unavagam.captain.food</code> — உங்களுக்கே சொந்தமான உண்மையான ஆர்டர் தளம், உங்கள் ஆன்லைன் முகப்பு. சேவையில் அடங்கியது. (உங்கள் சொந்த டொமைன் <code>ungal-unavagam.fr</code> வேண்டுமா? விருப்பத் தேர்வாக நாங்களே அமைத்துத் தருகிறோம்.)"
      ar: "ليست بطاقة تعريف غارقة في دليل غيرك: موقع طلب حقيقي خاص بك، <code>matamak.captain.food</code>، واجهتك على الإنترنت. مشمول في الخدمة. (تريد نطاقك الخاص <code>matamak.fr</code>؟ نجهّزه لك، كخيار إضافي.)"
      ar-lb: "مش صفحة غرقانة بدليل حدا تاني: موقع طلب حقيقي إلك، <code>matamak.captain.food</code>، واجهتك أونلاين. ضمن الخدمة. (بدك دومين خاص فيك <code>matamak.fr</code>؟ منركّبلك ياه، كخيار إضافي.)"
      he: "לא עוד כרטיס שטובע במדריך של מישהו אחר: אתר הזמנות אמיתי משלך, <code>hamisada.captain.food</code>, חלון הראווה שלך אונליין. כלול במחיר. (רוצה דומיין משלך, <code>hamisada.fr</code>? נקים לך אותו, כאופציה.)"
  feature.site_title:
    messages:
      fr: "Ton site à ton nom."
      en: "Your own site, under your name."
      es: "Tu web con tu nombre."
      it: "Il tuo sito, a tuo nome."
      pt: "O teu site com o teu nome."
      de: "Deine Website unter deinem Namen."
      tr: "Kendi adınla kendi siten."
      el: "Το δικό σου site, με το όνομά σου."
      ro: "Site-ul tău, pe numele tău."
      zh: "挂你名字的网站。"
      ja: "あなたの名前のサイト。"
      th: "เว็บไซต์ของคุณ ในชื่อของคุณ"
      hi: "आपकी साइट, आपके नाम पर।"
      ta: "உங்கள் பெயரில் உங்கள் இணையதளம்."
      ar: "موقعك باسمك."
      ar-lb: "موقعك باسمك."
      he: "אתר משלך, על שמך."

  # ---- finance ----
  finance.cue:
    messages:
      fr: "Comment on se finance, en clair →"
      en: "How we fund ourselves, in plain words →"
      es: "Cómo nos financiamos, bien claro →"
      it: "Come ci finanziamo, in chiaro →"
      pt: "Como nos financiamos, às claras →"
      de: "Wie wir uns finanzieren, ganz offen →"
      tr: "Nasıl finanse oluyoruz, açık açık →"
      el: "Πώς χρηματοδοτούμαστε, καθαρά και ξάστερα →"
      ro: "Cum ne finanțăm, pe șleau →"
      zh: "我们靠什么运转，明明白白 →"
      ja: "運営資金の仕組み、はっきりと →"
      th: "เราหาทุนอย่างไร อธิบายชัด ๆ →"
      hi: "हम कैसे चलते हैं — साफ़-साफ़ →"
      ta: "நாங்கள் எப்படி நிதி திரட்டுகிறோம், தெளிவாக →"
      ar: "كيف نموّل أنفسنا، بوضوح ←"
      ar-lb: "كيف عم نموّل حالنا، عالمكشوف ←"
      he: "איך אנחנו מממנים את עצמנו, בגובה העיניים →"
  finance.p1:
    messages:
      fr: "Question légitime — et voici la réponse, en clair."
      en: "Fair question — and here's the answer, in plain words."
      es: "Pregunta legítima — y aquí va la respuesta, bien clara."
      it: "Domanda legittima — ed ecco la risposta, in chiaro."
      pt: "Pergunta legítima — e aqui está a resposta, às claras."
      de: "Berechtigte Frage — hier die Antwort, ganz offen."
      tr: "Gayet haklı bir soru — işte cevabı, dobra dobra."
      el: "Δίκαιη ερώτηση — και να η απάντηση, καθαρά και ξάστερα."
      ro: "Întrebare legitimă — și iată răspunsul, pe șleau."
      zh: "问得好——答案在这里，明明白白。"
      ja: "もっともな疑問です。答えを、はっきりお伝えします。"
      th: "เป็นคำถามที่สมเหตุสมผล — และนี่คือคำตอบแบบตรงไปตรงมา"
      hi: "जायज़ सवाल — और यह रहा जवाब, साफ़-साफ़।"
      ta: "நியாயமான கேள்வி — இதோ தெளிவான பதில்."
      ar: "سؤال مشروع — وهذا هو الجواب، بكل وضوح."
      ar-lb: "سؤال بمحلّه — وهيدا الجواب، عالمكشوف."
      he: "שאלה לגיטימית — והנה התשובה, בגובה העיניים."
  finance.p2:
    messages:
      fr: "D'abord l'essentiel : <strong>toi, restaurateur, tu ne paies jamais de commission sur tes plats — 0 €, dans tous les cas.</strong> Le service n'est pas financé sur ton dos."
      en: "First, the essential: <strong>you, the restaurateur, never pay a commission on your dishes — €0, no matter what.</strong> The service isn't funded on your back."
      es: "Primero lo esencial: <strong>tú, hostelero, no pagas nunca comisión sobre tus platos — 0 €, en todos los casos.</strong> El servicio no se financia a tu costa."
      it: "Prima l'essenziale: <strong>tu, ristoratore, non paghi mai commissioni sui tuoi piatti — 0 €, in ogni caso.</strong> Il servizio non si finanzia sulle tue spalle."
      pt: "Primeiro, o essencial: <strong>tu, restaurador, nunca pagas comissão sobre os teus pratos — 0 €, em qualquer caso.</strong> O serviço não é financiado à tua custa."
      de: "Zuerst das Wichtigste: <strong>Du als Gastronom zahlst nie Provision auf deine Gerichte — 0 €, in jedem Fall.</strong> Der Service wird nicht auf deinem Rücken finanziert."
      tr: "Önce en önemlisi: <strong>sen, restorancı olarak, yemeklerin üzerinden asla komisyon ödemezsin — her durumda 0 €.</strong> Bu hizmet senin sırtından finanse edilmiyor."
      el: "Πρώτα το βασικό: <strong>εσύ, ο εστιάτορας, δεν πληρώνεις ποτέ προμήθεια στα πιάτα σου — 0 €, σε κάθε περίπτωση.</strong> Η υπηρεσία δεν χρηματοδοτείται στην πλάτη σου."
      ro: "Mai întâi esențialul: <strong>tu, restaurator, nu plătești niciodată comision pe preparatele tale — 0 €, în orice caz.</strong> Serviciul nu e finanțat pe spinarea ta."
      zh: "先说最重要的：<strong>作为餐饮人，你永远不用为菜品付一分佣金——任何情况下都是0 €。</strong>这个服务不靠压榨你来运转。"
      ja: "まず大事なこと：<strong>店主のあなたは、料理への手数料を一切払いません — どんな場合でも0€です。</strong>このサービスは、あなたの負担の上には成り立っていません。"
      th: "เรื่องสำคัญที่สุดก่อน: <strong>คุณในฐานะเจ้าของร้าน ไม่ต้องจ่ายค่าคอมมิชชั่นจากอาหารเลย — 0 € ในทุกกรณี</strong> บริการนี้ไม่ได้หาทุนบนหลังของคุณ"
      hi: "पहले सबसे ज़रूरी बात: <strong>आप, रेस्टोरेंट मालिक, अपने पकवानों पर कभी कमीशन नहीं देते — हर हाल में 0 €।</strong> यह सेवा आपकी जेब से नहीं चलती।"
      ta: "முதலில் மிக முக்கியமானது: <strong>உணவக உரிமையாளரான நீங்கள் உங்கள் உணவுகளில் ஒருபோதும் கமிஷன் கட்டுவதில்லை — எந்தச் சூழலிலும் 0 €.</strong> இந்தச் சேவை உங்கள் முதுகில் ஏற்றி நிதியாக்கப்படவில்லை."
      ar: "أولًا الأهم: <strong>أنت، صاحب المطعم، لا تدفع أبدًا أي عمولة على أطباقك — 0 €، في كل الحالات.</strong> الخدمة لا تُموَّل على حسابك."
      ar-lb: "أوّل شي الأساسي: <strong>إنت، يا صاحب المطعم، عمرك ما بتدفع عمولة على أكلك — 0 €، بكل الحالات.</strong> الخدمة مش متموّلة من جيبتك."
      he: "קודם כול העיקר: <strong>אתה, המסעדן, לא משלם אף פעם עמלה על המנות שלך — 0 €, בכל מקרה.</strong> השירות לא ממומן על הגב שלך."
  finance.p3:
    messages:
      fr: "Il est financé par une <strong>contribution du client</strong> en <strong>prix libre</strong>, ajoutée à sa commande : chacun donne ce qu'il veut pour faire vivre une alternative juste. Un pari — celui que des clients informés préfèrent soutenir leur commerce local plutôt qu'une multinationale."
      en: "It's funded by a <strong>customer contribution</strong> at a <strong>pay-what-you-want</strong> price, added to their order: everyone gives what they want to keep a fair alternative alive. It's a bet — that informed customers would rather support their local businesses than a multinational."
      es: "Se financia con una <strong>contribución del cliente</strong> de <strong>precio libre</strong>, añadida a su pedido: cada uno da lo que quiere para sostener una alternativa justa. Una apuesta — la de que un cliente informado prefiere apoyar a su comercio local antes que a una multinacional."
      it: "Si finanzia con un <strong>contributo del cliente</strong> a <strong>prezzo libero</strong>, aggiunto al suo ordine: ognuno dà quello che vuole per far vivere un'alternativa giusta. Una scommessa — quella che clienti informati preferiscano sostenere il commercio locale piuttosto che una multinazionale."
      pt: "É financiado por uma <strong>contribuição do cliente</strong> de <strong>valor livre</strong>, adicionada à encomenda: cada um dá o que quiser para fazer viver uma alternativa justa. Uma aposta — a de que clientes informados preferem apoiar o comércio local a uma multinacional."
      de: "Er wird durch einen <strong>Beitrag des Gastes</strong> finanziert — ein <strong>frei wählbarer Betrag</strong>, der zur Bestellung dazukommt: Jeder gibt, was er möchte, um eine faire Alternative am Leben zu halten. Eine Wette — darauf, dass informierte Gäste lieber ihr lokales Geschäft unterstützen als einen Weltkonzern."
      tr: "Hizmet, siparişe eklenen <strong>müşteri katkısıyla</strong> finanse ediliyor — <strong>dileyen dilediği kadar</strong>: herkes adil bir alternatifi yaşatmak için gönlünden geleni verir. Bir iddia bu — bilinçli müşterilerin, çok uluslu bir şirket yerine mahalledeki esnafı desteklemeyi tercih edeceği iddiası."
      el: "Χρηματοδοτείται από μια <strong>συνεισφορά του πελάτη</strong> σε <strong>ελεύθερη τιμή</strong>, που προστίθεται στην παραγγελία του: ο καθένας δίνει ό,τι θέλει για να ζήσει μια δίκαιη εναλλακτική. Ένα στοίχημα — ότι οι ενημερωμένοι πελάτες προτιμούν να στηρίξουν το τοπικό τους μαγαζί παρά μια πολυεθνική."
      ro: "E finanțat printr-o <strong>contribuție a clientului</strong> cu <strong>preț liber</strong>, adăugată la comanda lui: fiecare dă cât vrea ca să țină în viață o alternativă corectă. Un pariu — acela că niște clienți informați preferă să-și susțină comerțul local, nu o multinațională."
      zh: "它靠客人下单时<strong>自愿添加</strong>的一笔<strong>随心支持金</strong>来运转：每个人想给多少给多少，让一个公平的替代方案活下去。这是一场赌注——赌知情的客人更愿意支持本地小店，而不是跨国巨头。"
      ja: "運営費は、注文に添えられる<strong>お客様の応援金</strong>（<strong>金額自由</strong>）でまかないます。公正な選択肢を生かし続けるために、それぞれが出したい分だけ。ひとつの賭けです — 事情を知ったお客様は、多国籍企業より地元のお店を支えたいはず、という賭け。"
      th: "ทุนมาจาก<strong>เงินสมทบของลูกค้า</strong>แบบ<strong>ตามใจสมัคร</strong> ที่เพิ่มเข้าไปในออร์เดอร์ของเขา: แต่ละคนให้เท่าที่อยากให้ เพื่อหล่อเลี้ยงทางเลือกที่เป็นธรรม นี่คือการเดิมพัน — ว่าลูกค้าที่รู้ข้อมูลจะเลือกสนับสนุนร้านค้าท้องถิ่นมากกว่าบริษัทข้ามชาติ"
      hi: "यह चलती है ग्राहक के <strong>योगदान</strong> से — <strong>जितना दिल चाहे</strong>, उसके ऑर्डर में जुड़कर: हर कोई अपनी मर्ज़ी से देता है, ताकि एक इंसाफ़-भरा विकल्प ज़िंदा रहे। यह एक दाँव है — कि जागरूक ग्राहक किसी बहुराष्ट्रीय कंपनी के बजाय अपने स्थानीय कारोबार को सहारा देना पसंद करेंगे।"
      ta: "இது வாடிக்கையாளரின் <strong>பங்களிப்பால்</strong> நிதியாகிறது — ஆர்டருடன் சேர்க்கப்படும் <strong>விருப்ப விலையில்</strong>: நியாயமான மாற்று ஒன்றை வாழவைக்க அவரவர் விரும்பியதைத் தருகிறார்கள். இது ஒரு பந்தயம் — விவரம் அறிந்த வாடிக்கையாளர்கள் ஒரு பன்னாட்டு நிறுவனத்தை விட தங்கள் உள்ளூர் கடையை ஆதரிக்கவே விரும்புவார்கள் என்ற நம்பிக்கை."
      ar: "تُموَّل من <strong>مساهمة الزبون</strong> بمبدأ <strong>الدفع الحر</strong>، تُضاف إلى طلبه: كلٌّ يعطي ما يشاء لإحياء بديل عادل. إنه رهان — أن الزبائن الواعين يفضّلون دعم متجرهم المحلي على دعم شركة متعددة الجنسيات."
      ar-lb: "متموّلة من <strong>مساهمة الزبون</strong> بـ<strong>مبلغ حرّ</strong> بينضاف على طلبه: كل واحد بيعطي يلّي بدّه ليخلّي بديل عادل يعيش. رهان — إنّه الزبون الواعي بيفضّل يدعم محلّ حيّه بدل شركة عالمية عملاقة."
      he: "הוא ממומן על ידי <strong>תרומת הלקוח</strong> ב<strong>סכום חופשי</strong>, שמתווספת להזמנה שלו: כל אחד נותן כמה שהוא רוצה כדי לקיים אלטרנטיבה הוגנת. הימור — שלקוחות מודעים יעדיפו לתמוך בעסק המקומי שלהם ולא בתאגיד רב-לאומי."
  finance.p4:
    messages:
      fr: "Un client ne contribue pas cette fois ? C'est OK : pas de contribution sur cette commande, et toujours 0 commission pour toi. Les frais de paiement par carte sont ceux, standards, de tout encaissement en ligne — <strong>jamais un pourcentage sur tes plats, jamais une surcharge ajoutée au client.</strong>"
      en: "A customer doesn't contribute this time? That's fine: no contribution on that order, and still 0% commission for you. Card payment fees are the standard fees of any online payment — <strong>never a percentage on your dishes, never a surcharge added for the customer.</strong>"
      es: "¿Un cliente no contribuye esta vez? No pasa nada: sin contribución en ese pedido, y siempre 0 comisión para ti. Las comisiones de pago con tarjeta son las estándar de cualquier cobro online — <strong>nunca un porcentaje sobre tus platos, nunca un recargo añadido al cliente.</strong>"
      it: "Un cliente stavolta non contribuisce? Va bene così: nessun contributo su quell'ordine, e sempre 0 commissioni per te. Le spese di pagamento con carta sono quelle standard di qualsiasi incasso online — <strong>mai una percentuale sui tuoi piatti, mai un sovrapprezzo aggiunto al cliente.</strong>"
      pt: "Um cliente não contribui desta vez? Tudo bem: não há contribuição nessa encomenda, e continua a haver 0 comissão para ti. As taxas de pagamento por cartão são as taxas padrão de qualquer cobrança online — <strong>nunca uma percentagem sobre os teus pratos, nunca uma sobretaxa cobrada ao cliente.</strong>"
      de: "Ein Gast trägt diesmal nichts bei? Kein Problem: kein Beitrag auf diese Bestellung, und für dich weiterhin 0 % Provision. Die Kartenzahlungsgebühren sind die üblichen Gebühren jeder Online-Zahlung — <strong>nie ein Prozentsatz auf deine Gerichte, nie ein Aufschlag für den Gast.</strong>"
      tr: "Müşteri bu sefer katkı yapmadı mı? Sorun değil: o siparişte katkı olmaz, sana yine 0 komisyon. Kartla ödeme masrafları, her online tahsilatın standart banka masraflarıdır — <strong>asla yemeklerinden bir yüzde, asla müşteriye eklenen bir ek ücret değil.</strong>"
      el: "Ένας πελάτης δεν συνεισφέρει αυτή τη φορά; Κανένα πρόβλημα: καμία συνεισφορά σε αυτή την παραγγελία, και πάντα 0 προμήθεια για σένα. Τα έξοδα πληρωμής με κάρτα είναι τα στάνταρ κάθε online είσπραξης — <strong>ποτέ ποσοστό στα πιάτα σου, ποτέ επιπλέον χρέωση στον πελάτη.</strong>"
      ro: "Un client nu contribuie de data asta? E OK: nicio contribuție la comanda respectivă, și tot 0 comision pentru tine. Comisioanele de plată cu cardul sunt cele standard, ale oricărei încasări online — <strong>niciodată un procent din preparatele tale, niciodată o suprataxă pusă clientului.</strong>"
      zh: "客人这次不想给？没关系：这一单没有支持金，你依然0佣金。银行卡支付手续费就是任何线上收款都有的标准费用——<strong>永远不从你的菜品里抽成，也永远不会额外转嫁给客人。</strong>"
      ja: "今回は応援しないお客様がいたら？それでOK：その注文に応援金はつかず、あなたの手数料はやはり0。カード決済手数料は、あらゆるオンライン決済に共通の標準的なものだけ — <strong>料理への割合課金でも、お客様への上乗せ請求でも、決してありません。</strong>"
      th: "ถ้าครั้งนี้ลูกค้าไม่สมทบล่ะ? ไม่เป็นไร: ออร์เดอร์นั้นไม่มีเงินสมทบ และคุณก็ยังจ่ายค่าคอมมิชชั่น 0 เหมือนเดิม ค่าธรรมเนียมบัตรเป็นค่าธรรมเนียมมาตรฐานของการรับชำระเงินออนไลน์ทั่วไป — <strong>ไม่มีวันเป็นเปอร์เซ็นต์จากอาหารของคุณ และไม่มีวันเป็นค่าบวกเพิ่มที่ผลักให้ลูกค้า</strong>"
      hi: "कोई ग्राहक इस बार योगदान नहीं देता? कोई बात नहीं: उस ऑर्डर पर कोई योगदान नहीं, और आपके लिए फिर भी 0 कमीशन। कार्ड-भुगतान की फ़ीस वही मानक फ़ीस है जो हर ऑनलाइन भुगतान पर लगती है — <strong>कभी आपके पकवानों पर प्रतिशत नहीं, कभी ग्राहक पर थोपा गया सरचार्ज नहीं।</strong>"
      ta: "இந்த முறை வாடிக்கையாளர் பங்களிக்கவில்லையா? பரவாயில்லை: அந்த ஆர்டரில் பங்களிப்பு இல்லை, உங்களுக்கு எப்போதும் போல 0 கமிஷன். கார்டு பண வசூலுக்கான கட்டணங்கள் எந்த ஆன்லைன் வசூலுக்கும் உள்ள நிலையான வங்கிக் கட்டணங்கள்தான் — <strong>உங்கள் உணவுகளில் சதவீதம் இல்லை, வாடிக்கையாளர் மீது கூடுதல் சுமை இல்லை.</strong>"
      ar: "زبون لم يساهم هذه المرة؟ لا بأس: لا مساهمة على هذا الطلب، وتبقى العمولة عليك 0. رسوم الدفع بالبطاقة هي الرسوم القياسية لأي تحصيل عبر الإنترنت — <strong>وليست أبدًا نسبة من أطباقك، ولا رسمًا إضافيًا يُحمَّل على الزبون.</strong>"
      ar-lb: "زبون ما ساهم هالمرّة؟ عادي: ما في مساهمة على هالطلب، وبتضلّ 0 عمولة عليك. رسوم الدفع بالبطاقة هيّي الرسوم العادية لأي دفع أونلاين — <strong>عمرها ما بتكون نسبة على أكلك، ولا زيادة عالزبون.</strong>"
      he: "לקוח לא תרם הפעם? זה בסדר: אין תרומה על ההזמנה הזאת, ועדיין 0 עמלה בשבילך. עמלות הסליקה בכרטיס הן העמלות הסטנדרטיות של כל תשלום אונליין — <strong>אף פעם לא אחוז מהמנות שלך, אף פעם לא תוספת שמגולגלת על הלקוח.</strong>"
  finance.title:
    messages:
      fr: "« 0 commission, alors vous vivez de quoi ? »"
      en: "“0% commission — so what do you live on?”"
      es: "«¿0 comisión? ¿Y entonces de qué vivís?»"
      it: "«0 commissioni: e voi di cosa vivete?»"
      pt: "«0 comissão? Então vivem de quê?»"
      de: "„0 % Provision — und wovon lebt ihr dann?“"
      tr: "« %0 komisyon — peki siz neyle geçiniyorsunuz? »"
      el: "«0 προμήθεια — κι εσείς από τι ζείτε;»"
      ro: "„0 comision — și atunci voi din ce trăiți?”"
      zh: "「0佣金，那你们靠什么活？」"
      ja: "「手数料0%？じゃあ、何で食べているの？」"
      th: "« 0 คอมมิชชั่น แล้วพวกคุณอยู่ได้ด้วยอะไร? »"
      hi: "« 0 कमीशन — तो आप चलते किससे हैं? »"
      ta: "« 0 கமிஷன் என்றால், நீங்கள் எதில் வாழ்கிறீர்கள்? »"
      ar: "«عمولة 0%، إذن ممّ تعيشون؟»"
      ar-lb: "« 0 عمولة؟ طيّب عايشين من شو؟ »"
      he: "״0 עמלה — אז ממה אתם חיים?״"

