  hero.langs:
    messages:
      fr: "Cette page parle 17 langues — et le produit fera pareil : Captain.Food s'adressera à tes clients dans leur langue."
      en: "This page speaks 17 languages — and the product will too: Captain.Food will talk to your customers in their own language."
      es: "Esta página habla 17 idiomas — y el producto hará lo mismo: Captain.Food se dirigirá a tus clientes en su idioma."
      it: "Questa pagina parla 17 lingue — e il prodotto farà lo stesso: Captain.Food parlerà ai tuoi clienti nella loro lingua."
      pt: "Esta página fala 17 línguas — e o produto fará o mesmo: a Captain.Food falará com os teus clientes na língua deles."
      de: "Diese Seite spricht 17 Sprachen — und das Produkt wird es auch: Captain.Food spricht deine Gäste in ihrer Sprache an."
      tr: "Bu sayfa 17 dil konuşuyor — ürün de öyle olacak: Captain.Food müşterilerinle kendi dillerinde konuşacak."
      el: "Αυτή η σελίδα μιλά 17 γλώσσες — και το προϊόν θα κάνει το ίδιο: το Captain.Food θα μιλά στους πελάτες σου στη γλώσσα τους."
      ro: "Această pagină vorbește 17 limbi — iar produsul va face la fel: Captain.Food le va vorbi clienților tăi pe limba lor."
      zh: "这个页面会说17种语言——产品也将如此：Captain.Food 会用你顾客的语言与他们交流。"
      ja: "このページは17の言語を話します — プロダクトも同じです：Captain.Foodはお客様の言語で語りかけます。"
      th: "หน้านี้พูดได้ 17 ภาษา — และตัวผลิตภัณฑ์ก็จะเป็นเช่นเดียวกัน: Captain.Food จะสื่อสารกับลูกค้าของคุณในภาษาของพวกเขา"
      hi: "यह पेज 17 भाषाएँ बोलता है — और प्रोडक्ट भी ऐसा ही करेगा: Captain.Food आपके ग्राहकों से उनकी भाषा में बात करेगा।"
      ta: "இந்தப் பக்கம் 17 மொழிகள் பேசுகிறது — தயாரிப்பும் அப்படியே இருக்கும்: Captain.Food உங்கள் வாடிக்கையாளர்களிடம் அவர்களின் மொழியிலேயே பேசும்."
      ar: "هذه الصفحة تتحدث 17 لغة — والمنتج سيفعل الشيء نفسه: Captain.Food سيخاطب زبائنك بلغتهم."
      ar-lb: "هالصفحة بتحكي 17 لغة — والمنتج رح يعمل متلها: Captain.Food رح يحكي مع زبايتك بلغتهن."
      he: "הדף הזה מדבר 17 שפות — וכך גם המוצר: Captain.Food ידבר עם הלקוחות שלך בשפה שלהם."
  hero.note:
    messages:
      fr: "Une plateforme de commande locale à but non lucratif, portée par une association — construite pour ne <strong>jamais</strong> pouvoir se transformer en péage. Pour les indépendants de Tours. On démarre : rien n'est encore construit, c'est maintenant qu'on l'écrit ensemble."
      en: "A local, non-profit ordering platform carried by an association — built so it can <strong>never</strong> turn into a tollbooth. For the independents of Tours. We're just starting out: nothing is built yet, and it's right now that we write it together."
      es: "Una plataforma de pedidos local y sin ánimo de lucro, impulsada por una asociación — construida para no poder convertirse <strong>jamás</strong> en un peaje. Para los independientes de Tours. Estamos empezando: aún no hay nada construido, y es ahora cuando lo escribimos juntos."
      it: "Una piattaforma di ordini locale e no profit, portata avanti da un'associazione — costruita per non potersi <strong>mai</strong> trasformare in un casello. Per gli indipendenti di Tours. Stiamo partendo: non c'è ancora niente di costruito, è adesso che lo scriviamo insieme."
      pt: "Uma plataforma de encomendas local e sem fins lucrativos, criada por uma associação — construída para <strong>nunca</strong> se poder transformar numa portagem. Para os independentes de Tours. Estamos a começar: ainda nada está construído, é agora que o escrevemos juntos."
      de: "Eine lokale Bestellplattform ohne Gewinnzweck, getragen von einem Verein — so gebaut, dass sie <strong>niemals</strong> zur Mautstelle werden kann. Für die Unabhängigen in Tours. Wir fangen gerade erst an: Noch ist nichts gebaut — genau jetzt schreiben wir es gemeinsam."
      tr: "Bir dernek tarafından yürütülen, kâr amacı gütmeyen yerel bir sipariş platformu — <strong>asla</strong> bir gişeye dönüşemesin diye kuruluyor. Tours'un bağımsızları için. Daha yeni başlıyoruz: henüz hiçbir şey inşa edilmedi, hikâyeyi tam şimdi birlikte yazıyoruz."
      el: "Μια τοπική, μη κερδοσκοπική πλατφόρμα παραγγελιών, στα χέρια ενός σωματείου — φτιαγμένη ώστε να μην μπορέσει <strong>ποτέ</strong> να γίνει διόδια. Για τους ανεξάρτητους της Tours. Μόλις ξεκινάμε: τίποτα δεν έχει χτιστεί ακόμα — τώρα το γράφουμε, μαζί."
      ro: "O platformă locală de comenzi, non-profit, purtată de o asociație — construită ca să nu se poată transforma <strong>niciodată</strong> într-o barieră cu taxă. Pentru independenții din Tours. Abia începem: nimic nu e încă construit, chiar acum o scriem împreună."
      zh: "这是一个由协会发起的本地非营利点餐平台——从根上设计成<strong>永远</strong>不可能变成收费站。为 Tours 的独立餐饮人而生。我们才刚起步：一切尚未建成，正因如此，现在正是和你一起动笔的时候。"
      ja: "非営利団体が運営する、地域密着のオンライン注文プラットフォーム。<strong>決して</strong>「通行料所」に変われない仕組みで作られています。Toursの独立系店舗のために。まだ始まったばかり：何も完成していない今こそ、一緒に描くときです。"
      th: "แพลตฟอร์มสั่งอาหารท้องถิ่นไม่แสวงหากำไร ดำเนินการโดยสมาคม — ออกแบบมาให้<strong>ไม่มีวัน</strong>กลายร่างเป็นด่านเก็บค่าผ่านทางได้ เพื่อผู้ประกอบการอิสระในเมือง Tours เราเพิ่งเริ่มต้น: ยังไม่มีอะไรถูกสร้างขึ้น และตอนนี้แหละคือเวลาที่เราจะเขียนมันไปด้วยกัน"
      hi: "एक स्थानीय, गैर-लाभकारी ऑर्डरिंग प्लेटफ़ॉर्म, जिसे एक असोसिएशन चलाती है — इस तरह गढ़ा गया कि यह <strong>कभी</strong> टोल-नाका न बन सके। Tours के स्वतंत्र कारोबारियों के लिए। हम अभी शुरुआत कर रहे हैं: अभी कुछ भी बना नहीं है — यही वह घड़ी है जब हम इसे मिलकर लिखेंगे।"
      ta: "இலாப நோக்கமற்ற, ஒரு அமைப்பால் நடத்தப்படும் உள்ளூர் ஆர்டர் தளம் — ஒருபோதும் சுங்கச்சாவடியாக மாற <strong>முடியாதபடி</strong> கட்டமைக்கப்படுகிறது. Tours-ன் சுயாதீனர்களுக்காக. நாங்கள் இப்போதுதான் தொடங்குகிறோம்: இன்னும் எதுவும் கட்டப்படவில்லை — இப்போதுதான் அதை ஒன்றாக எழுதுகிறோம்."
      ar: "منصة طلب محلية غير ربحية تحملها جمعية — بُنيت بحيث لا تستطيع <strong>أبدًا</strong> أن تتحول إلى بوابة رسوم. للمستقلين في Tours. نحن في البداية: لم يُبنَ شيء بعد، والآن بالضبط نكتبه معًا."
      ar-lb: "منصّة طلبات محلّية غير ربحية، حاملتها جمعية — مبنية بطريقة ما فيها <strong>أبداً</strong> تنقلب حاجز جباية. للمستقلّين بـTours. لسّا عم نبلّش: بعد ما في شي مبني، وهلّق الوقت لنكتبه سوا."
      he: "פלטפורמת הזמנות מקומית ללא מטרות רווח, בהובלת עמותה — בנויה כך שהיא <strong>לעולם</strong> לא תוכל להפוך למחסום גבייה. לעצמאים של Tours. אנחנו רק בתחילת הדרך: עוד לא בנינו כלום, ועכשיו זה הרגע לכתוב את זה יחד."
  hero.portrait_alt:
    messages:
      fr: "Le Capitaine Food, chef à la toque et à la grande moustache blanche, brandissant une fourchette dorée"
      en: "Captain Food, a chef with a tall hat and a big white moustache, brandishing a golden fork"
      es: "El Capitán Food, chef con gorro y gran bigote blanco, blandiendo un tenedor dorado"
      it: "Il Capitan Food, chef con toque e grandi baffi bianchi, che brandisce una forchetta dorata"
      pt: "O Capitão Food, chef de barrete e grande bigode branco, a brandir um garfo dourado"
      de: "Captain Food, Koch mit Kochmütze und großem weißen Schnurrbart, der eine goldene Gabel schwingt"
      tr: "Kaptan Food: kocaman beyaz bıyıklı, aşçı şapkalı, altın çatalını havaya kaldırmış bir şef"
      el: "Ο Captain Food, σεφ με σκούφο και μεγάλο λευκό μουστάκι, υψώνει ένα χρυσό πιρούνι"
      ro: "Căpitanul Food, bucătar cu bonetă și mustață mare albă, ridicând o furculiță aurie"
      zh: "Food 船长——戴着厨师帽、留着白色大胡子的主厨，高举一把金色餐叉"
      ja: "コック帽と白い大きな口ひげのキャプテン・フード。金色のフォークを高く掲げている"
      th: "กัปตัน Food เชฟสวมหมวกทรงสูง หนวดขาวเฟิ้ม ชูส้อมทองคำ"
      hi: "कैप्टन फ़ूड — शेफ़ की टोपी और बड़ी सफ़ेद मूँछों वाला शेफ़, सुनहरा काँटा थामे"
      ta: "தொப்பியும் பெரிய வெள்ளை மீசையும் கொண்ட சமையல்காரர் கேப்டன் ஃபுட், தங்க முள்கரண்டியை உயர்த்தியபடி"
      ar: "الكابتن فود، طاهٍ بقبعة الشيف وشارب أبيض كبير، يرفع شوكة ذهبية"
      ar-lb: "الكابتن فود، شيف لابس طاقية الطبخ وبشواربه البيض الكبار، رافع شوكة دهبية"
      he: "קפטן פוד, שף עם כובע שף ושפם לבן גדול, מניף מזלג זהוב"
  hero.quote.1:
    messages:
      fr: "« Tes plats, tes prix, tes clients. »"
      en: "“Your dishes, your prices, your customers.”"
      es: "«Tus platos, tus precios, tus clientes.»"
      it: "«I tuoi piatti, i tuoi prezzi, i tuoi clienti.»"
      pt: "«Os teus pratos, os teus preços, os teus clientes.»"
      de: "„Deine Gerichte, deine Preise, deine Gäste.“"
      tr: "« Senin yemeklerin, senin fiyatların, senin müşterilerin. »"
      el: "«Τα πιάτα σου, οι τιμές σου, οι πελάτες σου.»"
      ro: "„Preparatele tale, prețurile tale, clienții tăi.”"
      zh: "「你的菜，你的价，你的客人。」"
      ja: "「あなたの料理、あなたの価格、あなたのお客様。」"
      th: "« อาหารของคุณ ราคาของคุณ ลูกค้าของคุณ »"
      hi: "« आपके पकवान, आपके दाम, आपके ग्राहक। »"
      ta: "« உங்கள் உணவுகள், உங்கள் விலைகள், உங்கள் வாடிக்கையாளர்கள். »"
      ar: "«أطباقك، أسعارك، زبائنك.»"
      ar-lb: "« أكلك، أسعارك، زبايناتك. »"
      he: "״המנות שלך, המחירים שלך, הלקוחות שלך.״"
  hero.quote.2:
    messages:
      fr: "« 0 % de commission. Toujours. »"
      en: "“0% commission. Always.”"
      es: "«0 % de comisión. Siempre.»"
      it: "«0% di commissioni. Sempre.»"
      pt: "«0% de comissão. Sempre.»"
      de: "„0 % Provision. Immer.“"
      tr: "« %0 komisyon. Her zaman. »"
      el: "«0 % προμήθεια. Πάντα.»"
      ro: "„0% comision. Mereu.”"
      zh: "「0%佣金。永远。」"
      ja: "「手数料0%。いつでも。」"
      th: "« ค่าคอมมิชชั่น 0 % ตลอดไป »"
      hi: "« 0% कमीशन। हमेशा। »"
      ta: "« 0 % கமிஷன். எப்போதும். »"
      ar: "«عمولة 0%. دائمًا.»"
      ar-lb: "« 0% عمولة. دايماً. »"
      he: "״0% עמלה. תמיד.״"
  hero.quote.3:
    messages:
      fr: "« Ici, c'est toi le capitaine. »"
      en: "“Here, you're the captain.”"
      es: "«Aquí, el capitán eres tú.»"
      it: "«Qui il capitano sei tu.»"
      pt: "«Aqui, o capitão és tu.»"
      de: "„Hier bist du der Kapitän.“"
      tr: "« Burada kaptan sensin. »"
      el: "«Εδώ, ο καπετάνιος είσαι εσύ.»"
      ro: "„Aici, tu ești căpitanul.”"
      zh: "「在这里，船长是你。」"
      ja: "「ここでは、船長はあなただ。」"
      th: "« ที่นี่ คุณคือกัปตัน »"
      hi: "« यहाँ कप्तान आप हैं। »"
      ta: "« இங்கே கேப்டன் நீங்கள்தான். »"
      ar: "«هنا، أنت القبطان.»"
      ar-lb: "« هون، إنت الكابتن. »"
      he: "״כאן אתה הקפטן.״"
  hero.quote.4:
    messages:
      fr: "« Reprends la barre de ton affaire. »"
      en: "“Take back the helm of your business.”"
      es: "«Retoma el timón de tu negocio.»"
      it: "«Riprendi il timone della tua attività.»"
      pt: "«Retoma o leme do teu negócio.»"
      de: "„Übernimm wieder das Ruder deines Ladens.“"
      tr: "« İşinin dümenini geri al. »"
      el: "«Πάρε πίσω το τιμόνι της δουλειάς σου.»"
      ro: "„Ia înapoi cârma afacerii tale.”"
      zh: "「夺回你生意的舵盘。」"
      ja: "「商売の舵を取り戻せ。」"
      th: "« กลับมาถือหางเสือกิจการของคุณเอง »"
      hi: "« अपने कारोबार की पतवार वापस थामिए। »"
      ta: "« உங்கள் தொழிலின் சுக்கானை மீண்டும் கையில் எடுங்கள். »"
      ar: "«استعد دفة مشروعك.»"
      ar-lb: "« رجاع مسك دفّة شغلك. »"
      he: "״קח בחזרה את ההגה של העסק שלך.״"
  hero.quote.5:
    messages:
      fr: "« Ta cuisine mérite mieux qu'un péage. »"
      en: "“Your kitchen deserves better than a tollbooth.”"
      es: "«Tu cocina merece algo mejor que un peaje.»"
      it: "«La tua cucina merita di meglio di un casello.»"
      pt: "«A tua cozinha merece mais do que uma portagem.»"
      de: "„Deine Küche verdient mehr als eine Mautstelle.“"
      tr: "« Mutfağın bir gişeden fazlasını hak ediyor. »"
      el: "«Η κουζίνα σου αξίζει κάτι καλύτερο από διόδια.»"
      ro: "„Bucătăria ta merită mai mult decât o barieră cu taxă.”"
      zh: "「你的厨房，配得上比收费站更好的未来。」"
      ja: "「あなたの料理は、通行料より上等だ。」"
      th: "« ครัวของคุณมีค่าเกินกว่าจะต้องจ่ายค่าผ่านทาง »"
      hi: "« आपकी रसोई टोल-नाके से बेहतर की हक़दार है। »"
      ta: "« உங்கள் சமையலுக்கு ஒரு சுங்கச்சாவடியை விட மேலானது தேவை. »"
      ar: "«مطبخك يستحق أفضل من بوابة رسوم.»"
      ar-lb: "« مطبخك بيستاهل أحسن من حاجز جباية. »"
      he: "״המטבח שלך שווה יותר ממחסום גבייה.״"
  hero.quote.6:
    messages:
      fr: "« Le client est à toi — qu'il le reste. »"
      en: "“The customer is yours — keep it that way.”"
      es: "«El cliente es tuyo — que lo siga siendo.»"
      it: "«Il cliente è tuo — e deve restarlo.»"
      pt: "«O cliente é teu — e assim deve ficar.»"
      de: "„Der Gast gehört dir — das soll so bleiben.“"
      tr: "« Müşteri senin — senin kalsın. »"
      el: "«Ο πελάτης είναι δικός σου — ας μείνει έτσι.»"
      ro: "„Clientul e al tău — să rămână așa.”"
      zh: "「客人是你的——就该一直是你的。」"
      ja: "「お客様はあなたのもの — ずっとそのままに。」"
      th: "« ลูกค้าเป็นของคุณ — และควรเป็นแบบนั้นต่อไป »"
      hi: "« ग्राहक आपका है — आपका ही रहे। »"
      ta: "« வாடிக்கையாளர் உங்களுடையவர் — அப்படியே இருக்கட்டும். »"
      ar: "«الزبون زبونك — فليبقَ كذلك.»"
      ar-lb: "« الزبون إلك — خلّيه يضلّ إلك. »"
      he: "״הלקוח שלך — שיישאר שלך.״"
  hero.quote.7:
    messages:
      fr: "« On rame pour les indépendants, pas contre eux. »"
      en: "“We row for the independents, not against them.”"
      es: "«Remamos por los independientes, no contra ellos.»"
      it: "«Remiamo per gli indipendenti, non contro di loro.»"
      pt: "«Remamos pelos independentes, não contra eles.»"
      de: "„Wir rudern für die Unabhängigen, nicht gegen sie.“"
      tr: "« Bağımsızlar için kürek çekiyoruz, onlara karşı değil. »"
      el: "«Τραβάμε κουπί για τους ανεξάρτητους, όχι εναντίον τους.»"
      ro: "„Vâslim pentru independenți, nu împotriva lor.”"
      zh: "「我们为独立小店划桨，不跟他们抢食。」"
      ja: "「私たちは独立系のために漕ぐ。彼らに逆らってではなく。」"
      th: "« เราออกแรงพายเพื่อร้านอิสระ ไม่ใช่สู้กับพวกเขา »"
      hi: "« हम स्वतंत्र कारोबारियों के लिए पतवार खींचते हैं, उनके ख़िलाफ़ नहीं। »"
      ta: "« நாங்கள் துடுப்பு வலிப்பது சுயாதீனர்களுக்காக, அவர்களுக்கு எதிராக அல்ல. »"
      ar: "«نجدّف مع المستقلين، لا ضدهم.»"
      ar-lb: "« عم نجدّف مع المستقلّين، مش ضدّهن. »"
      he: "״אנחנו חותרים בשביל העצמאים, לא נגדם.״"
  hero.quote.8:
    messages:
      fr: "« Garde ta marge. On s'occupe du reste. »"
      en: "“Keep your margin. We'll handle the rest.”"
      es: "«Quédate tu margen. Del resto nos ocupamos nosotros.»"
      it: "«Tieniti il margine. Al resto pensiamo noi.»"
      pt: "«Guarda a tua margem. Nós tratamos do resto.»"
      de: "„Behalt deine Marge. Wir kümmern uns um den Rest.“"
      tr: "« Marjın sende kalsın. Gerisini biz hallederiz. »"
      el: "«Κράτα το περιθώριό σου. Τα υπόλοιπα, σ' εμάς.»"
      ro: "„Păstrează-ți marja. De rest ne ocupăm noi.”"
      zh: "「守住你的利润。剩下的交给我们。」"
      ja: "「利益はあなたの手に。あとは任せて。」"
      th: "« เก็บกำไรของคุณไว้ ที่เหลือเราจัดการเอง »"
      hi: "« अपना मार्जिन रखिए। बाक़ी हम सँभालते हैं। »"
      ta: "« உங்கள் லாபத்தை வைத்துக்கொள்ளுங்கள். மீதியை நாங்கள் பார்த்துக்கொள்கிறோம். »"
      ar: "«احتفظ بهامشك. ونحن نتكفل بالباقي.»"
      ar-lb: "« خلّي ربحك إلك. الباقي علينا. »"
      he: "״שמור על הרווח שלך. אנחנו נדאג לשאר.״"
  hero.quote.9:
    messages:
      fr: "« Cuisine. Encaisse. Recommence. »"
      en: "“Cook. Get paid. Repeat.”"
      es: "«Cocina. Cobra. Repite.»"
      it: "«Cucina. Incassa. Ricomincia.»"
      pt: "«Cozinha. Recebe. Repete.»"
      de: "„Kochen. Kassieren. Von vorn.“"
      tr: "« Pişir. Kazan. Tekrarla. »"
      el: "«Μαγείρεψε. Εισέπραξε. Ξανά απ' την αρχή.»"
      ro: "„Gătește. Încasează. Repetă.”"
      zh: "「下厨。收钱。再来一单。」"
      ja: "「作る。受け取る。また作る。」"
      th: "« ทำอาหาร เก็บเงิน แล้วทำต่อไป »"
      hi: "« पकाइए। कमाइए। फिर दोहराइए। »"
      ta: "« சமையுங்கள். வசூலியுங்கள். மீண்டும் தொடருங்கள். »"
      ar: "«اطبخ. حصّل. وكرّر.»"
      ar-lb: "« اطبخ. اقبض. عيد من أوّل. »"
      he: "״לבשל. לגבות. לחזור על זה.״"
  hero.reassure:
    messages:
      fr: "Sans engagement · 0 commission sur tes plats · tu gardes tes clients — et tes plateformes actuelles."
      en: "No commitment · 0% commission on your dishes · you keep your customers — and your current platforms."
      es: "Sin permanencia · 0 comisión sobre tus platos · te quedas con tus clientes — y con tus plataformas actuales."
      it: "Senza vincoli · 0 commissioni sui tuoi piatti · i tuoi clienti restano tuoi — e tieni le tue piattaforme attuali."
      pt: "Sem compromisso · 0 comissão sobre os teus pratos · ficas com os teus clientes — e com as tuas plataformas atuais."
      de: "Unverbindlich · 0 % Provision auf deine Gerichte · du behältst deine Gäste — und deine bisherigen Plattformen."
      tr: "Taahhüt yok · yemeklerinde 0 komisyon · müşterilerin de mevcut platformların da sende kalır."
