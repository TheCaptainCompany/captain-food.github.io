      de: "die an ihrem Viertel hängen, an ihren Stammgästen, an ihrem Handwerk."
      tr: "mahallesine, müdavimlerine, mesleğine bağlı olanlar."
      el: "που είναι δεμένοι με τη γειτονιά τους, τους θαμώνες τους, την τέχνη τους."
      ro: "legați de cartierul lor, de clienții fideli, de meseria lor."
      zh: "珍视自己的街区、自己的熟客、自己的手艺。"
      ja: "自分の街と、常連さんと、自分の仕事に愛着のある方。"
      th: "ที่ผูกพันกับย่านของตัวเอง ลูกค้าประจำ และอาชีพที่รัก"
      hi: "जो अपने मोहल्ले, अपने नियमित ग्राहकों और अपने हुनर से जुड़े हैं।"
      ta: "தங்கள் பகுதி, வழக்கமான வாடிக்கையாளர்கள், தங்கள் தொழில் — இவற்றின் மீது பற்று கொண்டவர்கள்."
      ar: "المتمسكون بحيّهم، وبزبائنهم الأوفياء، وبمهنتهم."
      ar-lb: "المتعلّقين بحيّهن، بزبايناتهن الدايمين، وبصنعتهن."
      he: "שקשורים לשכונה שלהם, ללקוחות הקבועים, למקצוע שלהם."
