  tours.p1:
    messages:
      fr: "<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> démarre ici, à Tours, avec un premier groupe de restaurateurs. Pas partout, pas tout de suite : un territoire, bien fait, entre indépendants qui se connaissent."
      en: "<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> starts here, in Tours, with a first group of restaurateurs. Not everywhere, not all at once: one territory, done right, among independents who know each other."
      es: "<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> zarpa aquí, en Tours, con un primer grupo de hosteleros. Ni en todas partes ni de golpe: un territorio, bien hecho, entre independientes que se conocen."
      it: "<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> parte da qui, da Tours, con un primo gruppo di ristoratori. Non ovunque, non subito: un territorio, fatto bene, tra indipendenti che si conoscono."
      pt: "A <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> arranca aqui, em Tours, com um primeiro grupo de restauradores. Não em todo o lado, não já: um território, bem feito, entre independentes que se conhecem."
      ar: "<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> ينطلق من هنا، من مدينة Tours (تور)، مع مجموعة أولى من أصحاب المطاعم. ليس في كل مكان، وليس دفعة واحدة: منطقة واحدة، نتقنها جيدًا، بين مستقلين يعرفون بعضهم."
      he: "<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> יוצא לדרך כאן, ב-Tours (טור) שבצרפת, עם קבוצה ראשונה של מסעדנים. לא בכל מקום, לא בבת אחת: טריטוריה אחת, שנעשית כמו שצריך, בין עצמאים שמכירים זה את זה."
  tours.p2:
    messages:
      fr: "On construit la plateforme avec les premiers restaurants qui embarquent — leurs retours façonnent l'outil. Rejoindre maintenant, c'est peser sur ce que <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> deviendra."
      en: "We're building the platform with the first restaurants to come aboard — their feedback shapes the tool. Joining now means weighing in on what <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> will become."
      es: "Construimos la plataforma con los primeros restaurantes que suben a bordo — sus opiniones dan forma a la herramienta. Unirte ahora es influir en lo que <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> llegará a ser."
      it: "Costruiamo la piattaforma con i primi ristoranti che salgono a bordo — i loro riscontri plasmano lo strumento. Unirti adesso significa pesare su ciò che <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> diventerà."
      pt: "Construímos a plataforma com os primeiros restaurantes que embarcam — as suas opiniões moldam a ferramenta. Juntares-te agora é teres peso naquilo em que a <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> se vai tornar."
      ar: "نبني المنصة مع أوائل المطاعم التي تصعد على المتن — ملاحظاتهم تصوغ الأداة. أن تنضم الآن يعني أن يكون لك وزن في ما سيصبح عليه <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>."
      he: "אנחנו בונים את הפלטפורמה עם המסעדות הראשונות שעולות לסיפון — הפידבק שלהן מעצב את הכלי. להצטרף עכשיו זה להשפיע על מה ש-<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> יהפוך להיות."
