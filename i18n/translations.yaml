  solution.dish_caption:
    messages:
      fr: "Qu'est-ce qu'on met sur la table ?"
      en: "So, what's on the table?"
      es: "¿Qué ponemos sobre la mesa?"
      it: "Cosa mettiamo in tavola?"
      pt: "O que é que pomos na mesa?"
      de: "Was kommt bei uns auf den Tisch?"
      tr: "Masaya ne koyuyoruz?"
      el: "Τι σερβίρουμε στο τραπέζι;"
      ro: "Ce punem pe masă?"
      zh: "我们端上桌的是什么？"
      ja: "テーブルに並ぶのは？"
      th: "เราเสิร์ฟอะไรให้บ้าง?"
      hi: "हम मेज़ पर क्या परोस रहे हैं?"
      ta: "மேசையில் நாங்கள் என்ன வைக்கிறோம்?"
      ar: "ماذا نضع على الطاولة؟"
      ar-lb: "شو عم نحطّ عالطاولة؟"
      he: "אז מה שמים על השולחן?"
  solution.eyebrow:
    messages:
      fr: "Ton pavillon, tes règles"
      en: "Your flag, your rules"
      es: "Tu pabellón, tus reglas"
      it: "La tua bandiera, le tue regole"
      pt: "O teu pavilhão, as tuas regras"
      de: "Deine Flagge, deine Regeln"
      tr: "Senin bayrağın, senin kuralların"
      el: "Η σημαία σου, οι κανόνες σου"
      ro: "Pavilionul tău, regulile tale"
      zh: "你的旗帜，你的规矩"
      ja: "あなたの旗、あなたのルール"
      th: "ธงของคุณ กติกาของคุณ"
      hi: "आपका परचम, आपके नियम"
      ta: "உங்கள் கொடி, உங்கள் விதிகள்"
      ar: "رايتك أنت، وقواعدك أنت"
      ar-lb: "بيرقك إنت، وقوانينك إنت"
      he: "הדגל שלך, החוקים שלך"
  solution.img_alt:
    messages:
      fr: "Le Capitaine Food présente une assiette lumineuse — steak, salade, tomates : la valeur que tu gardes"
      en: "Captain Food presents a glowing plate — steak, salad, tomatoes: the value you keep"
      es: "El Capitán Food presenta un plato luminoso — bistec, ensalada, tomates: el valor que te quedas"
      it: "Il Capitan Food presenta un piatto luminoso — bistecca, insalata, pomodori: il valore che resta a te"
      pt: "O Capitão Food apresenta um prato luminoso — bife, salada, tomate: o valor que guardas para ti"
      de: "Captain Food präsentiert einen leuchtenden Teller — Steak, Salat, Tomaten: der Wert, der bei dir bleibt"
      tr: "Kaptan Food ışıl ışıl bir tabak sunuyor — biftek, salata, domates: sende kalan değer"
      el: "Ο Captain Food παρουσιάζει ένα λαμπερό πιάτο — μπριζόλα, σαλάτα, ντομάτες: η αξία που κρατάς"
      ro: "Căpitanul Food prezintă o farfurie strălucitoare — friptură, salată, roșii: valoarea pe care o păstrezi"
      zh: "Food 船长端出一盘发光的美食——牛排、沙拉、番茄：这是你留住的价值"
      ja: "キャプテン・フードが輝く一皿 — ステーキ、サラダ、トマト — を差し出す。あなたの手に残る価値"
      th: "กัปตัน Food ยกจานอาหารเปล่งประกาย — สเต๊ก สลัด มะเขือเทศ: คุณค่าที่คุณเก็บไว้ได้"
      hi: "कैप्टन फ़ूड एक चमकती थाली पेश करता है — स्टेक, सलाद, टमाटर: वह मूल्य जो आपके पास रहता है"
      ta: "கேப்டன் ஃபுட் ஒளிரும் தட்டு ஒன்றை முன்வைக்கிறார் — ஸ்டேக், சாலட், தக்காளி: நீங்கள் தக்கவைக்கும் மதிப்பு"
      ar: "الكابتن فود يقدّم طبقًا مضيئًا — ستيك وسلطة وطماطم: القيمة التي تحتفظ بها"
      ar-lb: "الكابتن فود عم يقدّم صحن مضوّي — ستيك وسلطة وبندورة: القيمة يلّي بتضلّ إلك"
      he: "קפטן פוד מגיש צלחת זוהרת — סטייק, סלט, עגבניות: הערך שנשאר אצלך"
  solution.intro:
    messages:
      fr: "<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> est une plateforme de commande en ligne locale qui te redonne le contrôle. En ligne et à table, sous ton nom."
      en: "<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> is a local online-ordering platform that puts you back in control. Online and at the table, under your name."
      es: "<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> es una plataforma local de pedidos online que te devuelve el control. Online y en mesa, con tu nombre."
      it: "<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> è una piattaforma di ordini online locale che ti ridà il controllo. Online e al tavolo, a tuo nome."
      pt: "A <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> é uma plataforma local de encomendas online que te devolve o controlo. Online e à mesa, com o teu nome."
      de: "<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> ist eine lokale Online-Bestellplattform, die dir die Kontrolle zurückgibt. Online und am Tisch, unter deinem Namen."
      tr: "<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>, kontrolü sana geri veren yerel bir online sipariş platformu. Online'da da masada da, senin adınla."
      el: "Το <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> είναι μια τοπική πλατφόρμα online παραγγελιών που σου ξαναδίνει τον έλεγχο. Online και στο τραπέζι, με το όνομά σου."
      ro: "<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> este o platformă locală de comenzi online care îți dă înapoi controlul. Online și la masă, pe numele tău."
      zh: "<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> 是一个本地在线点餐平台，把掌控权还给你。线上、堂食，都挂你的名字。"
      ja: "<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>は、あなたに主導権を返す地域密着のオンライン注文プラットフォーム。オンラインでもテーブルでも、あなたの名前で。"
      th: "<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> คือแพลตฟอร์มสั่งอาหารออนไลน์ท้องถิ่นที่คืนอำนาจการควบคุมให้คุณ ทั้งออนไลน์และที่โต๊ะอาหาร ในชื่อร้านของคุณเอง"
      hi: "<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> एक स्थानीय ऑनलाइन ऑर्डरिंग प्लेटफ़ॉर्म है जो कमान आपके हाथ में लौटाता है। ऑनलाइन और टेबल पर — आपके नाम के तले।"
      ta: "<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> என்பது உங்களுக்குக் கட்டுப்பாட்டைத் திரும்பத் தரும் உள்ளூர் ஆன்லைன் ஆர்டர் தளம். ஆன்லைனிலும் டேபிளிலும், உங்கள் பெயரில்."
      ar: "<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> منصة طلب أونلاين محلية تعيد إليك زمام التحكم. على الإنترنت وعلى الطاولة، وباسمك."
      ar-lb: "<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> منصّة طلب أونلاين محلّية بترجّعلك مسك الدفّة. أونلاين وعالطاولة، وباسمك."
      he: "<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> היא פלטפורמת הזמנות אונליין מקומית שמחזירה לך את השליטה. אונליין וליד השולחן, על שמך."
