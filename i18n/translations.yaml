  calc.prefill:
    params:
      ca: "formatted monthly revenue"
      rate: "commission rate in percent"
      perMonth: "formatted monthly commission"
      perYear: "formatted yearly commission"
    messages:
      fr: "Via le calculateur : CA {ca}/mois sur la plateforme, commission ~{rate} % = {perMonth}/mois ({perYear}/an)."
      en: "Via the calculator: {ca}/month in revenue on the platform, ~{rate}% commission = {perMonth}/month ({perYear}/year)."
      es: "Vía la calculadora: facturación de {ca}/mes en la plataforma, comisión ~{rate} % = {perMonth}/mes ({perYear}/año)."
      it: "Dal calcolatore: fatturato {ca}/mese sulla piattaforma, commissione ~{rate}% = {perMonth}/mese ({perYear}/anno)."
      pt: "Via calculadora: faturação de {ca}/mês na plataforma, comissão ~{rate}% = {perMonth}/mês ({perYear}/ano)."
      de: "Via Rechner: Umsatz {ca}/Monat auf der Plattform, Provision ~{rate} % = {perMonth}/Monat ({perYear}/Jahr)."
      tr: "Hesaplayıcıdan: platformdaki aylık ciro {ca}, komisyon ~%{rate} = ayda {perMonth} (yılda {perYear})."
      el: "Μέσω του υπολογιστή: τζίρος {ca}/μήνα στην πλατφόρμα, προμήθεια ~{rate} % = {perMonth}/μήνα ({perYear}/χρόνο)."
      ro: "Din calculator: CA {ca}/lună pe platformă, comision ~{rate}% = {perMonth}/lună ({perYear}/an)."
      zh: "来自计算器：平台月营业额 {ca}，佣金约{rate}% = 每月 {perMonth}（每年 {perYear}）。"
      ja: "計算機より：プラットフォームでの月間売上{ca}、手数料約{rate}% = 月{perMonth}（年{perYear}）。"
      th: "จากเครื่องคำนวณ: ยอดขาย {ca}/เดือน บนแพลตฟอร์ม ค่าคอมมิชชั่น ~{rate} % = {perMonth}/เดือน ({perYear}/ปี)"
      hi: "कैलकुलेटर से: प्लेटफ़ॉर्म पर बिक्री {ca}/माह, कमीशन ~{rate}% = {perMonth}/माह ({perYear}/साल)।"
      ta: "கால்குலேட்டர் வழியாக: தளத்தில் மாத விற்பனை {ca}, கமிஷன் ~{rate} % = மாதம் {perMonth} (வருடம் {perYear})."
      ar: "عبر الحاسبة: مبيعات {ca}/الشهر على المنصة، عمولة ~{rate}% = {perMonth}/الشهر ({perYear}/السنة)."
      ar-lb: "من الحاسبة: مبيعات {ca}/شهر عالمنصّة، عمولة ~{rate}% = {perMonth}/شهر ({perYear}/سنة)."
      he: "דרך המחשבון: מחזור {ca}/חודש בפלטפורמה, עמלה של כ-{rate}% = {perMonth}/חודש ({perYear}/שנה)."
