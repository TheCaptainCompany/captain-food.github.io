  channel.qr_body:
    messages:
      fr: "Le client scanne, commande depuis sa place. La commande part en cuisine, et <strong>le paiement reste dans ta caisse habituelle</strong> — on ne touche pas à ton encaissement. C'est inclus, sans commission."
      en: "Customers scan and order from their seat. The order goes straight to the kitchen, and <strong>the payment stays in your usual till</strong> — we don't touch your checkout. Included, commission-free."
      es: "El cliente escanea y pide desde su sitio. El pedido sale hacia cocina, y <strong>el pago se queda en tu caja de siempre</strong> — no tocamos tu cobro. Va incluido, sin comisión."
      it: "Il cliente scansiona e ordina dal suo posto. La comanda parte in cucina, e <strong>il pagamento resta nella tua cassa abituale</strong> — il tuo incasso non lo tocchiamo. È incluso, senza commissioni."
      pt: "O cliente faz scan e encomenda do seu lugar. A comanda segue para a cozinha, e <strong>o pagamento fica na tua caixa habitual</strong> — não tocamos na tua cobrança. Está incluído, sem comissão."
      de: "Der Gast scannt und bestellt direkt vom Platz aus. Die Bestellung geht in die Küche, und <strong>bezahlt wird wie gewohnt an deiner Kasse</strong> — dein Kassiervorgang bleibt unangetastet. Inklusive, ohne Provision."
      tr: "Müşteri kodu okutur, oturduğu yerden sipariş verir. Sipariş mutfağa düşer ve <strong>ödeme her zamanki kasanda kalır</strong> — tahsilatına karışmayız. Dahildir, komisyonsuz."
      el: "Ο πελάτης σκανάρει και παραγγέλνει από τη θέση του. Η παραγγελία φεύγει για την κουζίνα, και <strong>η πληρωμή μένει στο ταμείο σου, όπως πάντα</strong> — δεν αγγίζουμε την είσπραξή σου. Περιλαμβάνεται, χωρίς προμήθεια."
      ro: "Clientul scanează, comandă de la locul lui. Comanda pleacă în bucătărie, iar <strong>plata rămâne în casa ta obișnuită</strong> — nu ne atingem de încasările tale. E inclus, fără comision."
      zh: "客人扫码，坐在座位上下单。订单直达后厨，<strong>收款照旧走你原来的收银台</strong>——我们不碰你的钱箱。已包含，零佣金。"
      ja: "お客様が席からスキャンして注文。注文はキッチンへ直行し、<strong>支払いはいつものレジのまま</strong> — あなたの会計には手を触れません。手数料なし、料金に込みです。"
      th: "ลูกค้าสแกนแล้วสั่งจากที่นั่งได้เลย ออร์เดอร์วิ่งเข้าครัว และ<strong>เงินยังเข้าเครื่องเก็บเงินของคุณตามปกติ</strong> — เราไม่ยุ่งกับระบบรับเงินของคุณ รวมอยู่ในบริการ ไม่มีค่าคอมมิชชั่น"
      hi: "ग्राहक स्कैन करता है, अपनी सीट से ऑर्डर करता है। ऑर्डर किचन में पहुँचता है, और <strong>भुगतान आपके हमेशा वाले कैश-काउंटर पर ही रहता है</strong> — आपकी वसूली को हम छूते तक नहीं। यह शामिल है, बिना कमीशन।"
      ta: "வாடிக்கையாளர் ஸ்கேன் செய்து, இருக்கையிலிருந்தே ஆர்டர் செய்கிறார். ஆர்டர் சமையலறைக்குச் செல்கிறது, <strong>பணம் உங்கள் வழக்கமான கல்லாவிலேயே</strong> — உங்கள் வசூலில் நாங்கள் கை வைப்பதில்லை. இது சேவையில் அடங்கியது, கமிஷன் இல்லாமல்."
      ar: "الزبون يمسح الرمز ويطلب من مكانه. الطلب ينطلق إلى المطبخ، و<strong>الدفع يبقى في صندوقك المعتاد</strong> — لا نمسّ تحصيلك. مشمول في الخدمة، وبدون عمولة."
      ar-lb: "الزبون بيعمل سكان وبيطلب من محلّه. الطلب بيروح عالمطبخ، و<strong>الدفع بيضلّ بصندوقك العادي</strong> — ما منقرّب على كاشيرك. هيدا ضمن الخدمة، بلا عمولة."
      he: "הלקוח סורק ומזמין מהמקום שלו. ההזמנה יוצאת למטבח, ו<strong>התשלום נשאר בקופה הרגילה שלך</strong> — אנחנו לא נוגעים בסליקה שלך. זה כלול, בלי עמלה."
  channel.qr_title:
    messages:
      fr: "À table, par QR code"
      en: "At the table, via QR code"
      es: "En mesa, por código QR"
      it: "Al tavolo, con QR code"
      pt: "À mesa, por código QR"
      de: "Am Tisch, per QR-Code"
      tr: "Masada, QR kodla"
      el: "Στο τραπέζι, με QR code"
      ro: "La masă, prin cod QR"
      zh: "桌边扫码点餐"
      ja: "テーブルから、QRコードで"
      th: "ที่โต๊ะ ผ่าน QR โค้ด"
      hi: "टेबल पर, QR कोड से"
      ta: "டேபிளில், QR கோடு மூலம்"
      ar: "على الطاولة، برمز QR"
      ar-lb: "عالطاولة، بالـQR كود"
      he: "ליד השולחן, בסריקת QR"

  # ---- channels ----
  channels.intro:
    messages:
      fr: "Ton site à toi : <code>tonresto.captain.food</code> (ou ton propre <code>tonresto.fr</code>). Les commandes arriveront en direct depuis ton site — de trois manières, toutes sans commission sur tes plats. À terme, l'annuaire <strong>captain.food</strong> aidera les clients à découvrir les indépendants du coin (bénéfice collectif à venir, pas un canal actif aujourd'hui)."
      en: "Your own site: <code>yourresto.captain.food</code> (or your own <code>yourresto.fr</code>). Orders will come in direct from your site — in three ways, all commission-free on your dishes. Down the line, the <strong>captain.food</strong> directory will help customers discover the independents nearby (a collective benefit to come, not an active channel today)."
      es: "Tu web propia: <code>turesto.captain.food</code> (o tu propio <code>turesto.fr</code>). Los pedidos te llegarán en directo desde tu web — de tres maneras, todas sin comisión sobre tus platos. Más adelante, el directorio <strong>captain.food</strong> ayudará a los clientes a descubrir a los independientes de la zona (beneficio colectivo por llegar, no un canal activo hoy)."
      it: "Il tuo sito tutto tuo: <code>iltuoristorante.captain.food</code> (o il tuo <code>iltuoristorante.fr</code>). Gli ordini arriveranno direttamente dal tuo sito — in tre modi, tutti senza commissioni sui tuoi piatti. Col tempo, l'elenco <strong>captain.food</strong> aiuterà i clienti a scoprire gli indipendenti della zona (beneficio collettivo in arrivo, non un canale attivo oggi)."
      pt: "O teu site, teu: <code>oteuresto.captain.food</code> (ou o teu próprio <code>oteuresto.fr</code>). As encomendas chegarão em direto a partir do teu site — de três maneiras, todas sem comissão sobre os teus pratos. Mais adiante, o diretório <strong>captain.food</strong> ajudará os clientes a descobrir os independentes da zona (benefício coletivo a chegar, não um canal ativo hoje)."
      de: "Deine eigene Website: <code>deinresto.captain.food</code> (oder deine eigene <code>deinresto.fr</code>). Die Bestellungen kommen direkt über deine Website — auf drei Wegen, alle ohne Provision auf deine Gerichte. Später hilft das Verzeichnis <strong>captain.food</strong> den Gästen, die Unabhängigen der Umgebung zu entdecken (ein gemeinsamer Vorteil in Planung, heute noch kein aktiver Kanal)."
      tr: "Sana ait bir site: <code>restoranin.captain.food</code> (ya da kendi <code>restoranin.fr</code> alan adın). Siparişler doğrudan senin sitenden gelecek — üç şekilde, hepsi yemeklerinde komisyonsuz. Zamanla <strong>captain.food</strong> rehberi, müşterilerin civardaki bağımsızları keşfetmesine yardım edecek (ileride ortak kazanım — bugün aktif bir kanal değil)."
      el: "Το δικό σου site: <code>toestiatoriosou.captain.food</code> (ή το δικό σου <code>toestiatoriosou.fr</code>). Οι παραγγελίες θα φτάνουν απευθείας από το site σου — με τρεις τρόπους, όλοι χωρίς προμήθεια στα πιάτα σου. Στην πορεία, ο κατάλογος <strong>captain.food</strong> θα βοηθάει τους πελάτες να ανακαλύπτουν τους ανεξάρτητους της περιοχής (συλλογικό όφελος που έρχεται, όχι ενεργό κανάλι σήμερα)."
      ro: "Site-ul tău: <code>restaurantultau.captain.food</code> (sau propriul tău <code>restaurantultau.fr</code>). Comenzile vor sosi direct de pe site-ul tău — în trei moduri, toate fără comision pe preparatele tale. Mai încolo, catalogul <strong>captain.food</strong> îi va ajuta pe clienți să descopere independenții din zonă (beneficiu colectiv în pregătire, nu un canal activ azi)."
      zh: "属于你的网站：<code>nidecanting.captain.food</code>（或你自己的 <code>nidecanting.fr</code>）。订单将直接从你的网站进来——三种方式，全都不抽菜品佣金。将来，<strong>captain.food</strong> 目录还会帮客人发现身边的独立小店（未来的集体红利，目前尚未上线）。"
      ja: "あなた専用のサイト：<code>anatanomise.captain.food</code>（または独自の<code>anatanomise.fr</code>）。注文はあなたのサイトから直接届きます — 3つの方法すべて、料理への手数料なしで。ゆくゆくは、ディレクトリ<strong>captain.food</strong>が地元の独立系店舗との出会いを後押しします（将来のみんなのメリットで、今はまだ動いていません）。"
      th: "เว็บไซต์ของคุณเอง: <code>ranahan.captain.food</code> (หรือโดเมนของคุณเองแบบ <code>ranahan.fr</code>) ออร์เดอร์จะเข้ามาหาคุณตรง ๆ จากเว็บไซต์ของคุณ — ผ่านสามช่องทาง ทั้งหมดไม่มีค่าคอมมิชชั่นจากอาหาร ในอนาคต สารบัญ <strong>captain.food</strong> จะช่วยให้ลูกค้าค้นพบร้านอิสระในละแวกบ้าน (ประโยชน์ส่วนรวมที่กำลังจะมา ยังไม่ใช่ช่องทางที่เปิดใช้ในวันนี้)"
      hi: "आपकी अपनी साइट: <code>aapkarestaurant.captain.food</code> (या आपका ख़ुद का <code>aapkarestaurant.fr</code>)। ऑर्डर सीधे आपकी साइट से आएँगे — तीन तरीक़ों से, और हर तरीक़े में आपके पकवानों पर 0 कमीशन। आगे चलकर <strong>captain.food</strong> डायरेक्टरी ग्राहकों को आस-पास के स्वतंत्र कारोबार खोजने में मदद करेगी (सामूहिक फ़ायदा — आने वाला, आज सक्रिय चैनल नहीं)।"
      ta: "உங்களுக்கே சொந்தமான தளம்: <code>ungal-unavagam.captain.food</code> (அல்லது உங்கள் சொந்த <code>ungal-unavagam.fr</code>). ஆர்டர்கள் உங்கள் தளத்திலிருந்து நேரடியாக வரும் — மூன்று வழிகளில், அனைத்திலும் உங்கள் உணவுகளில் கமிஷன் இல்லை. காலப்போக்கில், <strong>captain.food</strong> அட்டவணை அருகிலுள்ள சுயாதீன உணவகங்களை வாடிக்கையாளர்கள் கண்டறிய உதவும் (வரவிருக்கும் கூட்டு நன்மை, இன்று செயலில் உள்ள வழி அல்ல)."
      ar: "موقعك الخاص: <code>matamak.captain.food</code> (أو نطاقك الخاص <code>matamak.fr</code>). ستصلك الطلبات مباشرة من موقعك — بثلاث طرق، كلها بدون عمولة على أطباقك. ولاحقًا، سيساعد دليل <strong>captain.food</strong> الزبائن على اكتشاف المستقلين في المنطقة (فائدة جماعية قادمة، وليست قناة نشطة اليوم)."
      ar-lb: "موقعك إلك: <code>matamak.captain.food</code> (أو دومينك الخاص <code>matamak.fr</code>). الطلبات رح توصل دغري من موقعك — بتلات طرق، كلّها بلا عمولة على أكلك. ومع الوقت، دليل <strong>captain.food</strong> رح يساعد الزباين يكتشفوا المستقلّين بالمنطقة (منفعة جماعية جايي، مش قناة شغّالة اليوم)."
      he: "אתר משלך: <code>hamisada.captain.food</code> (או דומיין משלך, <code>hamisada.fr</code>). ההזמנות יגיעו ישירות מהאתר שלך — בשלוש דרכים, כולן בלי עמלה על המנות. בהמשך, המדריך <strong>captain.food</strong> יעזור ללקוחות לגלות את העצמאים באזור (תועלת קהילתית עתידית, לא ערוץ פעיל כיום)."
  channels.note:
    messages:
      fr: "Un outil pour tout ton service, au lieu d'un canal de plus à gérer."
      en: "One tool for your whole service, instead of one more channel to manage."
      es: "Una herramienta para todo tu servicio, en lugar de un canal más que gestionar."
      it: "Uno strumento per tutto il tuo servizio, invece di un canale in più da gestire."
      pt: "Uma ferramenta para todo o teu serviço, em vez de mais um canal para gerir."
      de: "Ein Werkzeug für deinen ganzen Service — statt eines weiteren Kanals, den du verwalten musst."
      tr: "Yönetilecek bir kanal daha değil; tüm servisin için tek araç."
      el: "Ένα εργαλείο για όλο το σέρβις σου, αντί για ένα ακόμη κανάλι να διαχειρίζεσαι."
      ro: "Un singur instrument pentru tot serviciul tău, în loc de încă un canal de gestionat."
      zh: "一个工具管好整个服务，而不是又多一个要打理的渠道。"
      ja: "管理するチャネルをひとつ増やすのではなく、営業全体をひとつのツールで。"
      th: "เครื่องมือเดียวสำหรับทั้งร้าน แทนที่จะเป็นอีกช่องทางที่ต้องคอยดูแลเพิ่ม"
      hi: "आपकी पूरी सर्विस के लिए एक ही औज़ार — सँभालने के लिए एक और चैनल नहीं।"
      ta: "நிர்வகிக்க இன்னொரு கூடுதல் வழி அல்ல — உங்கள் முழு சேவைக்குமான ஒரே கருவி."
      ar: "أداة واحدة لكل خدمتك، بدل قناة إضافية عليك إدارتها."
      ar-lb: "أداة وحدة لكل الخدمة عندك، بدل قناة زيادة تلحّق حالك عليها."
      he: "כלי אחד לכל השירות שלך, במקום עוד ערוץ לנהל."
  channels.title:
    messages:
      fr: "Un seul QG, trois façons de recevoir tes commandes"
      en: "One HQ, three ways to receive your orders"
      es: "Un solo puesto de mando, tres formas de recibir tus pedidos"
      it: "Un solo quartier generale, tre modi di ricevere i tuoi ordini"
      pt: "Um só posto de comando, três formas de receber as tuas encomendas"
      de: "Eine Kommandobrücke, drei Wege für deine Bestellungen"
      tr: "Tek karargâh, siparişlerini almanın üç yolu"
      el: "Ένα μόνο αρχηγείο, τρεις τρόποι να δέχεσαι τις παραγγελίες σου"
      ro: "O singură punte de comandă, trei feluri de a-ți primi comenzile"
      zh: "一个指挥舱，三种接单方式"
      ja: "司令塔はひとつ、注文の受け方は3通り"
      th: "ศูนย์บัญชาการเดียว สามช่องทางรับออร์เดอร์"
      hi: "एक ही कप्तानी केबिन, ऑर्डर पाने के तीन रास्ते"
      ta: "ஒரே கட்டுப்பாட்டு மையம், ஆர்டர்களைப் பெற மூன்று வழிகள்"
      ar: "مقرّ قيادة واحد، وثلاث طرق لاستقبال طلباتك"
      ar-lb: "مركز قيادة واحد، وتلات طرق بتوصلك فيها طلباتك"
      he: "מפקדה אחת, שלוש דרכים לקבל הזמנות"

  # ---- combat ----
  combat.aria:
    messages:
      fr: "Captain.Food met la commission à terre"
      en: "Captain.Food pins the commission to the ground"
      es: "Captain.Food derriba la comisión"
      it: "Captain.Food mette al tappeto la commissione"
      pt: "A Captain.Food deita a comissão ao chão"
      de: "Captain.Food streckt die Provision nieder"
      tr: "Captain.Food komisyonu yere seriyor"
      el: "Το Captain.Food ρίχνει την προμήθεια στο έδαφος"
      ro: "Captain.Food pune comisionul la pământ"
      zh: "Captain.Food 将佣金打倒在地"
      ja: "Captain.Foodが手数料を打ち倒す"
      th: "Captain.Food จับค่าคอมมิชชั่นกดลงกับพื้น"
      hi: "Captain.Food कमीशन को धूल चटा देता है"
      ta: "Captain.Food கமிஷனைத் தரையில் வீழ்த்துகிறது"
      ar: "Captain.Food يطرح العمولة أرضًا"
      ar-lb: "Captain.Food عم يطرح العمولة أرضاً"
      he: "Captain.Food מפיל את העמלה לקרשים"
  combat.cue:
    messages:
      fr: "Je reprends mes commandes →"
      en: "I'm taking back my orders →"
      es: "Recupero mis pedidos →"
      it: "Mi riprendo i miei ordini →"
      pt: "Retomo as minhas encomendas →"
      de: "Ich hole mir meine Bestellungen zurück →"
      tr: "Siparişlerimi geri alıyorum →"
      el: "Παίρνω πίσω τις παραγγελίες μου →"
      ro: "Îmi iau înapoi comenzile →"
      zh: "我要拿回我的订单 →"
      ja: "注文の舵を取り戻す →"
      th: "ขอทวงคืนออร์เดอร์ของฉัน →"
      hi: "मैं अपने ऑर्डर वापस लेता हूँ →"
      ta: "என் ஆர்டர்களை நான் திரும்பப் பெறுகிறேன் →"
      ar: "أستعيد زمام طلباتي ←"
      ar-lb: "بدي رجّع طلباتي لإيدي ←"
      he: "אני לוקח בחזרה את ההזמנות שלי →"
  combat.img_alt:
    messages:
      fr: "Le Capitaine Food embroche de sa fourchette dorée le parasite « commission » et le cloue au sol"
      en: "Captain Food skewers the “commission” parasite with his golden fork and pins it to the ground"
      es: "El Capitán Food ensarta con su tenedor dorado al parásito «comisión» y lo clava al suelo"
      it: "Il Capitan Food infilza con la sua forchetta dorata il parassita «commissione» e lo inchioda al suolo"
      pt: "O Capitão Food espeta com o seu garfo dourado o parasita «comissão» e prega-o ao chão"
      de: "Captain Food spießt den Parasiten „Provision“ mit seiner goldenen Gabel auf und nagelt ihn zu Boden"
      tr: "Kaptan Food, altın çatalıyla « komisyon » asalağını şişleyip yere çiviliyor"
      el: "Ο Captain Food καρφώνει με το χρυσό του πιρούνι το παράσιτο «προμήθεια» και το καθηλώνει στο έδαφος"
      ro: "Căpitanul Food străpunge cu furculița lui aurie parazitul „comision” și îl țintuiește la pământ"
      zh: "Food 船长用金色餐叉叉住「佣金」寄生虫，把它钉在地上"
      ja: "キャプテン・フードが金色のフォークで寄生虫「手数料」を突き刺し、地面に打ち付けている"
      th: "กัปตัน Food ใช้ส้อมทองคำเสียบปรสิต « ค่าคอมมิชชั่น » ตรึงไว้กับพื้น"
      hi: "कैप्टन फ़ूड अपने सुनहरे काँटे से « कमीशन » नाम के परजीवी को बेधकर ज़मीन पर जड़ देता है"
      ta: "கேப்டன் ஃபுட் தன் தங்க முள்கரண்டியால் « கமிஷன் » என்ற ஒட்டுண்ணியைக் குத்தி தரையில் அழுத்துகிறார்"
      ar: "الكابتن فود يطعن بشوكته الذهبية طفيليّ «العمولة» ويسمّره في الأرض"
      ar-lb: "الكابتن فود عم يشكّ بشوكته الدهبية طفيليّ « العمولة » ويسمّره بالأرض"
      he: "קפטן פוד משפד במזלג הזהוב שלו את הטפיל ״עמלה״ ומצמיד אותו לרצפה"
  combat.sub:
    messages:
      fr: "0 % sur tes plats, toujours. Ta marge reste dans ta poche — pas dans celle d'une plateforme."
      en: "0% on your dishes, always. Your margin stays in your pocket — not a platform's."
      es: "0 % sobre tus platos, siempre. Tu margen se queda en tu bolsillo — no en el de una plataforma."
      it: "0% sui tuoi piatti, sempre. Il tuo margine resta nelle tue tasche — non in quelle di una piattaforma."
      pt: "0% sobre os teus pratos, sempre. A tua margem fica no teu bolso — não no de uma plataforma."
      de: "0 % auf deine Gerichte, immer. Deine Marge bleibt in deiner Tasche — nicht in der einer Plattform."
      tr: "Yemeklerinde %0, her zaman. Marjın senin cebinde kalır — bir platformun cebinde değil."
      el: "0 % στα πιάτα σου, πάντα. Το περιθώριό σου μένει στην τσέπη σου — όχι στην τσέπη μιας πλατφόρμας."
      ro: "0% pe preparatele tale, mereu. Marja ta rămâne în buzunarul tău — nu în cel al unei platforme."
      zh: "菜品0%佣金，永远如此。利润留在你口袋里——不进任何平台的腰包。"
      ja: "料理への手数料は、いつでも0%。利益はあなたのポケットに — プラットフォームのポケットではなく。"
      th: "0 % จากอาหารของคุณ ตลอดไป กำไรอยู่ในกระเป๋าของคุณ — ไม่ใช่กระเป๋าของแพลตฟอร์มไหนทั้งนั้น"
      hi: "आपके पकवानों पर 0% — हमेशा। आपका मार्जिन आपकी जेब में रहता है, किसी प्लेटफ़ॉर्म की जेब में नहीं।"
      ta: "உங்கள் உணவுகளில் 0 %, எப்போதும். உங்கள் லாபம் உங்கள் பையில் — ஒரு தளத்தின் பையில் அல்ல."
      ar: "0% على أطباقك، دائمًا. هامشك يبقى في جيبك — لا في جيب منصة."
      ar-lb: "0% على أكلك، دايماً. ربحك بيضلّ بجيبتك — مش بجيبة منصّة."
      he: "0% על המנות שלך, תמיד. הרווח נשאר בכיס שלך — לא בכיס של פלטפורמה."
  combat.title:
    messages:
      fr: "La commission ? On la met à terre."
      en: "The commission? We're taking it down."
      es: "¿La comisión? La mandamos a pique."
      it: "La commissione? La mettiamo al tappeto."
      pt: "A comissão? Vamos deitá-la ao chão."
      de: "Die Provision? Die strecken wir nieder."
      tr: "Komisyon mu? Yere seriyoruz."
      el: "Η προμήθεια; Την ξαπλώνουμε κάτω."
      ro: "Comisionul? Îl punem la pământ."
      zh: "佣金？一叉撂倒。"
      ja: "手数料？打ち倒しましょう。"
      th: "ค่าคอมมิชชั่นน่ะเหรอ? เราจัดการมันให้ราบคาบ"
      hi: "कमीशन? हम उसे धूल चटा देते हैं।"
      ta: "கமிஷனா? தரையில் வீழ்த்துவோம்."
      ar: "العمولة؟ نطرحها أرضًا."
      ar-lb: "العمولة؟ منطرحها أرضاً."
      he: "העמלה? שולחים אותה לקרשים."

