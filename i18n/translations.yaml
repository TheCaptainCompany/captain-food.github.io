      ta: "உங்கள் உணவுகளுக்கு 30 € + வாடிக்கையாளரின் விருப்பப் பங்களிப்பு 2,99 € (உதாரணம்)"
      ar: "30 € لأطباقك + 2,99 € مساهمة حرة من الزبون (مثال)"
      ar-lb: "30 € لأكلك + 2,99 € مساهمة حرّة من الزبون (مثال)"
      he: "30 € על המנות שלך + 2.99 € תרומה חופשית של הלקוח (דוגמה)"
  example.fine:
    messages:
      fr: "Montants donnés à titre d'exemple pour illustrer le principe, pas une grille tarifaire."
      en: "Amounts shown as an example to illustrate the principle, not a price list."
      es: "Importes a título de ejemplo para ilustrar el principio, no una tabla de tarifas."
      it: "Importi dati a titolo di esempio per illustrare il principio, non un listino."
      pt: "Montantes dados a título de exemplo para ilustrar o princípio, não uma tabela de preços."
      de: "Beträge nur als Beispiel, um das Prinzip zu zeigen — keine Preisliste."
      tr: "Tutarlar ilkeyi göstermek için verilmiş örneklerdir, fiyat tarifesi değildir."
      el: "Τα ποσά είναι ενδεικτικά, για να δείξουν την αρχή — δεν αποτελούν τιμοκατάλογο."
      ro: "Sume date ca exemplu, pentru a ilustra principiul — nu o grilă de tarife."
      zh: "金额仅为说明原理的示例，并非收费标准。"
      ja: "金額は仕組みを説明するための一例で、料金表ではありません。"
      th: "ตัวเลขเป็นเพียงตัวอย่างเพื่ออธิบายหลักการ ไม่ใช่ตารางราคา"
      hi: "राशियाँ सिर्फ़ सिद्धांत समझाने के लिए हैं, कोई रेट-कार्ड नहीं।"
      ta: "தொகைகள் கொள்கையை விளக்கும் உதாரணங்கள் மட்டுமே, கட்டண அட்டவணை அல்ல."
      ar: "المبالغ معروضة كمثال لتوضيح المبدأ، وليست جدول أسعار."
      ar-lb: "الأرقام مثال للتوضيح لنفهّم المبدأ، مش لائحة أسعار."
      he: "הסכומים ניתנים כדוגמה להמחשת העיקרון, לא מחירון."
  example.note:
    messages:
      fr: "Le client ne souhaite pas contribuer ? C'est OK, sans jugement : pas de contribution sur cette commande. <strong>Toi, tu ne verses aucune commission sur tes plats, dans tous les cas.</strong>"
      en: "The customer doesn't want to contribute? That's fine, no judgment: no contribution on that order. <strong>You never pay any commission on your dishes, no matter what.</strong>"
      es: "¿El cliente no quiere contribuir? No pasa nada, sin juicios: sin contribución en ese pedido. <strong>Tú no pagas ninguna comisión sobre tus platos, en ningún caso.</strong>"
      it: "Il cliente non vuole contribuire? Va bene, senza giudizi: nessun contributo su quell'ordine. <strong>Tu, in ogni caso, non versi nessuna commissione sui tuoi piatti.</strong>"
      pt: "O cliente não quer contribuir? Tudo bem, sem julgamentos: não há contribuição nessa encomenda. <strong>Tu não pagas nenhuma comissão sobre os teus pratos, em qualquer caso.</strong>"
      de: "Der Gast möchte nichts beitragen? Kein Problem, ohne Wertung: kein Beitrag auf diese Bestellung. <strong>Du zahlst in jedem Fall keinerlei Provision auf deine Gerichte.</strong>"
      tr: "Müşteri katkı yapmak istemiyor mu? Sorun değil, yargı yok: o siparişte katkı olmaz. <strong>Sen ise her durumda yemeklerin üzerinden tek kuruş komisyon ödemezsin.</strong>"
      el: "Ο πελάτης δεν θέλει να συνεισφέρει; Κανένα θέμα, χωρίς κριτική: καμία συνεισφορά σε αυτή την παραγγελία. <strong>Εσύ δεν πληρώνεις καμία προμήθεια στα πιάτα σου, σε κάθε περίπτωση.</strong>"
      ro: "Clientul nu vrea să contribuie? E OK, fără judecăți: nicio contribuție la acea comandă. <strong>Tu nu plătești niciun comision pe preparatele tale, în orice caz.</strong>"
      zh: "客人不想给支持金？没关系，绝不评判：这一单就没有支持金。<strong>而你，任何情况下都不用为菜品付一分佣金。</strong>"
      ja: "お客様が応援しない？それでOK、詮索なし：その注文に応援金はつきません。<strong>あなたは、どんな場合でも料理への手数料を一切払いません。</strong>"
      th: "ลูกค้าไม่อยากสมทบเหรอ? ไม่เป็นไร ไม่มีการตัดสินใด ๆ: ออร์เดอร์นั้นก็ไม่มีเงินสมทบ <strong>ส่วนคุณ ไม่ต้องจ่ายค่าคอมมิชชั่นจากอาหารเลย ในทุกกรณี</strong>"
      hi: "ग्राहक योगदान नहीं देना चाहता? कोई बात नहीं, कोई सवाल नहीं: उस ऑर्डर पर कोई योगदान नहीं। <strong>आप अपने पकवानों पर कोई कमीशन नहीं देते — हर हाल में।</strong>"
      ta: "வாடிக்கையாளர் பங்களிக்க விரும்பவில்லையா? பரவாயில்லை, எந்தக் குறையும் இல்லை: அந்த ஆர்டரில் பங்களிப்பு இல்லை. <strong>நீங்கள் எந்தச் சூழலிலும் உங்கள் உணவுகளில் கமிஷன் கட்டுவதில்லை.</strong>"
      ar: "الزبون لا يرغب في المساهمة؟ لا بأس، وبلا أي إحراج: لا مساهمة على هذا الطلب. <strong>أما أنت، فلا تدفع أي عمولة على أطباقك، في كل الحالات.</strong>"
      ar-lb: "الزبون ما حابب يساهم؟ عادي، وبلا أحكام: ما في مساهمة على هالطلب. <strong>إنت، ما بتدفع ولا عمولة على أكلك، بكل الحالات.</strong>"
      he: "הלקוח לא רוצה לתרום? זה בסדר, בלי שיפוטיות: אין תרומה על ההזמנה הזאת. <strong>אתה לא משלם שום עמלה על המנות שלך, בכל מקרה.</strong>"
