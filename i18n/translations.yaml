  calc.reassure:
    messages:
      fr: "0 € pour toi, dans tous les cas — <strong>c'est le client qui contribue, pas toi.</strong> <a href=\"financement.html\">Comment on se finance →</a>"
      en: "€0 for you, no matter what — <strong>the customer contributes, not you.</strong> <a href=\"financement.html\">How we fund ourselves →</a>"
      es: "0 € para ti, en todos los casos — <strong>contribuye el cliente, no tú.</strong> <a href=\"financement.html\">Cómo nos financiamos →</a>"
      it: "0 € per te, in ogni caso — <strong>è il cliente che contribuisce, non tu.</strong> <a href=\"financement.html\">Come ci finanziamo →</a>"
      pt: "0 € para ti, em qualquer caso — <strong>é o cliente que contribui, não tu.</strong> <a href=\"financement.html\">Como nos financiamos →</a>"
      de: "0 € für dich, in jedem Fall — <strong>der Gast trägt bei, nicht du.</strong> <a href=\"financement.html\">Wie wir uns finanzieren →</a>"
      tr: "Her durumda sana maliyeti 0 € — <strong>katkıyı müşteri yapar, sen değil.</strong> <a href=\"financement.html\">Nasıl finanse oluyoruz →</a>"
      el: "0 € για σένα, σε κάθε περίπτωση — <strong>ο πελάτης είναι που συνεισφέρει, όχι εσύ.</strong> <a href=\"financement.html\">Πώς χρηματοδοτούμαστε →</a>"
      ar: "0 € عليك، في كل الحالات — <strong>الزبون هو من يساهم، لا أنت.</strong> <a href=\"financement.html\">كيف نموّل أنفسنا ←</a>"
      he: "0 € בשבילך, בכל מקרה — <strong>הלקוח הוא שתורם, לא אתה.</strong> <a href=\"financement.html\">איך אנחנו מממנים את עצמנו →</a>"
  calc.smic:
    params:
      months: "number of SMIC salary-months the yearly commission equals, e.g. « 9,3 »"
    messages:
      fr: "C'est ≈ <strong>{months} mois de salaire</strong> au SMIC (charges comprises). Chaque année."
      en: "That's ≈ <strong>{months} months of salary</strong> at the SMIC, the French minimum wage (employer costs included). Every single year."
      es: "Eso son ≈ <strong>{months} meses de sueldo</strong> al SMIC, el salario mínimo francés (cotizaciones incluidas). Cada año."
      it: "Sono ≈ <strong>{months} mensilità</strong> allo SMIC, il salario minimo francese (contributi inclusi). Ogni anno."
      pt: "É ≈ <strong>{months} meses de salário</strong> ao SMIC (o salário mínimo francês, encargos incluídos). Todos os anos."
      de: "Das sind ≈ <strong>{months} Monatsgehälter</strong> zum SMIC, dem französischen Mindestlohn (inklusive Abgaben). Jedes Jahr."
      tr: "Bu ≈ <strong>{months} aylık maaş</strong> demek, SMIC üzerinden (Fransa'daki asgari ücret; primler dahil). Her yıl."
      el: "Ισοδυναμεί με ≈ <strong>{months} μήνες μισθού</strong> στον SMIC, τον γαλλικό κατώτατο μισθό (με τις εισφορές). Κάθε χρόνο."
      ar: "هذا يعادل ≈ <strong>{months} شهرًا من الراتب</strong> بالحد الأدنى الفرنسي للأجور SMIC (شاملًا الأعباء). كل سنة."
      he: "זה ≈ <strong>{months} חודשי משכורת</strong> לפי SMIC, שכר המינימום הצרפתי (כולל הפרשות מעסיק). כל שנה."

  # ---- channel ----
  channel.delivery_body:
    messages:
      fr: "Tes clients commandent en ligne sur ton site, à ton nom. Pas d'intermédiaire qui se sert au passage."
      en: "Your customers order online on your site, under your name. No middleman helping themselves along the way."
      es: "Tus clientes piden online en tu web, con tu nombre. Sin intermediarios que se sirvan por el camino."
      it: "I tuoi clienti ordinano online sul tuo sito, a tuo nome. Nessun intermediario che si serve al passaggio."
      pt: "Os teus clientes encomendam online no teu site, com o teu nome. Sem intermediário a servir-se pelo caminho."
      de: "Deine Gäste bestellen online auf deiner Website, unter deinem Namen. Kein Zwischenhändler, der sich unterwegs bedient."
      tr: "Müşterilerin senin sitende, senin adınla online sipariş verir. Aradan pay alan aracı yok."
      el: "Οι πελάτες σου παραγγέλνουν online στο site σου, με το όνομά σου. Χωρίς μεσάζοντα που τσιμπάει μερίδιο στο πέρασμα."
      ar: "زبائنك يطلبون أونلاين من موقعك، وباسمك. لا وسيط يقتطع نصيبه في الطريق."
      he: "הלקוחות שלך מזמינים אונליין באתר שלך, על שמך. בלי מתווך שגוזר קופון בדרך."
  channel.delivery_cue:
    messages:
      fr: "Comment on paie la livraison →"
      en: "How we pay for delivery →"
      es: "Cómo pagamos el reparto →"
      it: "Come paghiamo la consegna →"
      pt: "Como pagamos a entrega →"
      de: "Wie wir die Lieferung bezahlen →"
      tr: "Teslimatı nasıl ödüyoruz →"
      el: "Πώς πληρώνουμε τη διανομή →"
      ar: "كيف ندفع أجر التوصيل ←"
      he: "איך משלמים על המשלוח →"
  channel.delivery_title:
    messages:
      fr: "En livraison"
      en: "Delivery"
      es: "A domicilio"
      it: "In consegna"
      pt: "Entrega ao domicílio"
      de: "Lieferung"
      tr: "Teslimatla"
      el: "Με διανομή"
      ar: "بالتوصيل"
      he: "במשלוח"
  channel.pickup_body:
    messages:
      fr: "Le client commande à l'avance et récupère sur place. Simple, direct, sans matériel en plus."
      en: "Customers order ahead and pick up on site. Simple, direct, no extra hardware."
      es: "El cliente pide con antelación y recoge en el local. Simple, directo, sin equipamiento extra."
      it: "Il cliente ordina in anticipo e ritira sul posto. Semplice, diretto, senza attrezzatura in più."
      pt: "O cliente encomenda com antecedência e levanta no local. Simples, direto, sem equipamento extra."
      de: "Der Gast bestellt vor und holt vor Ort ab. Einfach, direkt, ohne zusätzliche Geräte."
      tr: "Müşteri önceden sipariş verir, gelip yerinden alır. Basit, doğrudan, ekstra ekipman yok."
      el: "Ο πελάτης παραγγέλνει από πριν και παραλαμβάνει επιτόπου. Απλό, άμεσο, χωρίς επιπλέον εξοπλισμό."
      ar: "الزبون يطلب مسبقًا ويستلم من المحل. بسيط، مباشر، وبدون أي معدات إضافية."
      he: "הלקוח מזמין מראש ואוסף במקום. פשוט, ישיר, בלי ציוד נוסף."
  channel.pickup_title:
    messages:
      fr: "À emporter (click and collect)"
      en: "Takeaway (click and collect)"
      es: "Para llevar (click and collect)"
      it: "Da asporto (click and collect)"
      pt: "Para levar (click and collect)"
      de: "Zum Mitnehmen (Click & Collect)"
      tr: "Gel-al (click and collect)"
      el: "Για παραλαβή (click and collect)"
      ar: "للاستلام (كليك آند كوليكت)"
      he: "באיסוף עצמי (Click & Collect)"
  channel.qr_body:
    messages:
      fr: "Le client scanne, commande depuis sa place. La commande part en cuisine, et <strong>le paiement reste dans ta caisse habituelle</strong> — on ne touche pas à ton encaissement. C'est inclus, sans commission."
      en: "Customers scan and order from their seat. The order goes straight to the kitchen, and <strong>the payment stays in your usual till</strong> — we don't touch your checkout. Included, commission-free."
      es: "El cliente escanea y pide desde su sitio. El pedido sale hacia cocina, y <strong>el pago se queda en tu caja de siempre</strong> — no tocamos tu cobro. Va incluido, sin comisión."
      it: "Il cliente scansiona e ordina dal suo posto. La comanda parte in cucina, e <strong>il pagamento resta nella tua cassa abituale</strong> — il tuo incasso non lo tocchiamo. È incluso, senza commissioni."
      pt: "O cliente faz scan e encomenda do seu lugar. A comanda segue para a cozinha, e <strong>o pagamento fica na tua caixa habitual</strong> — não tocamos na tua cobrança. Está incluído, sem comissão."
      de: "Der Gast scannt und bestellt direkt vom Platz aus. Die Bestellung geht in die Küche, und <strong>bezahlt wird wie gewohnt an deiner Kasse</strong> — dein Kassiervorgang bleibt unangetastet. Inklusive, ohne Provision."
      tr: "Müşteri kodu okutur, oturduğu yerden sipariş verir. Sipariş mutfağa düşer ve <strong>ödeme her zamanki kasanda kalır</strong> — tahsilatına karışmayız. Dahildir, komisyonsuz."
      el: "Ο πελάτης σκανάρει και παραγγέλνει από τη θέση του. Η παραγγελία φεύγει για την κουζίνα, και <strong>η πληρωμή μένει στο ταμείο σου, όπως πάντα</strong> — δεν αγγίζουμε την είσπραξή σου. Περιλαμβάνεται, χωρίς προμήθεια."
      ar: "الزبون يمسح الرمز ويطلب من مكانه. الطلب ينطلق إلى المطبخ، و<strong>الدفع يبقى في صندوقك المعتاد</strong> — لا نمسّ تحصيلك. مشمول في الخدمة، وبدون عمولة."
      he: "הלקוח סורק ומזמין מהמקום שלו. ההזמנה יוצאת למטבח, ו<strong>התשלום נשאר בקופה הרגילה שלך</strong> — אנחנו לא נוגעים בסליקה שלך. זה כלול, בלי עמלה."
  channel.qr_title:
    messages:
      fr: "À table, par QR code"
      en: "At the table, via QR code"
      es: "En mesa, por código QR"
      it: "Al tavolo, con QR code"
      pt: "À mesa, por código QR"
      de: "Am Tisch, per QR-Code"
      tr: "Masada, QR kodla"
      el: "Στο τραπέζι, με QR code"
      ar: "على الطاولة، برمز QR"
      he: "ליד השולחן, בסריקת QR"

  # ---- channels ----
  channels.intro:
    messages:
      fr: "Ton site à toi : <code>tonresto.captain.food</code> (ou ton propre <code>tonresto.fr</code>). Les commandes arriveront en direct depuis ton site — de trois manières, toutes sans commission sur tes plats. À terme, l'annuaire <strong>captain.food</strong> aidera les clients à découvrir les indépendants du coin (bénéfice collectif à venir, pas un canal actif aujourd'hui)."
      en: "Your own site: <code>yourresto.captain.food</code> (or your own <code>yourresto.fr</code>). Orders will come in direct from your site — in three ways, all commission-free on your dishes. Down the line, the <strong>captain.food</strong> directory will help customers discover the independents nearby (a collective benefit to come, not an active channel today)."
      es: "Tu web propia: <code>turesto.captain.food</code> (o tu propio <code>turesto.fr</code>). Los pedidos te llegarán en directo desde tu web — de tres maneras, todas sin comisión sobre tus platos. Más adelante, el directorio <strong>captain.food</strong> ayudará a los clientes a descubrir a los independientes de la zona (beneficio colectivo por llegar, no un canal activo hoy)."
      it: "Il tuo sito tutto tuo: <code>iltuoristorante.captain.food</code> (o il tuo <code>iltuoristorante.fr</code>). Gli ordini arriveranno direttamente dal tuo sito — in tre modi, tutti senza commissioni sui tuoi piatti. Col tempo, l'elenco <strong>captain.food</strong> aiuterà i clienti a scoprire gli indipendenti della zona (beneficio collettivo in arrivo, non un canale attivo oggi)."
      pt: "O teu site, teu: <code>oteuresto.captain.food</code> (ou o teu próprio <code>oteuresto.fr</code>). As encomendas chegarão em direto a partir do teu site — de três maneiras, todas sem comissão sobre os teus pratos. Mais adiante, o diretório <strong>captain.food</strong> ajudará os clientes a descobrir os independentes da zona (benefício coletivo a chegar, não um canal ativo hoje)."
      de: "Deine eigene Website: <code>deinresto.captain.food</code> (oder deine eigene <code>deinresto.fr</code>). Die Bestellungen kommen direkt über deine Website — auf drei Wegen, alle ohne Provision auf deine Gerichte. Später hilft das Verzeichnis <strong>captain.food</strong> den Gästen, die Unabhängigen der Umgebung zu entdecken (ein gemeinsamer Vorteil in Planung, heute noch kein aktiver Kanal)."
      tr: "Sana ait bir site: <code>restoranin.captain.food</code> (ya da kendi <code>restoranin.fr</code> alan adın). Siparişler doğrudan senin sitenden gelecek — üç şekilde, hepsi yemeklerinde komisyonsuz. Zamanla <strong>captain.food</strong> rehberi, müşterilerin civardaki bağımsızları keşfetmesine yardım edecek (ileride ortak kazanım — bugün aktif bir kanal değil)."
      el: "Το δικό σου site: <code>toestiatoriosou.captain.food</code> (ή το δικό σου <code>toestiatoriosou.fr</code>). Οι παραγγελίες θα φτάνουν απευθείας από το site σου — με τρεις τρόπους, όλοι χωρίς προμήθεια στα πιάτα σου. Στην πορεία, ο κατάλογος <strong>captain.food</strong> θα βοηθάει τους πελάτες να ανακαλύπτουν τους ανεξάρτητους της περιοχής (συλλογικό όφελος που έρχεται, όχι ενεργό κανάλι σήμερα)."
      ar: "موقعك الخاص: <code>matamak.captain.food</code> (أو نطاقك الخاص <code>matamak.fr</code>). ستصلك الطلبات مباشرة من موقعك — بثلاث طرق، كلها بدون عمولة على أطباقك. ولاحقًا، سيساعد دليل <strong>captain.food</strong> الزبائن على اكتشاف المستقلين في المنطقة (فائدة جماعية قادمة، وليست قناة نشطة اليوم)."
      he: "אתר משלך: <code>hamisada.captain.food</code> (או דומיין משלך, <code>hamisada.fr</code>). ההזמנות יגיעו ישירות מהאתר שלך — בשלוש דרכים, כולן בלי עמלה על המנות. בהמשך, המדריך <strong>captain.food</strong> יעזור ללקוחות לגלות את העצמאים באזור (תועלת קהילתית עתידית, לא ערוץ פעיל כיום)."
  channels.note:
    messages:
      fr: "Un outil pour tout ton service, au lieu d'un canal de plus à gérer."
      en: "One tool for your whole service, instead of one more channel to manage."
      es: "Una herramienta para todo tu servicio, en lugar de un canal más que gestionar."
      it: "Uno strumento per tutto il tuo servizio, invece di un canale in più da gestire."
      pt: "Uma ferramenta para todo o teu serviço, em vez de mais um canal para gerir."
      de: "Ein Werkzeug für deinen ganzen Service — statt eines weiteren Kanals, den du verwalten musst."
      tr: "Yönetilecek bir kanal daha değil; tüm servisin için tek araç."
      el: "Ένα εργαλείο για όλο το σέρβις σου, αντί για ένα ακόμη κανάλι να διαχειρίζεσαι."
      ar: "أداة واحدة لكل خدمتك، بدل قناة إضافية عليك إدارتها."
      he: "כלי אחד לכל השירות שלך, במקום עוד ערוץ לנהל."
  channels.title:
    messages:
      fr: "Un seul QG, trois façons de recevoir tes commandes"
      en: "One HQ, three ways to receive your orders"
      es: "Un solo puesto de mando, tres formas de recibir tus pedidos"
      it: "Un solo quartier generale, tre modi di ricevere i tuoi ordini"
      pt: "Um só posto de comando, três formas de receber as tuas encomendas"
      de: "Eine Kommandobrücke, drei Wege für deine Bestellungen"
      tr: "Tek karargâh, siparişlerini almanın üç yolu"
      el: "Ένα μόνο αρχηγείο, τρεις τρόποι να δέχεσαι τις παραγγελίες σου"
      ar: "مقرّ قيادة واحد، وثلاث طرق لاستقبال طلباتك"
      he: "מפקדה אחת, שלוש דרכים לקבל הזמנות"

