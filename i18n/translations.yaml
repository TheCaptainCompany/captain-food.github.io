  # ---- form ----
  form.consent:
    messages:
      fr: "J'accepte que mes coordonnées soient utilisées par <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> pour me recontacter au sujet de ce projet. Elles ne seront ni revendues, ni partagées. Je peux demander leur suppression à tout moment. <a href=\"confidentialite.html\">Voir la politique de confidentialité</a>. <span class=\"req\" aria-hidden=\"true\">*</span>"
      en: "I agree that my contact details may be used by <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> to get back to me about this project. They will never be sold or shared. I can ask for them to be deleted at any time. <a href=\"confidentialite.html\">See the privacy policy</a>. <span class=\"req\" aria-hidden=\"true\">*</span>"
      es: "Acepto que <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> use mis datos de contacto para escribirme sobre este proyecto. No se venderán ni se compartirán. Puedo pedir que se eliminen en cualquier momento. <a href=\"confidentialite.html\">Ver la política de privacidad</a>. <span class=\"req\" aria-hidden=\"true\">*</span>"
      it: "Accetto che i miei dati di contatto siano usati da <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> per ricontattarmi riguardo a questo progetto. Non saranno né rivenduti né condivisi. Posso chiederne la cancellazione in qualsiasi momento. <a href=\"confidentialite.html\">Leggi l'informativa sulla privacy</a>. <span class=\"req\" aria-hidden=\"true\">*</span>"
      pt: "Aceito que os meus dados de contacto sejam utilizados pela <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> para me contactar sobre este projeto. Não serão revendidos nem partilhados. Posso pedir a sua eliminação a qualquer momento. <a href=\"confidentialite.html\">Ver a política de privacidade</a>. <span class=\"req\" aria-hidden=\"true\">*</span>"
      ar: "أوافق على أن تستخدم <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> بياناتي للتواصل معي بخصوص هذا المشروع. لن تُباع ولن تُشارَك مع أي جهة. ويمكنني طلب حذفها في أي وقت. <a href=\"confidentialite.html\">اطّلع على سياسة الخصوصية</a>. <span class=\"req\" aria-hidden=\"true\">*</span>"
      he: "אני מאשר ש-<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> ישתמש בפרטים שלי כדי לחזור אליי בנוגע לפרויקט הזה. הם לא יימכרו ולא ישותפו. אני יכול לבקש למחוק אותם בכל רגע. <a href=\"confidentialite.html\">למדיניות הפרטיות</a>. <span class=\"req\" aria-hidden=\"true\">*</span>"
