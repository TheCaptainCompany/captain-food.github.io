  lang.consent_text:
    messages:
      fr: "On retient ta langue pour tes prochaines visites ? Ça dépose un petit cookie — rien d'autre, promis."
      en: "Remember your language for your next visits? That sets one small cookie — nothing else, promise."
      es: "¿Recordamos tu idioma para tus próximas visitas? Eso deja una pequeña cookie — nada más, prometido."
      it: "Ricordiamo la tua lingua per le prossime visite? Salviamo un piccolo cookie — nient'altro, promesso."
      pt: "Guardamos o teu idioma para as próximas visitas? Isso deixa um pequeno cookie — nada mais, prometido."
      de: "Dürfen wir uns deine Sprache für den nächsten Besuch merken? Dafür setzen wir ein kleines Cookie — sonst nichts, versprochen."
      tr: "Sonraki ziyaretlerin için dilini hatırlayalım mı? Küçük bir çerez bırakır — başka hiçbir şey, söz."
      el: "Να θυμόμαστε τη γλώσσα σου για τις επόμενες επισκέψεις; Αποθηκεύεται ένα μικρό cookie — τίποτα άλλο, το υποσχόμαστε."
      ro: "Îți ținem minte limba pentru vizitele viitoare? Asta lasă un mic cookie — nimic altceva, promitem."
      zh: "要记住你的语言，下次直接用吗？这会存一个小小的 cookie——仅此而已，说到做到。"
      ja: "次回の訪問のために、あなたの言語を覚えておきましょうか？小さなクッキーをひとつ置くだけ — それ以外は何もしません、約束です。"
      th: "ให้เราจำภาษาของคุณไว้สำหรับครั้งหน้าไหม? เราจะเก็บคุกกี้เล็ก ๆ หนึ่งตัว — แค่นั้นจริง ๆ สัญญา"
      hi: "अगली बार के लिए आपकी भाषा याद रखें? इसके लिए बस एक छोटा-सा कुकी रखेंगे — और कुछ नहीं, वादा।"
      ta: "அடுத்த வருகைகளுக்காக உங்கள் மொழியை நினைவில் வைக்கவா? ஒரு சிறிய குக்கீ மட்டும் — வேறு எதுவும் இல்லை, சத்தியம்."
      ar: "نحفظ لغتك لزياراتك القادمة؟ سيضع ذلك كوكي صغيرًا — لا شيء آخر، وعدٌ منا."
      ar-lb: "منتذكّر لغتك لزياراتك الجايي؟ هالشي بيحطّ كوكي صغير — وبس، وعدنا."
      he: "שנזכור את השפה שלך לביקורים הבאים? זה שומר עוגייה קטנה אחת — שום דבר מעבר, מבטיחים."
  lang.switch_label:
