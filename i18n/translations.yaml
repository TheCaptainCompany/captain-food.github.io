      fr: "Voici la maquette du produit qu'on veut mettre en place. <strong>Rien n'est encore construit</strong> — c'est là qu'on a besoin de toi. Teste les vues client, restaurateur et livreur, puis fais tes retours sur le WhatsApp de la communauté ou via le formulaire sous chaque maquette."
      en: "Here's the mockup of the product we want to build. <strong>Nothing is built yet</strong> — and that's exactly where we need you. Try out the customer, restaurateur and rider views, then share your feedback on the community WhatsApp or via the form under each mockup."
      es: "Esta es la maqueta del producto que queremos levantar. <strong>Aún no hay nada construido</strong> — y ahí es donde te necesitamos. Prueba las vistas de cliente, hostelero y repartidor, y cuéntanos qué te parece en el WhatsApp de la comunidad o en el formulario bajo cada maqueta."
