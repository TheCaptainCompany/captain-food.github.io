      es: "Esta es la maqueta del producto que queremos levantar. <strong>Aún no hay nada construido</strong> — y ahí es donde te necesitamos. Prueba las vistas de cliente, hostelero y repartidor, y cuéntanos qué te parece en el WhatsApp de la comunidad o en el formulario bajo cada maqueta."
      it: "Ecco il mockup del prodotto che vogliamo realizzare. <strong>Non c'è ancora niente di costruito</strong> — ed è qui che abbiamo bisogno di te. Prova le viste cliente, ristoratore e rider, poi facci sapere sul WhatsApp della community o tramite il modulo sotto ogni mockup."
      pt: "Aqui está a maquete do produto que queremos pôr de pé. <strong>Ainda nada está construído</strong> — é aí que precisamos de ti. Testa as vistas de cliente, restaurador e estafeta, e depois dá-nos a tua opinião no WhatsApp da comunidade ou no formulário por baixo de cada maquete."
      de: "Hier ist das Mockup des Produkts, das wir bauen wollen. <strong>Noch ist nichts gebaut</strong> — genau da brauchen wir dich. Teste die Ansichten für Gäste, Gastronomen und Fahrer und gib dann dein Feedback in der WhatsApp-Community oder über das Formular unter jedem Mockup."
      tr: "İşte kurmak istediğimiz ürünün taslağı. <strong>Henüz hiçbir şey inşa edilmedi</strong> — sana tam da bu yüzden ihtiyacımız var. Müşteri, restorancı ve kurye ekranlarını dene, sonra görüşlerini topluluğun WhatsApp grubunda ya da her taslağın altındaki formdan bize ilet."
      el: "Να η μακέτα του προϊόντος που θέλουμε να στήσουμε. <strong>Τίποτα δεν έχει χτιστεί ακόμα</strong> — και ακριβώς εδώ σε χρειαζόμαστε. Δοκίμασε τις οθόνες πελάτη, εστιάτορα και διανομέα, και πες μας τη γνώμη σου στο WhatsApp της κοινότητας ή μέσα από τη φόρμα κάτω από κάθε μακέτα."
      ar: "هذا نموذج المنتج الذي نريد إطلاقه. <strong>لم يُبنَ شيء بعد</strong> — وهنا بالضبط نحتاج إليك. جرّب واجهات الزبون وصاحب المطعم والسائق، ثم شاركنا ملاحظاتك على مجموعة WhatsApp الخاصة بالمجتمع أو عبر الاستمارة أسفل كل نموذج."
      he: "הנה המוקאפ של המוצר שאנחנו רוצים להקים. <strong>עוד לא בנינו כלום</strong> — ובדיוק בגלל זה אנחנו צריכים אותך. נסה את תצוגות הלקוח, המסעדן והשליח, ואז שתף פידבק ב-WhatsApp של הקהילה או בטופס שמתחת לכל מוקאפ."
  mockups.note:
    messages:
      fr: "Sous chaque maquette, un formulaire pour laisser ton avis. On avance ensemble. ⚓"
