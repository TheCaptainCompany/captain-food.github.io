      el: "Οι μάστορες της γεύσης"
      ar: "حرفيّو المائدة"
      he: "אומני המטבח"
  who.close:
    messages:
      fr: "Si tu es une grande enseigne à la recherche du plus gros volume au moindre coût, on n'est probablement pas faits pour toi. Si tu veux reprendre la main sur ton affaire, <strong>embarque</strong>."
      en: "If you're a big chain chasing maximum volume at minimum cost, we're probably not for you. If you want to take back the helm of your business, <strong>come aboard</strong>."
      es: "Si eres una gran cadena en busca del máximo volumen al mínimo coste, probablemente no somos para ti. Si quieres recuperar el timón de tu negocio, <strong>súbete a bordo</strong>."
      it: "Se sei una grande catena a caccia del massimo volume al minimo costo, probabilmente non siamo fatti per te. Se vuoi riprendere in mano la tua attività, <strong>sali a bordo</strong>."
      pt: "Se és uma grande cadeia à procura do maior volume ao menor custo, provavelmente não somos para ti. Se queres retomar as rédeas do teu negócio, <strong>embarca</strong>."
      de: "Wenn du eine große Kette auf der Jagd nach dem größten Volumen zum kleinsten Preis bist, passen wir wahrscheinlich nicht zu dir. Wenn du wieder das Ruder über deinen Laden übernehmen willst: <strong>Komm an Bord</strong>."
      tr: "En düşük maliyetle en büyük hacmin peşindeki büyük bir zincirsen, muhtemelen birbirimize göre değiliz. Ama işinin dümenini geri almak istiyorsan, <strong>gemiye atla</strong>."
      el: "Αν είσαι μεγάλη αλυσίδα που ψάχνει τον μεγαλύτερο όγκο με το μικρότερο κόστος, μάλλον δεν είμαστε για σένα. Αν θέλεις να ξαναπάρεις τον έλεγχο της δουλειάς σου, <strong>ανέβα στο πλοίο</strong>."
      ar: "إذا كنت علامة كبرى تبحث عن أكبر حجم بأقل تكلفة، فربما لسنا الخيار المناسب لك. أما إذا أردت استعادة زمام مشروعك، <strong>فاصعد على المتن</strong>."
      he: "אם אתה רשת גדולה שמחפשת את הווליום הכי גדול בעלות הכי נמוכה, כנראה שאנחנו לא בשבילך. אם אתה רוצה לקחת בחזרה את השליטה בעסק שלך — <strong>עלה לסיפון</strong>."
