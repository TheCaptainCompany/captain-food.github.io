  who.card2_body:
    messages:
      fr: "qui veulent un canal de commande simple, à leur nom, sans matériel lourd."
      en: "who want a simple ordering channel, under their name, without heavy gear."
      es: "que quieren un canal de pedidos simple, con su nombre, sin equipamiento pesado."
      it: "che vogliono un canale di ordini semplice, a loro nome, senza attrezzature pesanti."
      pt: "que querem um canal de encomendas simples, com o seu nome, sem equipamento pesado."
      de: "die einen einfachen Bestellkanal wollen, unter eigenem Namen, ohne schweres Gerät."
      tr: "kendi adına, ağır ekipman gerektirmeyen basit bir sipariş kanalı isteyenler."
      el: "που θέλουν ένα απλό κανάλι παραγγελιών, με το όνομά τους, χωρίς βαρύ εξοπλισμό."
      ro: "care vor un canal de comenzi simplu, pe numele lor, fără echipament greu."
      zh: "想要一个简单、挂自己名字、不用添置笨重设备的点餐渠道。"
      ja: "重い機材なしで、自分の名前のシンプルな注文チャネルが欲しい方。"
      th: "ที่อยากได้ช่องทางรับออร์เดอร์ง่าย ๆ ในชื่อของตัวเอง โดยไม่ต้องมีอุปกรณ์หนัก ๆ"
      hi: "जिन्हें अपने नाम का एक सरल ऑर्डरिंग चैनल चाहिए, बिना भारी-भरकम उपकरण के।"
      ta: "கனமான சாதனங்கள் இல்லாமல், தங்கள் பெயரில் எளிய ஆர்டர் வழி வேண்டுபவர்கள்."
      ar: "التي تريد قناة طلب بسيطة، باسمها، وبدون معدات ثقيلة."
      ar-lb: "يلّي بدها قناة طلب بسيطة، باسمها، وبلا معدّات تقيلة."
      he: "שרוצים ערוץ הזמנות פשוט, על שמם, בלי ציוד כבד."
