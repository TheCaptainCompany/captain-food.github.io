  # ---- faq ----
  faq.a1:
    messages:
      fr: "Pour toi : 0 % de commission sur tes plats, inscription gratuite, dans tous les cas. Le service est financé par une <strong>contribution libre du client</strong>, ajoutée à sa commande en toute transparence (0 € possible, sans jugement) — jamais par toi. Les frais de paiement par carte sont les frais bancaires standards de tout encaissement en ligne, jamais une surcharge ajoutée au client. <a href=\"financement.html\">Voir le détail complet, exemple à l'appui.</a>"
      en: "For you: 0% commission on your dishes, free signup, no matter what. The service is funded by a <strong>pay-what-you-want customer contribution</strong>, added to their order in full transparency (€0 is fine, no judgment) — never by you. Card payment fees are the standard banking fees of any online payment, never a surcharge added for the customer. <a href=\"financement.html\">See the full details, worked example included.</a>"
      es: "Para ti: 0 % de comisión sobre tus platos, alta gratuita, en todos los casos. El servicio se financia con una <strong>contribución libre del cliente</strong>, añadida a su pedido con total transparencia (0 € posible, sin juicios) — nunca la pagas tú. Las comisiones de pago con tarjeta son las bancarias estándar de cualquier cobro online, nunca un recargo añadido al cliente. <a href=\"financement.html\">Ver el detalle completo, con ejemplo incluido.</a>"
      it: "Per te: 0% di commissioni sui tuoi piatti, iscrizione gratuita, in ogni caso. Il servizio si finanzia con un <strong>contributo libero del cliente</strong>, aggiunto al suo ordine in piena trasparenza (0 € possibile, senza giudizi) — mai da te. Le spese di pagamento con carta sono i costi bancari standard di qualsiasi incasso online, mai un sovrapprezzo aggiunto al cliente. <a href=\"financement.html\">Guarda il dettaglio completo, esempio alla mano.</a>"
      pt: "Para ti: 0% de comissão sobre os teus pratos, inscrição gratuita, em qualquer caso. O serviço é financiado por uma <strong>contribuição livre do cliente</strong>, adicionada à encomenda com toda a transparência (0 € possível, sem julgamentos) — nunca por ti. As taxas de pagamento por cartão são as taxas bancárias padrão de qualquer cobrança online, nunca uma sobretaxa cobrada ao cliente. <a href=\"financement.html\">Ver o detalhe completo, com exemplo.</a>"
      de: "Für dich: 0 % Provision auf deine Gerichte, kostenlose Anmeldung, in jedem Fall. Der Service wird durch einen <strong>freiwilligen Beitrag des Gastes</strong> finanziert, der ganz transparent zur Bestellung dazukommt (0 € möglich, ohne Wertung) — nie durch dich. Die Kartenzahlungsgebühren sind die üblichen Bankgebühren jeder Online-Zahlung, nie ein Aufschlag für den Gast. <a href=\"financement.html\">Alle Details, mit Rechenbeispiel.</a>"
      tr: "Senin için: yemeklerinde %0 komisyon, ücretsiz kayıt, her durumda. Hizmet, siparişe tam bir şeffaflıkla eklenen <strong>gönüllü müşteri katkısıyla</strong> finanse edilir (0 € da olabilir, yargı yok) — asla senin tarafından değil. Kartla ödeme masrafları her online tahsilatın standart banka masraflarıdır; müşteriye eklenen bir ek ücret asla değildir. <a href=\"financement.html\">Örnekli tüm ayrıntıya bak.</a>"
      el: "Για σένα: 0 % προμήθεια στα πιάτα σου, δωρεάν εγγραφή, σε κάθε περίπτωση. Η υπηρεσία χρηματοδοτείται από μια <strong>ελεύθερη συνεισφορά του πελάτη</strong>, που προστίθεται στην παραγγελία του με πλήρη διαφάνεια (0 € γίνεται, χωρίς κριτική) — ποτέ από σένα. Τα έξοδα πληρωμής με κάρτα είναι τα στάνταρ τραπεζικά έξοδα κάθε online είσπραξης, ποτέ επιπλέον χρέωση στον πελάτη. <a href=\"financement.html\">Δες όλες τις λεπτομέρειες, με παράδειγμα.</a>"
      ar: "بالنسبة لك: عمولة 0% على أطباقك، وتسجيل مجاني، في كل الحالات. الخدمة تُموَّل من <strong>مساهمة حرة من الزبون</strong>، تُضاف إلى طلبه بكل شفافية (0 € خيار وارد، وبلا إحراج) — ولا تُموَّل منك أبدًا. رسوم الدفع بالبطاقة هي الرسوم البنكية القياسية لأي تحصيل عبر الإنترنت، وليست أبدًا رسمًا إضافيًا على الزبون. <a href=\"financement.html\">اطّلع على التفاصيل كاملة، مع مثال عملي.</a>"
      he: "בשבילך: 0% עמלה על המנות, הרשמה חינם, בכל מקרה. השירות ממומן על ידי <strong>תרומה חופשית של הלקוח</strong>, שמתווספת להזמנה שלו בשקיפות מלאה (גם 0 € זה בסדר, בלי שיפוטיות) — אף פעם לא על ידך. עמלות הסליקה בכרטיס הן העמלות הבנקאיות הסטנדרטיות של כל תשלום אונליין, אף פעם לא תוספת שמגולגלת על הלקוח. <a href=\"financement.html\">לפירוט המלא, כולל דוגמה.</a>"
  faq.a2:
    messages:
      fr: "Ce qui se paie dans ta caisse habituelle (sur place, au comptoir), on n'y touche pas : c'est <strong>gratuit, point</strong>, hors de notre flux. La contribution ne concerne que les commandes <strong>payées en ligne</strong> via <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>."
      en: "Whatever goes through your usual till (on site, at the counter), we don't touch: it's <strong>free, full stop</strong> — outside our flow. The contribution only applies to orders <strong>paid online</strong> through <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>."
      es: "Lo que se paga en tu caja de siempre (en el local, en barra) no lo tocamos: es <strong>gratis, y punto</strong>, fuera de nuestro flujo. La contribución solo afecta a los pedidos <strong>pagados online</strong> vía <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>."
      it: "Quello che si paga nella tua cassa abituale (sul posto, al banco) non lo tocchiamo: è <strong>gratis, punto</strong>, fuori dal nostro flusso. Il contributo riguarda solo gli ordini <strong>pagati online</strong> tramite <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>."
      pt: "No que se paga na tua caixa habitual (no local, ao balcão), não tocamos: é <strong>grátis, ponto final</strong>, fora do nosso fluxo. A contribuição só diz respeito às encomendas <strong>pagas online</strong> via <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>."
      de: "Was in deiner gewohnten Kasse bezahlt wird (vor Ort, am Tresen), rühren wir nicht an: Das ist <strong>gratis, Punkt</strong> — außerhalb unseres Zahlungsflusses. Der Beitrag betrifft nur Bestellungen, die <strong>online</strong> über <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> bezahlt werden."
      tr: "Her zamanki kasanda ödenen her şeye (yerinde, tezgâhta) karışmayız: <strong>ücretsizdir, nokta</strong> — akışımızın dışındadır. Katkı yalnızca <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> üzerinden <strong>online ödenen</strong> siparişler içindir."
      el: "Ό,τι πληρώνεται στο ταμείο σου, όπως πάντα (επιτόπου, στον πάγκο), δεν το αγγίζουμε: είναι <strong>δωρεάν, τελεία</strong> — εκτός της ροής μας. Η συνεισφορά αφορά μόνο τις παραγγελίες που <strong>πληρώνονται online</strong> μέσω του <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>."
      ar: "ما يُدفع في صندوقك المعتاد (في المحل، عند الكاونتر) لا نمسّه: إنه <strong>مجاني، نقطة</strong>، وخارج تدفقنا تمامًا. المساهمة تخص فقط الطلبات <strong>المدفوعة أونلاين</strong> عبر <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>."
      he: "מה שמשולם בקופה הרגילה שלך (במקום, בדלפק) — אנחנו לא נוגעים בו: זה <strong>חינם, נקודה</strong>, מחוץ לזרימה שלנו. התרומה נוגעת רק להזמנות <strong>שמשולמות אונליין</strong> דרך <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>."
  faq.a3:
    messages:
      fr: "La livraison sera un <strong>canal à venir</strong>, pas encore actif. L'idée : payer correctement le livreur (on vise au moins 7 € la course). Tu y participerais uniquement sur tes commandes livrées, à hauteur de ce que ta marge permet — tu fixerais ton plancher, on ne descendrait jamais dessous. Le client paierait la différence, en transparence. Jamais une commission sur tes plats. <a href=\"livraison.html\">Voir le calcul en détail, exemple à l'appui.</a>"
      en: "Delivery will be a <strong>future channel</strong>, not active yet. The idea: pay the rider properly (we're aiming for at least €7 per ride). You'd only chip in on your delivered orders, up to what your margin allows — you'd set your floor, and we'd never go below it. The customer would pay the difference, transparently. Never a commission on your dishes. <a href=\"livraison.html\">See the math in detail, worked example included.</a>"
      es: "El reparto será un <strong>canal por llegar</strong>, aún no activo. La idea: pagar bien al repartidor (apuntamos a 7 € mínimo por carrera). Tú participarías solo en tus pedidos entregados, en la medida que tu margen permita — fijarías tu suelo y nunca bajaríamos de ahí. El cliente pagaría la diferencia, con transparencia. Nunca una comisión sobre tus platos. <a href=\"livraison.html\">Ver el cálculo en detalle, con ejemplo incluido.</a>"
      it: "La consegna sarà un <strong>canale in arrivo</strong>, non ancora attivo. L'idea: pagare bene il rider (puntiamo ad almeno 7 € a corsa). Tu parteciperesti solo sui tuoi ordini consegnati, nei limiti di quanto il tuo margine permette — fisseresti la tua soglia, e sotto non si scenderebbe mai. Il cliente pagherebbe la differenza, in trasparenza. Mai una commissione sui tuoi piatti. <a href=\"livraison.html\">Guarda il calcolo nel dettaglio, esempio alla mano.</a>"
      pt: "A entrega será um <strong>canal a chegar</strong>, ainda não ativo. A ideia: pagar corretamente ao estafeta (visamos pelo menos 7 € por corrida). Só participarias nas tuas encomendas entregues, na medida do que a tua margem permitir — fixarias o teu mínimo, e nunca desceríamos abaixo dele. O cliente pagaria a diferença, com transparência. Nunca uma comissão sobre os teus pratos. <a href=\"livraison.html\">Ver o cálculo em detalhe, com exemplo.</a>"
      de: "Die Lieferung wird ein <strong>künftiger Kanal</strong> sein, noch nicht aktiv. Die Idee: den Fahrer anständig bezahlen (wir peilen mindestens 7 € pro Fahrt an). Du würdest dich nur bei deinen gelieferten Bestellungen beteiligen — so weit, wie deine Marge es erlaubt: Du legst deine Untergrenze fest, darunter gehen wir nie. Der Gast zahlt die Differenz, ganz transparent. Nie eine Provision auf deine Gerichte. <a href=\"livraison.html\">Die Rechnung im Detail, mit Beispiel.</a>"
      tr: "Teslimat <strong>ileride gelecek bir kanal</strong>, henüz aktif değil. Fikir şu: kuryeye düzgün ödeme yapmak (sefer başına en az 7 € hedefliyoruz). Sen yalnızca teslim edilen siparişlerinde, marjının el verdiği kadar katılırdın — tabanını sen belirlerdin, altına asla inmezdik. Farkı müşteri öderdi, tam şeffaflıkla. Yemeklerinden asla komisyon alınmaz. <a href=\"livraison.html\">Hesabı örnekli ayrıntısıyla gör.</a>"
      el: "Η διανομή θα είναι <strong>κανάλι που έρχεται</strong>, όχι ακόμα ενεργό. Η ιδέα: να πληρώνεται σωστά ο διανομέας (στοχεύουμε τουλάχιστον 7 € τη διαδρομή). Εσύ θα συμμετείχες μόνο στις δικές σου παραγγελίες με διανομή, στο μέτρο που το επιτρέπει το περιθώριό σου — εσύ θα όριζες το κατώφλι σου, και δεν θα κατεβαίναμε ποτέ κάτω από αυτό. Ο πελάτης θα πλήρωνε τη διαφορά, με διαφάνεια. Ποτέ προμήθεια στα πιάτα σου. <a href=\"livraison.html\">Δες τον υπολογισμό αναλυτικά, με παράδειγμα.</a>"
      ar: "التوصيل سيكون <strong>قناة قادمة</strong>، غير نشطة بعد. الفكرة: دفع أجر عادل للسائق (نستهدف 7 € على الأقل للتوصيلة الواحدة). ستشارك فيها فقط على طلباتك الموصَّلة، وبقدر ما يسمح به هامشك — أنت من سيحدد حدّك الأدنى، ولن ننزل تحته أبدًا. والزبون سيدفع الفرق، بكل شفافية. وليست أبدًا عمولة على أطباقك. <a href=\"livraison.html\">شاهد الحساب بالتفصيل، مع مثال عملي.</a>"
      he: "המשלוח יהיה <strong>ערוץ עתידי</strong>, עוד לא פעיל. הרעיון: לשלם לשליח כמו שצריך (אנחנו שואפים ל-7 € לפחות לנסיעה). אתה תשתתף רק על ההזמנות שלך במשלוח, ורק כמה שהרווח שלך מאפשר — אתה תקבע את הרצפה שלך, ולעולם לא נרד מתחתיה. הלקוח ישלם את ההפרש, בשקיפות. אף פעם לא עמלה על המנות שלך. <a href=\"livraison.html\">לחישוב המפורט, כולל דוגמה.</a>"
  faq.a4:
    messages:
      fr: "Non. <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> vient en plus, sans exclusivité. Beaucoup de restaurants gardent les deux et voient <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> comme leur canal direct, celui qu'ils maîtrisent."
      en: "No. <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> comes on top, with no exclusivity. Many restaurants keep both and see <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> as their direct channel — the one they control."
      es: "No. <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> viene a sumar, sin exclusividad. Muchos restaurantes mantienen ambos y ven <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> como su canal directo, el que controlan ellos."
      it: "No. <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> si aggiunge, senza esclusiva. Molti ristoranti tengono entrambi e vedono <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> come il loro canale diretto, quello che controllano."
      pt: "Não. A <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> vem por acréscimo, sem exclusividade. Muitos restaurantes ficam com os dois e veem a <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> como o seu canal direto, aquele que controlam."
      de: "Nein. <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> kommt einfach dazu, ohne Exklusivität. Viele Restaurants behalten beides und sehen <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> als ihren Direktkanal — den, den sie selbst steuern."
      tr: "Hayır. <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> bunların yanına gelir, hiçbir münhasırlık yok. Birçok restoran ikisini birden tutuyor ve <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>'u kendi hâkim oldukları doğrudan kanal olarak görüyor."
      el: "Όχι. Το <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> έρχεται επιπλέον, χωρίς αποκλειστικότητα. Πολλά εστιατόρια κρατούν και τα δύο και βλέπουν το <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> ως το απευθείας κανάλι τους — αυτό που ελέγχουν."
      ar: "لا. <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> يأتي كإضافة، بدون حصرية. كثير من المطاعم تحتفظ بالاثنين وترى في <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> قناتها المباشرة، تلك التي تتحكم فيها بنفسها."
      he: "לא. <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> מגיע כתוספת, בלי בלעדיות. הרבה מסעדות שומרות על שניהם ורואות ב-<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> את הערוץ הישיר שלהן — זה שבשליטתן."
  faq.a5:
    messages:
      fr: "Parce que ça ne te coûte rien et que tu n'as aucune exclusivité à donner. Tu es référencé, tu récupères ta base clients dès tes premières commandes directes, et tu façonnes l'outil pendant qu'on démarre. Les premiers embarqués sont ceux qui pèsent le plus."
      en: "Because it costs you nothing and you give up no exclusivity. You get listed, you recover your customer base from your first direct orders, and you shape the tool while we're starting out. The first ones aboard are the ones who weigh the most."
      es: "Porque no te cuesta nada y no cedes ninguna exclusividad. Apareces en el directorio, recuperas tu base de clientes desde tus primeros pedidos directos y das forma a la herramienta mientras arrancamos. Los primeros a bordo son los que más pesan."
      it: "Perché non ti costa niente e non dai nessuna esclusiva. Sei in vetrina, recuperi la tua base clienti dai primi ordini diretti, e plasmi lo strumento mentre partiamo. I primi a salire a bordo sono quelli che contano di più."
      pt: "Porque não te custa nada e não tens nenhuma exclusividade a dar. Ficas referenciado, recuperas a tua base de clientes desde as primeiras encomendas em direto, e moldas a ferramenta enquanto arrancamos. Os primeiros a embarcar são os que mais pesam."
      de: "Weil es dich nichts kostet und du keinerlei Exklusivität abgibst. Du bist gelistet, sicherst dir ab deinen ersten Direktbestellungen deine Kundendatei und formst das Werkzeug mit, während wir starten. Wer zuerst an Bord ist, hat das meiste Gewicht."
      tr: "Çünkü sana hiçbir maliyeti yok ve verecek hiçbir münhasırlığın yok. Listeye girersin, ilk doğrudan siparişlerinden itibaren müşteri veritabanını kazanırsın ve biz yola çıkarken aracı sen şekillendirirsin. Gemiye ilk atlayanlar, en çok söz sahibi olanlardır."
      el: "Γιατί δεν σου κοστίζει τίποτα και δεν δίνεις καμία αποκλειστικότητα. Μπαίνεις στον κατάλογο, παίρνεις τη βάση πελατών σου από τις πρώτες κιόλας απευθείας παραγγελίες, και διαμορφώνεις το εργαλείο όσο ξεκινάμε. Όσοι ανέβουν πρώτοι στο πλοίο έχουν και τον μεγαλύτερο λόγο."
      ar: "لأن ذلك لا يكلفك شيئًا، ولا حصرية عليك تقديمها. تكون مدرَجًا منذ البداية، وتسترجع قاعدة زبائنك من أول طلباتك المباشرة، وتصوغ الأداة ونحن ننطلق. أوائل من يصعدون على المتن هم أصحاب الوزن الأكبر."
      he: "כי זה לא עולה לך כלום ואתה לא נותן שום בלעדיות. אתה מופיע במדריך, אתה מקבל את מאגר הלקוחות שלך כבר מההזמנות הישירות הראשונות, ואתה מעצב את הכלי בזמן שאנחנו יוצאים לדרך. הראשונים שעולים לסיפון הם אלה שמשפיעים הכי הרבה."
  faq.a6:
    messages:
      fr: "Chaque commande passée en direct sur ta page t'appartient : tu accèdes aux coordonnées de tes clients (avec leur consentement) pour les fidéliser toi-même. Contrairement aux grandes plateformes, on ne confisque pas ta clientèle."
      en: "Every order placed directly on your page belongs to you: you get access to your customers' contact details (with their consent) to build loyalty yourself. Unlike the big platforms, we don't confiscate your customer base."
      es: "Cada pedido hecho en directo en tu página te pertenece: accedes a los datos de contacto de tus clientes (con su consentimiento) para fidelizarlos tú mismo. A diferencia de las grandes plataformas, no confiscamos tu clientela."
      it: "Ogni ordine fatto direttamente sulla tua pagina ti appartiene: accedi ai contatti dei tuoi clienti (con il loro consenso) per fidelizzarli tu stesso. A differenza delle grandi piattaforme, la tua clientela non te la confischiamo."
      pt: "Cada encomenda feita em direto na tua página pertence-te: acedes aos contactos dos teus clientes (com o consentimento deles) para os fidelizares tu mesmo. Ao contrário das grandes plataformas, não confiscamos a tua clientela."
      de: "Jede Bestellung, die direkt über deine Seite läuft, gehört dir: Du bekommst Zugriff auf die Kontaktdaten deiner Gäste (mit deren Einwilligung), um sie selbst zu binden. Anders als die großen Plattformen konfiszieren wir deine Kundschaft nicht."
      tr: "Sayfanda doğrudan verilen her sipariş sana aittir: müşterilerinin iletişim bilgilerine (onların onayıyla) erişir, bağlılığı kendin kurarsın. Büyük platformların aksine, müşteri kitlene el koymayız."
      el: "Κάθε παραγγελία που γίνεται απευθείας στη σελίδα σου σού ανήκει: έχεις πρόσβαση στα στοιχεία των πελατών σου (με τη συγκατάθεσή τους) για να τους κρατήσεις κοντά μόνος σου. Σε αντίθεση με τις μεγάλες πλατφόρμες, εμείς δεν κατάσχουμε την πελατεία σου."
      ar: "كل طلب يمرّ مباشرة عبر صفحتك ملك لك: تصل إلى بيانات تواصل زبائنك (بموافقتهم) لتكسب ولاءهم بنفسك. على عكس المنصات الكبرى، نحن لا نصادر زبائنك."
      he: "כל הזמנה שמתבצעת ישירות בעמוד שלך שייכת לך: אתה מקבל גישה לפרטי הלקוחות שלך (בהסכמתם) כדי לשמר אותם בעצמך. בניגוד לפלטפורמות הגדולות, אנחנו לא מחרימים את קהל הלקוחות שלך."
  faq.a7:
    messages:
      fr: "« Entreprise solidaire d'utilité sociale » : un agrément qui encadre juridiquement la lucrativité et impose une finalité sociale. C'est le cap qu'on vise — une garantie, à terme, que <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> ne pourra pas dériver vers ce qu'on dénonce."
      en: "ESUS stands for “entreprise solidaire d'utilité sociale” — a solidarity-based social utility enterprise, a French accreditation that legally caps profit-taking and requires a social purpose. It's the course we're aiming for — a guarantee, in time, that <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> can never drift into what we denounce."
      es: "«Empresa solidaria de utilidad social», por sus siglas en francés: una acreditación legal francesa que limita jurídicamente el lucro e impone una finalidad social. Es el rumbo que nos hemos marcado — una garantía, a la larga, de que <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> no podrá derivar hacia lo que denunciamos."
      it: "«Entreprise solidaire d'utilité sociale», cioè impresa solidale di utilità sociale: un'abilitazione francese che limita giuridicamente la lucratività e impone una finalità sociale. È la rotta che puntiamo a seguire — una garanzia, col tempo, che <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> non potrà deviare verso ciò che denunciamo."
      pt: "«Empresa solidária de utilidade social»: uma acreditação legal francesa que enquadra juridicamente a lucratividade e impõe uma finalidade social. É o rumo que visamos — uma garantia, a prazo, de que a <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> não poderá derivar para aquilo que denunciamos."
      de: "„Entreprise solidaire d'utilité sociale“ — ein französischer Rechtsstatus für solidarische Unternehmen mit gesellschaftlichem Nutzen: eine staatliche Anerkennung, die Gewinnstreben rechtlich begrenzt und einen sozialen Zweck vorschreibt. Das ist der Kurs, den wir anstreben — auf Dauer eine Garantie, dass <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> nie zu dem abdriften kann, was wir anprangern."
      tr: "« Toplumsal fayda amaçlı dayanışma şirketi »: Fransa'da kâr dağıtımını yasal olarak sınırlayan ve sosyal bir amaç şart koşan bir statü. Hedeflediğimiz rota bu — <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>'un, karşı çıktığımız şeye zamanla savrulamayacağının güvencesi."
      el: "«Entreprise solidaire d'utilité sociale» — γαλλική κρατική πιστοποίηση αλληλέγγυας επιχείρησης κοινωνικής ωφέλειας: βάζει νομικά όρια στην κερδοσκοπία και επιβάλλει κοινωνικό σκοπό. Είναι η ρότα που έχουμε βάλει — μια εγγύηση, στην πορεία, ότι το <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> δεν θα μπορέσει να ξεστρατίσει προς αυτό που καταγγέλλουμε."
      ar: "«المؤسسة التضامنية ذات المنفعة الاجتماعية»: اعتماد قانوني فرنسي يقيّد الربحية ويفرض غاية اجتماعية. هذه هي الوجهة التي نستهدفها — ضمانة، على المدى البعيد، بأن <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> لن يستطيع الانحراف نحو ما نندد به."
      he: "ESUS — ״עסק סולידרי לתועלת חברתית״ — הוא מעמד משפטי צרפתי שמגביל את הרווחיות ומחייב ייעוד חברתי. זה היעד שאנחנו שואפים אליו — ערובה, בהמשך הדרך, לכך ש-<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> לא יוכל לסטות אל מה שאנחנו יוצאים נגדו."
  faq.a8:
    messages:
      fr: "Deux cas. Si le client <strong>paie en caisse</strong> ou sur place, c'est <strong>hors de notre flux</strong> : 100 % gratuit, on n'y touche pas. S'il <strong>paie en ligne</strong> via le QR, une contribution libre peut s'ajouter, comme pour une commande en ligne. Dans tous les cas, sous ton nom, et 0 commission sur tes plats."
      en: "Two cases. If the customer <strong>pays at the till</strong> or on site, it's <strong>outside our flow</strong>: 100% free, we don't touch it. If they <strong>pay online</strong> via the QR code, a pay-what-you-want contribution can be added, just like for an online order. In every case, under your name, and 0% commission on your dishes."
      es: "Dos casos. Si el cliente <strong>paga en caja</strong> o en el local, queda <strong>fuera de nuestro flujo</strong>: 100 % gratis, no lo tocamos. Si <strong>paga online</strong> vía el QR, puede añadirse una contribución libre, como en un pedido online. En todos los casos, con tu nombre, y 0 comisión sobre tus platos."
      it: "Due casi. Se il cliente <strong>paga in cassa</strong> o sul posto, è <strong>fuori dal nostro flusso</strong>: 100% gratis, non lo tocchiamo. Se <strong>paga online</strong> tramite il QR, può aggiungersi un contributo libero, come per un ordine online. In ogni caso, a tuo nome, e 0 commissioni sui tuoi piatti."
      pt: "Dois casos. Se o cliente <strong>paga na caixa</strong> ou no local, fica <strong>fora do nosso fluxo</strong>: 100% grátis, não lhe tocamos. Se <strong>paga online</strong> via QR, pode acrescentar-se uma contribuição livre, como numa encomenda online. Em qualquer caso, com o teu nome, e 0 comissão sobre os teus pratos."
      de: "Zwei Fälle. Zahlt der Gast <strong>an der Kasse</strong> oder vor Ort, ist das <strong>außerhalb unseres Zahlungsflusses</strong>: 100 % gratis, wir rühren es nicht an. Zahlt er <strong>online</strong> über den QR-Code, kann wie bei einer Online-Bestellung ein freiwilliger Beitrag dazukommen. In jedem Fall: unter deinem Namen, und 0 % Provision auf deine Gerichte."
      tr: "İki durum var. Müşteri <strong>kasada</strong> ya da yerinde ödüyorsa, bu <strong>akışımızın dışındadır</strong>: %100 ücretsiz, karışmayız. QR üzerinden <strong>online ödüyorsa</strong>, tıpkı bir online siparişte olduğu gibi gönüllü bir katkı eklenebilir. Her durumda senin adınla ve yemeklerinde 0 komisyon."
      el: "Δύο περιπτώσεις. Αν ο πελάτης <strong>πληρώνει στο ταμείο</strong> ή επιτόπου, είναι <strong>εκτός της ροής μας</strong>: 100 % δωρεάν, δεν το αγγίζουμε. Αν <strong>πληρώνει online</strong> μέσω του QR, μπορεί να προστεθεί μια ελεύθερη συνεισφορά, όπως σε κάθε online παραγγελία. Σε κάθε περίπτωση, με το όνομά σου, και 0 προμήθεια στα πιάτα σου."
      ar: "حالتان. إذا <strong>دفع الزبون في الصندوق</strong> أو في المحل، فهذا <strong>خارج تدفقنا</strong>: مجاني 100%، ولا نمسّه. أما إذا <strong>دفع أونلاين</strong> عبر رمز QR، فقد تُضاف مساهمة حرة، كما في أي طلب أونلاين. وفي كل الحالات، باسمك أنت، وعمولة 0% على أطباقك."
      he: "שני מצבים. אם הלקוח <strong>משלם בקופה</strong> או במקום, זה <strong>מחוץ לזרימה שלנו</strong>: 100% חינם, אנחנו לא נוגעים בזה. אם הוא <strong>משלם אונליין</strong> דרך ה-QR, תרומה חופשית יכולה להתווסף, כמו בהזמנה אונליין. בכל מקרה — על שמך, ו-0 עמלה על המנות שלך."
  faq.img_alt:
    messages:
      fr: "Le Capitaine Food, l'index sur la tempe, invite à réfléchir aux questions"
      en: "Captain Food, finger to his temple, inviting you to think it over"
      es: "El Capitán Food, con el índice en la sien, invita a reflexionar sobre las preguntas"
      it: "Il Capitan Food, con l'indice sulla tempia, invita a riflettere sulle domande"
      pt: "O Capitão Food, com o indicador na têmpora, convida a refletir sobre as perguntas"
      de: "Captain Food, den Zeigefinger an der Schläfe, lädt zum Nachdenken über die Fragen ein"
      tr: "Kaptan Food, işaret parmağı şakağında, soruları düşünmeye davet ediyor"
      el: "Ο Captain Food, με τον δείκτη στον κρόταφο, σε καλεί να σκεφτείς τις ερωτήσεις"
      ar: "الكابتن فود واضعًا سبابته على صدغه، يدعوك للتفكير في الأسئلة"
      he: "קפטן פוד, אצבע על הרקה, מזמין לחשוב על השאלות"
  faq.intro:
    messages:
      fr: "Tout ce que les restaurateurs nous demandent — en clair, sans détour."
      en: "Everything restaurateurs ask us — in plain words, no dodging."
      es: "Todo lo que los hosteleros nos preguntan — claro y sin rodeos."
      it: "Tutto quello che i ristoratori ci chiedono — in chiaro, senza giri di parole."
      pt: "Tudo o que os restauradores nos perguntam — às claras, sem rodeios."
      de: "Alles, was Gastronomen uns fragen — klar und ohne Umschweife."
      tr: "Restorancıların bize sorduğu her şey — açık açık, lafı dolandırmadan."
      el: "Όλα όσα μας ρωτούν οι εστιάτορες — καθαρά, χωρίς περιστροφές."
      ar: "كل ما يسألنا عنه أصحاب المطاعم — بوضوح وبلا مواربة."
      he: "כל מה שמסעדנים שואלים אותנו — ברור, בלי סיבובים."
  faq.q1:
    messages:
      fr: "C'est gratuit pour moi — et vous vivez de quoi ?"
      en: "It's free for me — so what do you live on?"
      es: "Es gratis para mí — ¿y vosotros de qué vivís?"
      it: "Per me è gratis — e voi di cosa vivete?"
      pt: "É grátis para mim — então vivem de quê?"
      de: "Für mich ist es gratis — und wovon lebt ihr?"
      tr: "Benim için ücretsiz — peki siz neyle geçiniyorsunuz?"
      el: "Για μένα είναι δωρεάν — κι εσείς από τι ζείτε;"
      ar: "مجاني بالنسبة لي — إذن ممّ تعيشون؟"
      he: "זה חינם בשבילי — אז ממה אתם חיים?"
  faq.q2:
    messages:
      fr: "Et ce que mes clients paient en caisse ?"
      en: "What about what my customers pay at the till?"
      es: "¿Y lo que mis clientes pagan en caja?"
      it: "E quello che i miei clienti pagano in cassa?"
      pt: "E o que os meus clientes pagam na caixa?"
      de: "Und was meine Gäste an der Kasse zahlen?"
      tr: "Peki müşterilerimin kasada ödediği?"
      el: "Και αυτά που πληρώνουν οι πελάτες μου στο ταμείο;"
      ar: "وماذا عمّا يدفعه زبائني في الصندوق؟"
      he: "ומה עם מה שהלקוחות שלי משלמים בקופה?"
  faq.q3:
    messages:
      fr: "Et le coût de la livraison, qui le paiera ?"
      en: "And the cost of delivery — who'll pay for it?"
      es: "¿Y el coste del reparto, quién lo pagará?"
      it: "E il costo della consegna, chi lo pagherà?"
      pt: "E o custo da entrega, quem o vai pagar?"
      de: "Und die Lieferkosten — wer zahlt die?"
      tr: "Ya teslimat maliyeti — onu kim ödeyecek?"
      el: "Και το κόστος της διανομής, ποιος θα το πληρώνει;"
      ar: "وتكلفة التوصيل، من سيدفعها؟"
      he: "ועלות המשלוח, מי ישלם אותה?"
  faq.q4:
    messages:
      fr: "Je dois quitter Uber Eats / Deliveroo ?"
      en: "Do I have to leave Uber Eats / Deliveroo?"
      es: "¿Tengo que dejar Uber Eats / Deliveroo?"
      it: "Devo lasciare Uber Eats / Deliveroo?"
      pt: "Tenho de deixar o Uber Eats / Deliveroo?"
      de: "Muss ich Uber Eats / Deliveroo verlassen?"
      tr: "Uber Eats / Deliveroo'dan çıkmam mı gerekiyor?"
      el: "Πρέπει να φύγω από Uber Eats / Deliveroo;"
      ar: "هل يجب أن أغادر Uber Eats / Deliveroo؟"
      he: "אני חייב לעזוב את Uber Eats / Deliveroo?"
  faq.q5:
    messages:
      fr: "Il n'y a pas encore de clients sur la plateforme, pourquoi m'inscrire maintenant ?"
      en: "There are no customers on the platform yet — why sign up now?"
      es: "Todavía no hay clientes en la plataforma, ¿por qué apuntarme ya?"
      it: "Non ci sono ancora clienti sulla piattaforma: perché iscrivermi adesso?"
      pt: "Ainda não há clientes na plataforma, porquê inscrever-me agora?"
      de: "Es gibt noch keine Gäste auf der Plattform — warum sollte ich mich jetzt anmelden?"
      tr: "Platformda henüz müşteri yok, neden şimdi kaydolayım?"
      el: "Δεν υπάρχουν ακόμα πελάτες στην πλατφόρμα — γιατί να γραφτώ τώρα;"
      ar: "لا يوجد زبائن على المنصة بعد، فلماذا أسجّل الآن؟"
      he: "עוד אין לקוחות בפלטפורמה, למה להירשם עכשיו?"
  faq.q6:
    messages:
      fr: "Comment je récupère mes clients ?"
      en: "How do I get my customers back?"
      es: "¿Cómo recupero a mis clientes?"
      it: "Come recupero i miei clienti?"
      pt: "Como é que recupero os meus clientes?"
      de: "Wie komme ich an meine Gäste?"
      tr: "Müşterilerimi nasıl geri kazanırım?"
      el: "Πώς παίρνω πίσω τους πελάτες μου;"
      ar: "كيف أسترجع زبائني؟"
      he: "איך אני מקבל את הלקוחות שלי?"
  faq.q7:
    messages:
      fr: "C'est quoi, une entreprise ESUS ?"
      en: "What's an ESUS company?"
      es: "¿Qué es eso de una empresa ESUS?"
      it: "Cos'è un'impresa ESUS?"
      pt: "O que é uma empresa ESUS?"
      de: "Was ist ein ESUS-Unternehmen?"
      tr: "ESUS şirketi ne demek?"
      el: "Τι είναι μια επιχείρηση ESUS;"
      ar: "ما معنى مؤسسة ESUS؟"
      he: "מה זה בכלל עסק ESUS?"
  faq.q8:
    messages:
      fr: "Et pour la commande à table (QR code) ?"
      en: "What about ordering at the table (QR code)?"
      es: "¿Y el pedido en mesa (código QR)?"
      it: "E per l'ordine al tavolo (QR code)?"
      pt: "E a encomenda à mesa (código QR)?"
      de: "Und die Bestellung am Tisch (QR-Code)?"
      tr: "Peki masada sipariş (QR kod)?"
      el: "Και για την παραγγελία στο τραπέζι (QR code);"
      ar: "وماذا عن الطلب على الطاولة (رمز QR)؟"
      he: "ומה עם הזמנה ליד השולחן (QR)?"
  faq.title:
    messages:
      fr: "Les questions qu'on nous pose"
      en: "The questions we get asked"
      es: "Las preguntas que nos hacen"
      it: "Le domande che ci fanno"
      pt: "As perguntas que nos fazem"
      de: "Die Fragen, die man uns stellt"
      tr: "Bize sorulan sorular"
      el: "Οι ερωτήσεις που μας κάνουν"
      ar: "الأسئلة التي تصلنا"
      he: "השאלות ששואלים אותנו"

  # ---- feature ----
  feature.clients_body:
    messages:
      fr: "Dès la première commande en direct, tu accèdes à ta base clients — pour les fidéliser et les faire revenir. C'est à toi."
      en: "From the very first direct order, you get access to your customer base — to build loyalty and bring them back. It's yours."
      es: "Desde el primer pedido directo, accedes a tu base de clientes — para fidelizarlos y hacer que vuelvan. Es tuya."
      it: "Dal primo ordine diretto, accedi alla tua base clienti — per fidelizzarli e farli tornare. È tua."
      pt: "Desde a primeira encomenda em direto, acedes à tua base de clientes — para os fidelizar e os fazer voltar. É tua."
      de: "Ab der ersten Direktbestellung hast du Zugriff auf deine Kundendatei — um Stammgäste zu binden und sie zurückzuholen. Sie gehört dir."
      tr: "İlk doğrudan siparişten itibaren müşteri veritabanına erişirsin — onlarla bağ kurmak ve geri getirmek için. Bu senin."
      el: "Από την πρώτη απευθείας παραγγελία, έχεις πρόσβαση στη βάση πελατών σου — για να τους κρατήσεις κοντά και να τους ξαναφέρεις. Είναι δική σου."
      ar: "من أول طلب مباشر، تصل إلى قاعدة زبائنك — لتكسب ولاءهم وتجعلهم يعودون. إنها ملكك."
      he: "מההזמנה הישירה הראשונה יש לך גישה למאגר הלקוחות שלך — כדי לשמר אותם ולהחזיר אותם. זה שלך."
  feature.clients_title:
    messages:
      fr: "Ta clientèle t'appartient."
      en: "Your customer base belongs to you."
      es: "Tu clientela te pertenece."
      it: "La tua clientela appartiene a te."
      pt: "A tua clientela pertence-te."
      de: "Deine Gäste gehören dir."
      tr: "Müşteri kitlen sana ait."
      el: "Η πελατεία σου σού ανήκει."
      ar: "زبائنك ملك لك."
      he: "קהל הלקוחות שייך לך."
  feature.commission_body:
    messages:
      fr: "Tu gardes 100 % du prix de ce que tu vends. Toujours."
      en: "You keep 100% of the price of what you sell. Always."
      es: "Te quedas con el 100 % del precio de lo que vendes. Siempre."
      it: "Tieni il 100% del prezzo di quello che vendi. Sempre."
      pt: "Ficas com 100% do preço do que vendes. Sempre."
      de: "Du behältst 100 % vom Preis dessen, was du verkaufst. Immer."
      tr: "Sattığın her şeyin fiyatının %100'ü sende kalır. Her zaman."
      el: "Κρατάς το 100 % της τιμής όσων πουλάς. Πάντα."
      ar: "تحتفظ بـ100% من سعر ما تبيعه. دائمًا."
      he: "אתה שומר 100% מהמחיר של מה שאתה מוכר. תמיד."
  feature.commission_title:
    messages:
      fr: "0 % de commission sur tes plats."
      en: "0% commission on your dishes."
      es: "0 % de comisión sobre tus platos."
      it: "0% di commissioni sui tuoi piatti."
      pt: "0% de comissão sobre os teus pratos."
      de: "0 % Provision auf deine Gerichte."
      tr: "Yemeklerinde %0 komisyon."
      el: "0 % προμήθεια στα πιάτα σου."
      ar: "عمولة 0% على أطباقك."
      he: "0% עמלה על המנות שלך."
  feature.prices_body:
    messages:
      fr: "Les mêmes prix qu'en salle. Rien à gonfler, rien à cacher."
      en: "The same prices as dine-in. Nothing to inflate, nothing to hide."
      es: "Los mismos precios que en sala. Nada que hinchar, nada que esconder."
      it: "Gli stessi prezzi che in sala. Niente da gonfiare, niente da nascondere."
      pt: "Os mesmos preços da sala. Nada a inflacionar, nada a esconder."
      de: "Dieselben Preise wie im Lokal. Nichts aufblasen, nichts verstecken."
      tr: "Salondakiyle aynı fiyatlar. Şişirecek bir şey yok, saklayacak bir şey yok."
      el: "Οι ίδιες τιμές με του μαγαζιού. Τίποτα να φουσκώσεις, τίποτα να κρύψεις."
      ar: "الأسعار نفسها كما في الصالة. لا شيء ترفعه، ولا شيء تخفيه."
      he: "אותם מחירים כמו במסעדה. אין מה לנפח, אין מה להסתיר."
  feature.prices_title:
    messages:
      fr: "Tes prix, sans double carte."
      en: "Your prices, no double menu."
      es: "Tus precios, sin carta doble."
      it: "I tuoi prezzi, senza doppio listino."
      pt: "Os teus preços, sem menus a dobrar."
      de: "Deine Preise, ohne doppelte Karte."
      tr: "Fiyatların, çift menü derdi olmadan."
      el: "Οι τιμές σου, χωρίς διπλό τιμοκατάλογο."
      ar: "أسعارك، بدون قائمة مزدوجة."
      he: "המחירים שלך, בלי תפריט כפול."
  feature.site_body:
    messages:
      fr: "Pas une fiche noyée dans l'annuaire d'un autre : un vrai site de commande à toi, <code>tonresto.captain.food</code>, ta vitrine en ligne. Inclus. (Ton propre domaine <code>tonresto.fr</code> ? On te le met en place, en option.)"
      en: "Not a listing drowned in someone else's directory: a real ordering site of your own, <code>yourresto.captain.food</code>, your online storefront. Included. (Want your own domain, <code>yourresto.fr</code>? We'll set it up for you, as an option.)"
      es: "No una ficha perdida en el directorio de otro: una web de pedidos de verdad, tuya, <code>turesto.captain.food</code>, tu escaparate online. Incluida. (¿Tu propio dominio <code>turesto.fr</code>? Te lo montamos, como opción.)"
      it: "Non una scheda affogata nell'elenco di qualcun altro: un vero sito di ordini tutto tuo, <code>iltuoristorante.captain.food</code>, la tua vetrina online. Incluso. (Vuoi il tuo dominio <code>iltuoristorante.fr</code>? Te lo configuriamo noi, come opzione.)"
      pt: "Nada de seres uma ficha afogada no diretório de outro: um verdadeiro site de encomendas teu, <code>oteuresto.captain.food</code>, a tua montra online. Incluído. (O teu próprio domínio <code>oteuresto.fr</code>? Configuramo-lo por ti, como opção.)"
      de: "Kein Eintrag, der im Verzeichnis eines anderen untergeht: eine echte, eigene Bestell-Website, <code>deinresto.captain.food</code>, deine Online-Vitrine. Inklusive. (Deine eigene Domain <code>deinresto.fr</code>? Richten wir dir ein, optional.)"
      tr: "Başkasının rehberinde kaybolan bir kart değil: sana ait gerçek bir sipariş sitesi, <code>restoranin.captain.food</code> — online vitrinin. Dahil. (Kendi alan adın <code>restoranin.fr</code> mi olsun? İstersen onu da biz kurarız, opsiyonel.)"
      el: "Όχι μια καταχώριση χαμένη στον κατάλογο κάποιου άλλου: ένα πραγματικό site παραγγελιών, δικό σου, <code>toestiatoriosou.captain.food</code>, η online βιτρίνα σου. Περιλαμβάνεται. (Δικό σου domain <code>toestiatoriosou.fr</code>; Σ' το στήνουμε, προαιρετικά.)"
      ar: "ليست بطاقة تعريف غارقة في دليل غيرك: موقع طلب حقيقي خاص بك، <code>matamak.captain.food</code>، واجهتك على الإنترنت. مشمول في الخدمة. (تريد نطاقك الخاص <code>matamak.fr</code>؟ نجهّزه لك، كخيار إضافي.)"
      he: "לא עוד כרטיס שטובע במדריך של מישהו אחר: אתר הזמנות אמיתי משלך, <code>hamisada.captain.food</code>, חלון הראווה שלך אונליין. כלול במחיר. (רוצה דומיין משלך, <code>hamisada.fr</code>? נקים לך אותו, כאופציה.)"
