      en: "0% on your dishes, always. Your margin stays in your pocket — not a platform's."
      es: "0 % sobre tus platos, siempre. Tu margen se queda en tu bolsillo — no en el de una plataforma."
      it: "0% sui tuoi piatti, sempre. Il tuo margine resta nelle tue tasche — non in quelle di una piattaforma."
      pt: "0% sobre os teus pratos, sempre. A tua margem fica no teu bolso — não no de uma plataforma."
      de: "0 % auf deine Gerichte, immer. Deine Marge bleibt in deiner Tasche — nicht in der einer Plattform."
      tr: "Yemeklerinde %0, her zaman. Marjın senin cebinde kalır — bir platformun cebinde değil."
      el: "0 % στα πιάτα σου, πάντα. Το περιθώριό σου μένει στην τσέπη σου — όχι στην τσέπη μιας πλατφόρμας."
      ar: "0% على أطباقك، دائمًا. هامشك يبقى في جيبك — لا في جيب منصة."
      he: "0% על המנות שלך, תמיד. הרווח נשאר בכיס שלך — לא בכיס של פלטפורמה."
  combat.title:
    messages:
      fr: "La commission ? On la met à terre."
      en: "The commission? We're taking it down."
      es: "¿La comisión? La mandamos a pique."
      it: "La commissione? La mettiamo al tappeto."
      pt: "A comissão? Vamos deitá-la ao chão."
      de: "Die Provision? Die strecken wir nieder."
      tr: "Komisyon mu? Yere seriyoruz."
      el: "Η προμήθεια; Την ξαπλώνουμε κάτω."
      ar: "العمولة؟ نطرحها أرضًا."
      he: "העמלה? שולחים אותה לקרשים."

  # ---- esus ----
  esus.eyebrow:
    messages:
      fr: "Un cap qui ne dérive pas"
      en: "A course that won't drift"
      es: "Un rumbo que no se desvía"
      it: "Una rotta che non devia"
      pt: "Um rumo que não deriva"
      de: "Ein Kurs, der nicht abdriftet"
      tr: "Sapmayan bir rota"
      el: "Μια ρότα που δεν ξεστρατίζει"
      ar: "وجهة لا تنحرف"
      he: "כיוון שלא נסחף עם הזרם"
  esus.p1:
    messages:
      fr: "<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> part d'une conviction simple : le numérique doit être un <strong>outil d'utilité publique</strong>, pas un péage aux mains de quelques géants de la tech. Le problème n'est pas qu'ils gagnent de l'argent — c'est qu'une fois que tu en dépends, ils peuvent presser, et rien ne les en empêche."
      en: "<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> starts from a simple conviction: digital tools should serve the <strong>public good</strong>, not be a tollbooth in the hands of a few tech giants. The problem isn't that they make money — it's that once you depend on them, they can squeeze, and nothing stops them."
      es: "<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> parte de una convicción simple: lo digital debe ser una <strong>herramienta de utilidad pública</strong>, no un peaje en manos de unos cuantos gigantes tecnológicos. El problema no es que ganen dinero — es que, en cuanto dependes de ellos, pueden apretar, y nada se lo impide."
      it: "<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> parte da una convinzione semplice: il digitale deve essere uno <strong>strumento di utilità pubblica</strong>, non un casello nelle mani di pochi giganti della tech. Il problema non è che guadagnino — è che una volta che dipendi da loro, possono spremerti, e niente glielo impedisce."
      pt: "A <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> parte de uma convicção simples: o digital deve ser uma <strong>ferramenta de utilidade pública</strong>, não uma portagem nas mãos de meia dúzia de gigantes tecnológicos. O problema não é ganharem dinheiro — é que, quando dependes deles, podem apertar, e nada os impede."
      de: "<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> beruht auf einer einfachen Überzeugung: Das Digitale muss ein <strong>Werkzeug im Dienst der Allgemeinheit</strong> sein, keine Mautstelle in den Händen einiger Tech-Giganten. Das Problem ist nicht, dass sie Geld verdienen — sondern dass sie, sobald du von ihnen abhängst, den Druck erhöhen können. Und nichts hält sie davon ab."
      tr: "<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> basit bir inançtan yola çıkıyor: dijital dünya bir <strong>kamu yararı aracı</strong> olmalı, birkaç teknoloji devinin elindeki bir gişe değil. Sorun para kazanmaları değil — onlara bağımlı hale geldiğinde seni sıkıştırabilmeleri ve onları durduracak hiçbir şeyin olmaması."
      el: "Το <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> ξεκινάει από μια απλή πεποίθηση: η τεχνολογία πρέπει να είναι <strong>εργαλείο δημόσιας ωφέλειας</strong>, όχι διόδια στα χέρια λίγων κολοσσών της tech. Το πρόβλημα δεν είναι ότι βγάζουν λεφτά — είναι ότι, μόλις εξαρτηθείς από αυτούς, μπορούν να σε στύψουν, και τίποτα δεν τους εμποδίζει."
      ar: "<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> ينطلق من قناعة بسيطة: يجب أن يكون العالم الرقمي <strong>أداة نفع عام</strong>، لا بوابة رسوم بيد حفنة من عمالقة التكنولوجيا. المشكلة ليست في أنهم يكسبون المال — بل في أنك حين تعتمد عليهم، يمكنهم الضغط عليك، ولا شيء يمنعهم."
      he: "<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> נולד מתוך אמונה פשוטה: הדיגיטל צריך להיות <strong>כלי לתועלת הציבור</strong>, לא מחסום גבייה בידיים של כמה ענקיות טק. הבעיה היא לא שהן מרוויחות כסף — אלא שברגע שאתה תלוי בהן, הן יכולות לסחוט, ואין שום דבר שעוצר אותן."
  esus.p2:
    messages:
      fr: "Alors on se donne des garde-fous qui tiendront. On vise l'agrément d'<strong>entreprise solidaire d'utilité sociale (ESUS)</strong> — un cadre juridique qui encadre la lucrativité et la raison d'être — avec pour cap une <strong>coopérative (SCIC)</strong>, où restaurateurs, livreurs et citoyens auront voix au chapitre. L'objectif : par construction, ne pas pouvoir devenir ce qu'on combat."
      en: "So we're building in safeguards that will hold. We're aiming for accreditation as a <strong>solidarity-based social utility enterprise (ESUS, a French legal status)</strong> — a legal framework that caps profit-taking and locks in the mission — with a <strong>cooperative (SCIC)</strong> as our destination, where restaurateurs, riders and citizens will have a say. The goal: to be, by design, unable to become what we're fighting."
      es: "Así que nos ponemos salvaguardas que aguanten. Aspiramos a la acreditación de <strong>empresa solidaria de utilidad social (ESUS, un estatuto legal francés)</strong> — un marco jurídico que limita el lucro y fija la razón de ser — con rumbo a una <strong>cooperativa (SCIC, la cooperativa de interés colectivo francesa)</strong>, donde hosteleros, repartidores y ciudadanos tendrán voz y voto. El objetivo: que, por construcción, no podamos convertirnos en lo que combatimos."
      it: "Allora ci diamo dei paletti destinati a reggere. Puntiamo all'abilitazione <strong>ESUS («entreprise solidaire d'utilité sociale», impresa solidale di utilità sociale — uno status giuridico francese)</strong> — un quadro che limita la lucratività e vincola la missione — con rotta verso una <strong>cooperativa (SCIC, la cooperativa di interesse collettivo francese)</strong>, dove ristoratori, rider e cittadini avranno voce in capitolo. L'obiettivo: per costruzione, non poter diventare ciò che combattiamo."
      pt: "Por isso, criamos salvaguardas feitas para durar. Visamos a acreditação de <strong>empresa solidária de utilidade social (ESUS)</strong> — um estatuto legal francês que limita a lucratividade e fixa a razão de ser — com rumo a uma <strong>cooperativa (SCIC)</strong>, uma cooperativa de interesse coletivo, também um estatuto francês, onde restauradores, estafetas e cidadãos terão voz. O objetivo: por construção, não podermos tornar-nos naquilo que combatemos."
      de: "Also geben wir uns Leitplanken, die halten. Wir streben die Anerkennung als <strong>„entreprise solidaire d'utilité sociale“ (ESUS) — ein französischer Rechtsstatus für solidarische Unternehmen mit gesellschaftlichem Nutzen</strong> an, ein Rahmen, der Gewinnstreben und Daseinszweck rechtlich begrenzt — mit Kurs auf eine <strong>Genossenschaft (SCIC, die französische Rechtsform der Mehrparteien-Genossenschaft)</strong>, in der Gastronomen, Fahrer und Bürger mitbestimmen. Das Ziel: von Grund auf so gebaut sein, dass wir nie das werden können, was wir bekämpfen."
      tr: "Bu yüzden kendimize kalıcı emniyet halatları bağlıyoruz. Hedefimiz <strong>toplumsal fayda amaçlı dayanışma şirketi (ESUS)</strong> statüsü — kâr dağıtımını ve varoluş amacını çerçeveye bağlayan bir Fransız yasal statüsü — ve rotamız bir <strong>kooperatif (SCIC)</strong>: restorancıların, kuryelerin ve yurttaşların söz sahibi olacağı bir yapı. Amaç: yapısı gereği, karşısında durduğumuz şeye dönüşememek."
      el: "Γι' αυτό βάζουμε δικλείδες που θα αντέξουν. Στοχεύουμε στην πιστοποίηση <strong>ESUS (entreprise solidaire d'utilité sociale — γαλλικό νομικό καθεστώς αλληλέγγυας επιχείρησης κοινωνικής ωφέλειας)</strong>, ένα πλαίσιο που βάζει όρια στην κερδοσκοπία και δεσμεύει τον σκοπό, με ρότα προς έναν <strong>συνεταιρισμό (SCIC, γαλλικό συνεταιριστικό νομικό καθεστώς)</strong>, όπου εστιάτορες, διανομείς και πολίτες θα έχουν λόγο. Ο στόχος: εκ κατασκευής, να μην μπορούμε να γίνουμε αυτό που πολεμάμε."
      ar: "لذلك نضع لأنفسنا ضمانات صامدة. نستهدف اعتماد <strong>المؤسسة التضامنية ذات المنفعة الاجتماعية (ESUS)</strong> — وهو وضع قانوني فرنسي يقيّد الربحية ويحدد الغاية — ووجهتنا <strong>تعاونية (SCIC)</strong>، شكل تعاوني فرنسي يمنح أصحاب المطاعم والسائقين والمواطنين صوتًا في القرار. الهدف: أن يستحيل علينا، بحكم البناء نفسه، أن نصبح ما نحاربه."
      he: "אז אנחנו קובעים לעצמנו מעקות בטיחות שיחזיקו מעמד. אנחנו שואפים להכרה כ<strong>עסק סולידרי לתועלת חברתית (ESUS)</strong> — מעמד משפטי צרפתי שמגביל את הרווחיות ומעגן את הייעוד — כשהיעד הוא <strong>קואופרטיב (SCIC, מעמד קואופרטיבי צרפתי)</strong>, שבו למסעדנים, לשליחים ולאזרחים יהיה קול. המטרה: שמעצם המבנה, לא נוכל להפוך למה שאנחנו נלחמים בו."
  esus.p3:
    messages:
      fr: "Et pour que tu n'aies pas à nous croire sur parole : on ouvre nos comptes en public sur <a href=\"https://opencollective.com/captain-food\" target=\"_blank\" rel=\"noopener\">Open Collective</a> — chaque euro reçu et dépensé, destiné à être visible par tous. La transparence radicale, pas le slogan."
      en: "And so you don't have to take our word for it: we're opening our books in public on <a href=\"https://opencollective.com/captain-food\" target=\"_blank\" rel=\"noopener\">Open Collective</a> — every euro received and spent, meant to be visible to everyone. Radical transparency, not a slogan."
      es: "Y para que no tengas que fiarte de nuestra palabra: abrimos nuestras cuentas en público en <a href=\"https://opencollective.com/captain-food\" target=\"_blank\" rel=\"noopener\">Open Collective</a> — cada euro recibido y gastado, pensado para que lo vea todo el mundo. Transparencia radical, no un eslogan."
      it: "E perché tu non debba crederci sulla parola: apriamo i nostri conti in pubblico su <a href=\"https://opencollective.com/captain-food\" target=\"_blank\" rel=\"noopener\">Open Collective</a> — ogni euro ricevuto e speso, destinato a essere visibile da tutti. Trasparenza radicale, non uno slogan."
      pt: "E para não teres de acreditar só na nossa palavra: abrimos as nossas contas em público no <a href=\"https://opencollective.com/captain-food\" target=\"_blank\" rel=\"noopener\">Open Collective</a> — cada euro recebido e gasto, destinado a ser visível por todos. Transparência radical, não um slogan."
      de: "Und damit du uns nicht einfach glauben musst: Wir legen unsere Konten öffentlich auf <a href=\"https://opencollective.com/captain-food\" target=\"_blank\" rel=\"noopener\">Open Collective</a> offen — jeder eingenommene und jeder ausgegebene Euro, einsehbar für alle. Radikale Transparenz, kein Slogan."
      tr: "Bize sözde güvenmek zorunda kalma diye: hesaplarımızı <a href=\"https://opencollective.com/captain-food\" target=\"_blank\" rel=\"noopener\">Open Collective</a> üzerinde kamuya açıyoruz — alınan ve harcanan her euro herkes tarafından görülebilsin diye. Radikal şeffaflık; slogan değil."
      el: "Και για να μη χρειάζεται να μας πιστέψεις στον λόγο μας: ανοίγουμε τα βιβλία μας δημόσια στο <a href=\"https://opencollective.com/captain-food\" target=\"_blank\" rel=\"noopener\">Open Collective</a> — κάθε ευρώ που μπαίνει και βγαίνει, φτιαγμένο για να το βλέπουν όλοι. Ριζική διαφάνεια, όχι σλόγκαν."
      ar: "وحتى لا تضطر إلى تصديقنا على الكلام: نفتح حساباتنا للعموم على <a href=\"https://opencollective.com/captain-food\" target=\"_blank\" rel=\"noopener\">Open Collective</a> — كل يورو نستلمه وننفقه، معدّ ليكون مرئيًا للجميع. شفافية جذرية، لا شعارات."
      he: "וכדי שלא תצטרך להאמין לנו על סמך מילה: אנחנו פותחים את החשבונות שלנו לציבור ב-<a href=\"https://opencollective.com/captain-food\" target=\"_blank\" rel=\"noopener\">Open Collective</a> — כל יורו שנכנס ויוצא, מיועד להיות גלוי לכולם. שקיפות רדיקלית, לא סיסמה."
  esus.p4:
    messages:
      fr: "Notre horizon : que <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> soit un <strong>bien commun numérique</strong>, pas un actif privé. <strong>Le code est ouvert</strong> — <a href=\"https://github.com/TheCaptainCompany/captain-food\" target=\"_blank\" rel=\"noopener\">sur GitHub</a> — sous licence <strong><span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> Coopyleft</strong> (copyleft basé sur l'AGPL v3, dans l'esprit de CoopCycle), dont l'usage commercial est réservé aux structures de l'<strong>économie sociale et solidaire</strong> — coopératives et organisations à but non lucratif. Notre cap : le faire reconnaître comme <strong>bien public numérique</strong> <em>(digital public good)</em> — pour qu'il soit vérifiable, et surtout <strong>réplicable</strong> : d'autres villes, d'autres coopératives pourront le reprendre. Un outil d'intérêt général, ça se partage — ça ne se revend pas. <a href=\"manifeste.html\">Lire le manifeste →</a>"
      en: "Our horizon: for <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> to be a <strong>digital commons</strong>, not a private asset. <strong>The code is open</strong> — <a href=\"https://github.com/TheCaptainCompany/captain-food\" target=\"_blank\" rel=\"noopener\">on GitHub</a> — under the <strong><span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> Coopyleft</strong> license (a copyleft based on AGPL v3, in the spirit of CoopCycle), whose commercial use is reserved for <strong>social and solidarity economy</strong> structures — cooperatives and non-profits. Our course: getting it recognized as a <strong>digital public good</strong> <em>(DPG)</em> — so it's verifiable, and above all <strong>replicable</strong>: other cities, other cooperatives will be able to take it up. A tool for the common good is meant to be shared — not sold off. <a href=\"manifeste.html\">Read the manifesto →</a>"
      es: "Nuestro horizonte: que <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> sea un <strong>bien común digital</strong>, no un activo privado. <strong>El código es abierto</strong> — <a href=\"https://github.com/TheCaptainCompany/captain-food\" target=\"_blank\" rel=\"noopener\">en GitHub</a> — bajo licencia <strong><span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> Coopyleft</strong> (copyleft basado en la AGPL v3, en el espíritu de CoopCycle), cuyo uso comercial queda reservado a las estructuras de la <strong>economía social y solidaria</strong> — cooperativas y organizaciones sin ánimo de lucro. Nuestro rumbo: lograr que se reconozca como <strong>bien público digital</strong> <em>(digital public good)</em> — para que sea verificable y, sobre todo, <strong>replicable</strong>: otras ciudades, otras cooperativas podrán retomarlo. Una herramienta de interés general se comparte — no se revende. <a href=\"manifeste.html\">Leer el manifiesto →</a>"
      it: "Il nostro orizzonte: che <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> sia un <strong>bene comune digitale</strong>, non un asset privato. <strong>Il codice è aperto</strong> — <a href=\"https://github.com/TheCaptainCompany/captain-food\" target=\"_blank\" rel=\"noopener\">su GitHub</a> — con licenza <strong><span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> Coopyleft</strong> (copyleft basato su AGPL v3, nello spirito di CoopCycle), il cui uso commerciale è riservato alle realtà dell'<strong>economia sociale e solidale</strong> — cooperative e organizzazioni no profit. La nostra rotta: farlo riconoscere come <strong>bene pubblico digitale</strong> <em>(digital public good)</em> — perché sia verificabile e soprattutto <strong>replicabile</strong>: altre città, altre cooperative potranno riprenderlo. Uno strumento d'interesse generale si condivide — non si rivende. <a href=\"manifeste.html\">Leggi il manifesto →</a>"
      pt: "O nosso horizonte: que a <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> seja um <strong>bem comum digital</strong>, não um ativo privado. <strong>O código é aberto</strong> — <a href=\"https://github.com/TheCaptainCompany/captain-food\" target=\"_blank\" rel=\"noopener\">no GitHub</a> — sob a licença <strong><span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> Coopyleft</strong> (copyleft baseado na AGPL v3, no espírito da CoopCycle), cujo uso comercial está reservado às estruturas da <strong>economia social e solidária</strong> — cooperativas e organizações sem fins lucrativos. O nosso rumo: fazê-lo reconhecer como <strong>bem público digital</strong> <em>(digital public good)</em> — para que seja verificável e, sobretudo, <strong>replicável</strong>: outras cidades, outras cooperativas poderão retomá-lo. Uma ferramenta de interesse geral partilha-se — não se revende. <a href=\"manifeste.html\">Ler o manifesto →</a>"
      de: "Unser Horizont: <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> soll ein <strong>digitales Gemeingut</strong> sein, kein privater Vermögenswert. <strong>Der Code ist offen</strong> — <a href=\"https://github.com/TheCaptainCompany/captain-food\" target=\"_blank\" rel=\"noopener\">auf GitHub</a> — unter der Lizenz <strong><span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> Coopyleft</strong> (Copyleft auf Basis der AGPL v3, im Geiste von CoopCycle), deren kommerzielle Nutzung Strukturen der <strong>Sozial- und Solidarwirtschaft</strong> vorbehalten ist — Genossenschaften und Non-Profit-Organisationen. Unser Kurs: die Anerkennung als <strong>digitales öffentliches Gut</strong> <em>(digital public good)</em> — damit es überprüfbar und vor allem <strong>replizierbar</strong> ist: Andere Städte, andere Genossenschaften können es übernehmen. Ein Werkzeug im Dienst der Allgemeinheit teilt man — man verkauft es nicht. <a href=\"manifeste.html\">Das Manifest lesen →</a>"
      tr: "Ufkumuz: <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>'un özel bir varlık değil, bir <strong>dijital ortak değer</strong> olması. <strong>Kod açık</strong> — <a href=\"https://github.com/TheCaptainCompany/captain-food\" target=\"_blank\" rel=\"noopener\">GitHub'da</a> — <strong><span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> Coopyleft</strong> lisansıyla (CoopCycle ruhunda, AGPL v3 tabanlı bir copyleft); ticari kullanımı <strong>sosyal ve dayanışma ekonomisi</strong> yapılarına — kooperatiflere ve kâr amacı gütmeyen kuruluşlara — ayrılmıştır. Rotamız: onu bir <strong>dijital kamu malı</strong> <em>(digital public good)</em> olarak tanıtmak — doğrulanabilir ve en önemlisi <strong>çoğaltılabilir</strong> olsun diye: başka şehirler, başka kooperatifler onu devralabilsin. Kamu yararına bir araç paylaşılır — satılmaz. <a href=\"manifeste.html\">Manifestoyu oku →</a>"
      el: "Ο ορίζοντάς μας: το <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> να είναι <strong>ψηφιακό κοινό αγαθό</strong>, όχι ιδιωτικό περιουσιακό στοιχείο. <strong>Ο κώδικας είναι ανοιχτός</strong> — <a href=\"https://github.com/TheCaptainCompany/captain-food\" target=\"_blank\" rel=\"noopener\">στο GitHub</a> — με άδεια <strong><span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> Coopyleft</strong> (copyleft βασισμένο στην AGPL v3, στο πνεύμα του CoopCycle), της οποίας η εμπορική χρήση επιτρέπεται μόνο σε δομές της <strong>κοινωνικής και αλληλέγγυας οικονομίας</strong> — συνεταιρισμούς και μη κερδοσκοπικούς οργανισμούς. Η ρότα μας: να αναγνωριστεί ως <strong>ψηφιακό δημόσιο αγαθό</strong> <em>(digital public good)</em> — ώστε να είναι επαληθεύσιμο και, κυρίως, <strong>αναπαραγώγιμο</strong>: άλλες πόλεις, άλλοι συνεταιρισμοί θα μπορούν να το πάρουν και να το ξαναστήσουν. Ένα εργαλείο γενικού συμφέροντος μοιράζεται — δεν ξεπουλιέται. <a href=\"manifeste.html\">Διάβασε το μανιφέστο →</a>"
      ar: "أفقنا: أن يكون <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> <strong>مشاعًا رقميًا</strong>، لا أصلًا خاصًا. <strong>الكود مفتوح</strong> — <a href=\"https://github.com/TheCaptainCompany/captain-food\" target=\"_blank\" rel=\"noopener\">على GitHub</a> — برخصة <strong><span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> Coopyleft</strong> (كوبيليفت مبنية على AGPL v3، على نهج CoopCycle)، يقتصر استخدامها التجاري على هياكل <strong>الاقتصاد الاجتماعي والتضامني</strong> — التعاونيات والمنظمات غير الربحية. وجهتنا: أن يُعترف به <strong>منفعة عامة رقمية</strong> <em>(digital public good)</em> — ليكون قابلًا للتحقق، وقبل كل شيء <strong>قابلًا للاستنساخ</strong>: مدن أخرى وتعاونيات أخرى ستتمكن من تبنّيه. أداة النفع العام تُشارَك — ولا تُباع. <a href=\"manifeste.html\">اقرأ البيان ←</a>"
      he: "האופק שלנו: ש-<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> יהיה <strong>נכס דיגיטלי משותף</strong>, לא נכס פרטי. <strong>הקוד פתוח</strong> — <a href=\"https://github.com/TheCaptainCompany/captain-food\" target=\"_blank\" rel=\"noopener\">ב-GitHub</a> — ברישיון <strong><span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> Coopyleft</strong> (קופילפט מבוסס AGPL v3, ברוח CoopCycle), שהשימוש המסחרי בו שמור לארגוני <strong>הכלכלה החברתית והסולידרית</strong> — קואופרטיבים וארגונים ללא מטרות רווח. היעד שלנו: להביא להכרה בו כ<strong>נכס ציבורי דיגיטלי</strong> <em>(digital public good)</em> — כדי שיהיה ניתן לאימות, ובעיקר <strong>ניתן לשכפול</strong>: ערים אחרות, קואופרטיבים אחרים יוכלו לאמץ אותו. כלי לתועלת הכלל משתפים — לא מוכרים. <a href=\"manifeste.html\">לקריאת המניפסט →</a>"
  esus.rider_body:
    messages:
      fr: "Dans l'ubérisation, le livreur est une variable qu'on presse — précaire, sans protection. On a fait le choix inverse : <strong>payer nos livreurs mieux que quiconque</strong>, ici à Tours, avec l'ambition, à terme, de <strong>les salarier</strong>. Un service juste commence par des gens correctement traités."
      en: "In the gig economy, the rider is a variable to squeeze — precarious, unprotected. We made the opposite choice: <strong>pay our riders better than anyone</strong>, here in Tours, with the ambition, in time, to <strong>hire them as employees</strong>. A fair service starts with people treated right."
      es: "En la uberización, el repartidor es una variable que se exprime — precario, sin protección. Nosotros hemos elegido lo contrario: <strong>pagar a nuestros repartidores mejor que nadie</strong>, aquí en Tours, con la ambición, a la larga, de <strong>contratarlos en plantilla</strong>. Un servicio justo empieza por personas bien tratadas."
      it: "Nell'uberizzazione, il rider è una variabile da spremere — precario, senza tutele. Noi abbiamo fatto la scelta opposta: <strong>pagare i nostri rider meglio di chiunque altro</strong>, qui a Tours, con l'ambizione, col tempo, di <strong>assumerli</strong>. Un servizio giusto comincia da persone trattate come si deve."
      pt: "Na uberização, o estafeta é uma variável que se espreme — precário, sem proteção. Fizemos a escolha inversa: <strong>pagar aos nossos estafetas melhor do que ninguém</strong>, aqui em Tours, com a ambição de, a prazo, <strong>os contratar como assalariados</strong>. Um serviço justo começa por pessoas bem tratadas."
      de: "In der Uberisierung ist der Fahrer eine Stellschraube, an der man dreht — prekär, ohne Absicherung. Wir haben uns für das Gegenteil entschieden: <strong>unsere Fahrer besser zu bezahlen als alle anderen</strong>, hier in Tours, mit dem Ziel, sie langfristig <strong>fest anzustellen</strong>. Ein fairer Service beginnt bei Menschen, die anständig behandelt werden."
      tr: "Uberleşme düzeninde kurye, sıkıştırılan bir değişkendir — güvencesiz, korumasız. Biz tam tersini seçtik: burada, Tours'da <strong>kuryelerimize herkesten iyi ödemek</strong> — ve zamanla onları <strong>maaşlı çalışan yapma</strong> hedefiyle. Adil bir hizmet, insanlara düzgün davranmakla başlar."
      el: "Στην ουμπεροποίηση, ο διανομέας είναι μια μεταβλητή που τη στύβουν — επισφαλής, χωρίς προστασία. Εμείς διαλέξαμε την αντίθετη πορεία: <strong>να πληρώνουμε τους διανομείς μας καλύτερα από οποιονδήποτε</strong>, εδώ στην Tours, με φιλοδοξία, στην πορεία, <strong>να τους προσλάβουμε με μισθό</strong>. Μια δίκαιη υπηρεσία ξεκινάει από ανθρώπους που τους φέρονται σωστά."
      ar: "في اقتصاد المنصات، السائق مجرد رقم يُضغَط عليه — هشّ، وبلا حماية. نحن اخترنا العكس: <strong>أن ندفع لسائقينا أفضل من أي جهة أخرى</strong>، هنا في Tours، مع طموح <strong>توظيفهم بعقود عمل</strong> على المدى البعيد. الخدمة العادلة تبدأ بأناس يُعامَلون باحترام."
      he: "באוברזציה, השליח הוא משתנה שסוחטים — פגיע, בלי הגנה. אנחנו בחרנו בכיוון ההפוך: <strong>לשלם לשליחים שלנו יותר טוב מכולם</strong>, כאן ב-Tours, עם שאיפה, בהמשך, <strong>להעסיק אותם כשכירים</strong>. שירות הוגן מתחיל באנשים שמתייחסים אליהם כמו שצריך."
