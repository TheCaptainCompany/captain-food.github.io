  join.intro:
    messages:
      fr: "Laisse-nous ton contact : on te recontacte pour te présenter <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>, sans engagement."
      en: "Leave us your contact details: we'll get back to you to walk you through <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>, no commitment."
      es: "Déjanos tu contacto: te llamamos para presentarte <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>, sin compromiso."
      it: "Lasciaci il tuo contatto: ti richiamiamo per presentarti <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>, senza impegno."
      pt: "Deixa-nos o teu contacto: falamos contigo para te apresentar a <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>, sem compromisso."
      de: "Hinterlass uns deinen Kontakt: Wir melden uns und stellen dir <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> vor — unverbindlich."
      tr: "Bize iletişim bilgini bırak: <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>'u tanıtmak için seni arayalım — taahhüt yok."
      el: "Άφησέ μας τα στοιχεία σου: θα σε βρούμε για να σου παρουσιάσουμε το <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>, χωρίς δέσμευση."
      ro: "Lasă-ne datele tale de contact: revenim noi spre tine ca să-ți prezentăm <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>, fără obligații."
      zh: "留下你的联系方式：我们会联系你，向你介绍 <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>，不绑定。"
      ja: "連絡先を残してください：<span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>のご紹介にこちらから連絡します。縛りは一切なし。"
      th: "ทิ้งช่องทางติดต่อไว้ให้เรา: เราจะติดต่อกลับเพื่อแนะนำ <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> โดยไม่มีข้อผูกมัดใด ๆ"
      hi: "अपना संपर्क छोड़िए: हम आपसे संपर्क करेंगे और <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span> के बारे में बताएँगे — बिना किसी बंधन के।"
      ta: "உங்கள் தொடர்பு விவரங்களைத் தாருங்கள்: <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>-ஐ அறிமுகப்படுத்த நாங்களே உங்களைத் தொடர்பு கொள்கிறோம், எந்தக் கட்டுப்பாடும் இல்லை."
      ar: "اترك لنا وسيلة للتواصل معك: نتصل بك لنعرض عليك <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>، بدون التزام."
      ar-lb: "خلّيلنا رقمك أو إيميلك: منرجعلك لنعرّفك على <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>، بلا أي التزام."
      he: "השאר לנו פרטים: נחזור אליך כדי להציג לך את <span class=\"cf-name\">Captain<span class=\"cf-dot\">.</span>Food</span>, בלי התחייבות."
