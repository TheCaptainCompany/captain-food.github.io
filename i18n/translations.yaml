  problem.card1_body:
    messages:
      fr: "Impossible de les fidéliser : pas de carte de fidélité utilisable, et tu deviens dépendant de la plateforme pour avoir des commandes."
      en: "No way to build loyalty: no usable loyalty scheme, and you end up depending on the platform to get orders at all."
      es: "Imposible fidelizarlos: sin tarjeta de fidelidad que valga, y acabas dependiendo de la plataforma para tener pedidos."
      it: "Impossibile fidelizzarli: niente carta fedeltà utilizzabile, e per avere ordini diventi dipendente dalla piattaforma."
      pt: "Impossível fidelizá-los: nenhum cartão de fidelidade utilizável, e ficas dependente da plataforma para teres encomendas."
      de: "Kundenbindung? Unmöglich: keine nutzbare Stammkundenkarte — und für Bestellungen wirst du von der Plattform abhängig."
      tr: "Onları sadık kılmak imkânsız: kullanabileceğin bir sadakat kartı yok ve sipariş alabilmek için platforma bağımlı hale geliyorsun."
      el: "Αδύνατον να χτίσεις σχέση μαζί τους: καμία κάρτα πιστότητας που να δουλεύει, κι εσύ εξαρτάσαι από την πλατφόρμα για να έχεις παραγγελίες."
      ro: "Imposibil să-i fidelizezi: niciun card de fidelitate utilizabil, iar tu ajungi dependent de platformă ca să ai comenzi."
      zh: "根本没法培养回头客：会员卡用不上，而想有订单，你只能越来越依赖平台。"
      ja: "常連づくりができません：使えるポイントカードもなく、注文を得るためにプラットフォーム頼みになっていきます。"
      th: "สร้างความผูกพันกับลูกค้าไม่ได้เลย: ไม่มีระบบสะสมแต้มที่ใช้ได้จริง และคุณต้องพึ่งแพลตฟอร์มเพื่อให้มีออร์เดอร์เข้ามา"
      hi: "उन्हें अपना बनाना नामुमकिन: कोई काम की लॉयल्टी-योजना नहीं, और ऑर्डर पाने के लिए आप प्लेटफ़ॉर्म पर निर्भर हो जाते हैं।"
      ta: "அவர்களை நிலைநிறுத்த வழியே இல்லை: பயன்படுத்தக்கூடிய லாயல்டி கார்டு இல்லை, ஆர்டர்களுக்குத் தளத்தையே சார்ந்திருக்க வேண்டிய நிலை."
      ar: "لا سبيل لكسب ولائهم: لا بطاقة وفاء يمكنك استخدامها، وتصبح معتمدًا على المنصة لكي تصلك الطلبات."
      ar-lb: "ما فيك تخلّيهن يرجعولك: ما في برنامج وفاء ينفعك، وبتصير معلّق بالمنصّة ليجيك طلبات."
      he: "אי אפשר לשמר אותם: אין תוכנית נאמנות שאפשר להפעיל, ואתה נהיה תלוי בפלטפורמה כדי לקבל הזמנות."
  problem.card1_title:
    messages:
      fr: "Tes clients ne sont pas tes clients."
      en: "Your customers aren't your customers."
      es: "Tus clientes no son tus clientes."
      it: "I tuoi clienti non sono tuoi clienti."
      pt: "Os teus clientes não são teus clientes."
      de: "Deine Gäste sind nicht deine Gäste."
      tr: "Müşterilerin senin müşterin değil."
      el: "Οι πελάτες σου δεν είναι πελάτες σου."
      ro: "Clienții tăi nu sunt clienții tăi."
      zh: "你的客人不是你的客人。"
      ja: "あなたのお客様は、あなたのお客様じゃない。"
      th: "ลูกค้าของคุณไม่ใช่ลูกค้าของคุณ"
      hi: "आपके ग्राहक आपके ग्राहक नहीं हैं।"
      ta: "உங்கள் வாடிக்கையாளர்கள் உங்களுடையவர்கள் அல்ல."
      ar: "زبائنك ليسوا زبائنك."
      ar-lb: "زبايناتك مش زبايناتك."
      he: "הלקוחות שלך הם לא הלקוחות שלך."
  problem.card2_body:
    messages:
      fr: "Pour absorber leur commission, tu gonfles tes tarifs en ligne. Et tu subis les promotions forcées et les changements d'algorithme dont tu dépends — qui impactent ta position."
      en: "To absorb their commission, you inflate your online prices. And you're stuck with forced promotions and algorithm changes you depend on — which hit your ranking."
      es: "Para absorber su comisión, hinchas tus tarifas online. Y sufres las promociones forzadas y los cambios de algoritmo de los que dependes — y que afectan a tu posición."
      it: "Per assorbire la loro commissione, gonfi il listino online. E subisci le promozioni forzate e i cambi di algoritmo da cui dipendi — che decidono la tua posizione."
      pt: "Para absorver a comissão deles, inflacionas os teus preços online. E sofres as promoções forçadas e as mudanças de algoritmo de que dependes — e que afetam a tua posição."
      de: "Um ihre Provision aufzufangen, bläst du deine Online-Preise auf. Dazu erduldest du erzwungene Rabattaktionen und Algorithmus-Änderungen, von denen du abhängst — und die über deine Sichtbarkeit entscheiden."
      tr: "Komisyonlarını karşılamak için online fiyatlarını şişiriyorsun. Üstüne zorunlu promosyonlara ve bağımlı olduğun algoritma değişikliklerine katlanıyorsun — sıralamadaki yerini de bunlar belirliyor."
      el: "Για να απορροφήσεις την προμήθειά τους, φουσκώνεις τις online τιμές σου. Και υφίστασαι τις υποχρεωτικές προσφορές και τις αλλαγές του αλγορίθμου από τον οποίο εξαρτάσαι — και που καθορίζει τη θέση σου."
      ro: "Ca să absorbi comisionul lor, îți umfli tarifele online. Și înghiți promoțiile forțate și schimbările de algoritm de care depinzi — și care îți afectează poziția."
      zh: "为了消化佣金，你只能抬高线上价格。还得被迫参加促销、忍受说变就变的算法——它们左右你的排名，你却毫无办法。"
      ja: "手数料を吸収するために、オンライン価格を水増しする。さらに強制プロモーションや、表示順位を左右するアルゴリズム変更に振り回されます。"
      th: "เพื่อชดเชยค่าคอมมิชชั่นของพวกเขา คุณต้องดันราคาออนไลน์ให้สูงขึ้น แถมยังต้องทนกับโปรโมชั่นแบบบังคับและการเปลี่ยนอัลกอริทึมที่คุณต้องพึ่งพา — ซึ่งกระทบอันดับการมองเห็นร้านของคุณ"
      hi: "उनका कमीशन झेलने के लिए आप अपने ऑनलाइन दाम फुलाते हैं। ऊपर से थोपे हुए प्रमोशन और एल्गोरिद्म के बदलाव झेलते हैं, जिन पर आप निर्भर हैं — और जो आपकी रैंकिंग पर असर डालते हैं।"
      ta: "அவர்களின் கமிஷனைத் தாங்க, ஆன்லைன் விலைகளை உயர்த்துகிறீர்கள். கட்டாயத் தள்ளுபடிகளையும், நீங்கள் சார்ந்திருக்கும் அல்காரிதம் மாற்றங்களையும் — உங்கள் இடத்தையே பாதிப்பவை — சகித்துக்கொள்கிறீர்கள்."
      ar: "لامتصاص عمولتهم، ترفع أسعارك على الإنترنت. وتتحمّل العروض الإجبارية وتغييرات الخوارزمية التي تعتمد عليها — والتي تؤثر على ترتيبك."
      ar-lb: "لتبلع عمولتهن، بتنفخ أسعارك أونلاين. وبتتحمّل العروضات المفروضة وتغييرات الخوارزمية يلّي صرت معلّق فيها — ويلّي بتلعب بموقعك."
      he: "כדי לספוג את העמלה שלהן, אתה מנפח את המחירים אונליין. ואתה סופג מבצעים כפויים ושינויי אלגוריתם שאתה תלוי בהם — והם משפיעים על המיקום שלך."
  problem.card2_title:
    messages:
      fr: "Tu ne fixes pas tes prix."
      en: "You don't set your prices."
      es: "No fijas tus precios."
      it: "I prezzi non li decidi tu."
      pt: "Não és tu que fixas os teus preços."
      de: "Deine Preise machst nicht du."
      tr: "Fiyatlarını sen belirlemiyorsun."
      el: "Τις τιμές σου δεν τις ορίζεις εσύ."
      ro: "Nu tu îți fixezi prețurile."
      zh: "价格不由你定。"
      ja: "価格を決めるのは、あなたじゃない。"
      th: "คุณไม่ได้เป็นคนกำหนดราคาเอง"
      hi: "दाम आप तय नहीं करते।"
      ta: "விலையை நிர்ணயிப்பது நீங்கள் அல்ல."
      ar: "أنت لا تحدد أسعارك."
      ar-lb: "مش إنت يلّي بتحدّد أسعارك."
      he: "אתה לא קובע את המחירים שלך."
  problem.eyebrow:
    messages:
      fr: "Le constat"
      en: "The problem"
      es: "El diagnóstico"
      it: "Il problema"
      pt: "O diagnóstico"
      de: "Das Problem"
      tr: "Gerçekler"
      el: "Η πραγματικότητα"
      ro: "Realitatea"
      zh: "现状"
      ja: "現状"
      th: "ปัญหาที่เจอ"
      hi: "हक़ीक़त"
      ta: "நிலவரம்"
      ar: "الواقع"
      ar-lb: "المشكلة"
      he: "המצב בשטח"
  problem.intro:
    messages:
      fr: "Sur les grandes plateformes, chaque commande te coûte plus cher que tu ne le crois."
      en: "On the big platforms, every order costs you more than you think."
      es: "En las grandes plataformas, cada pedido te cuesta más de lo que crees."
      it: "Sulle grandi piattaforme, ogni ordine ti costa più di quanto credi."
      pt: "Nas grandes plataformas, cada encomenda custa-te mais do que pensas."
      de: "Auf den großen Plattformen kostet dich jede Bestellung mehr, als du denkst."
      tr: "Büyük platformlarda her sipariş sana sandığından daha pahalıya mal oluyor."
      el: "Στις μεγάλες πλατφόρμες, κάθε παραγγελία σού κοστίζει πιο ακριβά απ' όσο νομίζεις."
      ro: "Pe marile platforme, fiecare comandă te costă mai mult decât crezi."
      zh: "在大平台上，每一单的真实代价，都比你以为的高得多。"
      ja: "大手プラットフォームでは、注文1件ごとに、あなたが思う以上のお金が消えています。"
      th: "บนแพลตฟอร์มยักษ์ใหญ่ ทุกออร์เดอร์ทำให้คุณเสียเงินมากกว่าที่คิด"
      hi: "बड़ी प्लेटफ़ॉर्मों पर हर ऑर्डर आपको उससे कहीं महँगा पड़ता है जितना आप सोचते हैं।"
      ta: "பெரிய தளங்களில், ஒவ்வொரு ஆர்டரும் நீங்கள் நினைப்பதை விட அதிகமாகவே உங்களுக்குச் செலவாகிறது."
      ar: "على المنصات الكبرى، كل طلب يكلفك أكثر مما تظن."
      ar-lb: "عالمنصّات الكبيرة، كل طلب بيكلّفك أكتر ممّا بتتصوّر."
      he: "בפלטפורמות הגדולות, כל הזמנה עולה לך יותר ממה שנדמה לך."
  problem.ratio_punch:
    messages:
      fr: "Sur une commande livrée, la commission (~30 %) pèse <b>jusqu'à 10×</b> ta marge nette (~3 %). Tu travailles, elle encaisse."
      en: "On a delivered order, the commission (~30%) weighs <b>up to 10×</b> your net margin (~3%). You do the work, they cash in."
      es: "En un pedido a domicilio, la comisión (~30 %) pesa <b>hasta 10×</b> tu margen neto (~3 %). Tú trabajas, ella cobra."
      it: "Su un ordine consegnato, la commissione (~30%) pesa <b>fino a 10×</b> il tuo margine netto (~3%). Tu lavori, lei incassa."
      pt: "Numa encomenda entregue, a comissão (~30%) pesa <b>até 10×</b> a tua margem líquida (~3%). Tu trabalhas, ela embolsa."
      de: "Bei einer gelieferten Bestellung wiegt die Provision (~30 %) <b>bis zu 10-mal</b> so schwer wie deine Nettomarge (~3 %). Du arbeitest, sie kassiert."
      tr: "Teslim edilen bir siparişte komisyon (~%30), net kâr marjının (~%3) <b>10 katına kadar</b> çıkıyor. Sen çalışıyorsun, kasayı o dolduruyor."
      el: "Σε μια παραγγελία με διανομή, η προμήθεια (~30 %) ζυγίζει <b>έως και 10×</b> το καθαρό σου περιθώριο (~3 %). Εσύ δουλεύεις, αυτή εισπράττει."
      ro: "La o comandă livrată, comisionul (~30%) apasă <b>de până la 10×</b> mai greu decât marja ta netă (~3%). Tu muncești, ea încasează."
      zh: "在一份外送订单上，佣金（约30%）<b>最高可达10倍</b>于你的净利润（约3%）。你在干活，它在收钱。"
      ja: "配達1件あたり、手数料（約30%）はあなたの純利益（約3%）の<b>最大10倍</b>。働くのはあなた、集金するのは彼ら。"
      th: "ในออร์เดอร์เดลิเวอรีหนึ่งรายการ ค่าคอมมิชชั่น (~30 %) หนักกว่ากำไรสุทธิของคุณ (~3 %) ได้<b>ถึง 10 เท่า</b> คุณเป็นคนทำงาน แต่แพลตฟอร์มเป็นคนเก็บเงิน"
      hi: "एक डिलीवर हुए ऑर्डर पर कमीशन (~30%) आपके शुद्ध मार्जिन (~3%) पर <b>10 गुना तक</b> भारी पड़ता है। मेहनत आपकी, कमाई उसकी।"
      ta: "டெலிவரி ஆர்டர் ஒன்றில், கமிஷன் (~30 %) உங்கள் நிகர லாபத்தை (~3 %) விட <b>10 மடங்கு வரை</b> அதிகம். உழைப்பது நீங்கள், வசூலிப்பது அவர்கள்."
      ar: "في الطلب مع التوصيل، تعادل العمولة (~30%) <b>حتى 10 أضعاف</b> هامش ربحك الصافي (~3%). أنت تشتغل، وهي تُحصّل."
      ar-lb: "بطلب موصّل، العمولة (~30%) بتوزن <b>لحدّ 10 أضعاف</b> ربحك الصافي (~3%). إنت بتشتغل، وهيّي بتقبض."
      he: "בהזמנה במשלוח, העמלה (כ-30%) גדולה <b>עד פי 10</b> מהרווח הנקי שלך (כ-3%). אתה עובד, היא גובה."
  problem.sources:
    messages:
      fr: "Sources : marge nette moyenne ~3 % (Observatoire Fiducial, communiqué UMIH/GHR/SNARR, juin 2025) ; défaillances 2024 et +80 % sur deux ans (Altares 2024, via L'Hôtellerie-Restauration/GHR). Une défaillance = sauvegarde, redressement ou liquidation ; environ 2 sur 3 finissent en liquidation."
      en: "Sources: ~3% average net margin (Observatoire Fiducial, UMIH/GHR/SNARR press release, June 2025); 2024 insolvencies and +80% over two years (Altares 2024, via L'Hôtellerie-Restauration/GHR). An insolvency = safeguard proceedings, receivership or liquidation; about 2 in 3 end in liquidation."
      es: "Fuentes: margen neto medio ~3 % (Observatoire Fiducial, comunicado UMIH/GHR/SNARR, junio de 2025); concursos 2024 y +80 % en dos años (Altares 2024, vía L'Hôtellerie-Restauration/GHR). Un concurso = salvaguarda, administración judicial o liquidación; unos 2 de cada 3 acaban en liquidación."
      it: "Fonti: margine netto medio ~3% (Observatoire Fiducial, comunicato UMIH/GHR/SNARR, giugno 2025); procedure concorsuali 2024 e +80% in due anni (Altares 2024, via L'Hôtellerie-Restauration/GHR). Una procedura concorsuale = salvaguardia, amministrazione controllata o liquidazione; circa 2 su 3 finiscono in liquidazione."
      pt: "Fontes: margem líquida média ~3% (Observatoire Fiducial, comunicado UMIH/GHR/SNARR, junho de 2025); insolvências de 2024 e +80% em dois anos (Altares 2024, via L'Hôtellerie-Restauration/GHR). Uma insolvência = salvaguarda, recuperação judicial ou liquidação; cerca de 2 em cada 3 acabam em liquidação."
      de: "Quellen: durchschnittliche Nettomarge ~3 % (Observatoire Fiducial, Pressemitteilung UMIH/GHR/SNARR, Juni 2025); Insolvenzen 2024 und +80 % in zwei Jahren (Altares 2024, via L'Hôtellerie-Restauration/GHR). Insolvenz = Schutz-, Sanierungs- oder Liquidationsverfahren; rund 2 von 3 enden in der Liquidation."
      tr: "Kaynaklar: ortalama net kâr marjı ~%3 (Observatoire Fiducial, UMIH/GHR/SNARR bildirisi, Haziran 2025); 2024 batıkları ve iki yılda +%80 (Altares 2024, L'Hôtellerie-Restauration/GHR aracılığıyla). Batık = koruma, yeniden yapılandırma veya tasfiye süreci; yaklaşık her 3 işletmeden 2'si tasfiyeyle sonuçlanıyor."
      el: "Πηγές: μέσο καθαρό περιθώριο ~3 % (Observatoire Fiducial, ανακοίνωση UMIH/GHR/SNARR, Ιούνιος 2025)· πτωχεύσεις 2024 και +80 % σε δύο χρόνια (Altares 2024, μέσω L'Hôtellerie-Restauration/GHR). «Πτωχευτική διαδικασία» = διάσωση, εξυγίανση ή εκκαθάριση· περίπου 2 στις 3 καταλήγουν σε εκκαθάριση."
      ro: "Surse: marjă netă medie ~3% (Observatoire Fiducial, comunicat UMIH/GHR/SNARR, iunie 2025); insolvențe 2024 și +80% în doi ani (Altares 2024, via L'Hôtellerie-Restauration/GHR). O insolvență = procedură de salvgardare, redresare sau lichidare; cam 2 din 3 se termină în lichidare."
      zh: "数据来源：平均净利润率约3%（Observatoire Fiducial，UMIH/GHR/SNARR 联合公报，2025年6月）；2024年经营困境数据及两年+80%（Altares 2024，经 L'Hôtellerie-Restauration/GHR 转载）。「经营困境」指进入保护、重整或清算程序；约三分之二最终走向清算。"
      ja: "出典：平均純利益率 約3%（Observatoire Fiducial、UMIH/GHR/SNARRプレスリリース、2025年6月）。2024年の破綻件数と2年間で+80%（Altares 2024、L'Hôtellerie-Restauration/GHR経由）。破綻＝保全・更生・清算のいずれかの手続き。約3件に2件は清算に至ります。"
      th: "แหล่งข้อมูล: กำไรสุทธิเฉลี่ย ~3 % (Observatoire Fiducial แถลงการณ์ UMIH/GHR/SNARR มิถุนายน 2025); ตัวเลขกิจการที่มีปัญหาปี 2024 และ +80 % ในสองปี (Altares 2024 ผ่าน L'Hôtellerie-Restauration/GHR) « กิจการที่มีปัญหา » หมายถึงการพิทักษ์กิจการ การฟื้นฟูกิจการ หรือการชำระบัญชี; ราว 2 ใน 3 จบลงด้วยการชำระบัญชี"
      hi: "स्रोत: औसत शुद्ध मार्जिन ~3% (Observatoire Fiducial, UMIH/GHR/SNARR विज्ञप्ति, जून 2025); 2024 के दिवालियेपन-आँकड़े और दो साल में +80% (Altares 2024, L'Hôtellerie-Restauration/GHR के माध्यम से)। दिवालियेपन की प्रक्रिया = सुरक्षा-प्रक्रिया, पुनर्गठन या परिसमापन; लगभग 3 में से 2 मामले परिसमापन में ख़त्म होते हैं।"
      ta: "ஆதாரங்கள்: சராசரி நிகர லாபம் ~3 % (Observatoire Fiducial, UMIH/GHR/SNARR அறிக்கை, ஜூன் 2025); 2024 நிதி நெருக்கடிகள் மற்றும் இரண்டு ஆண்டுகளில் +80 % (Altares 2024, L'Hôtellerie-Restauration/GHR வழியாக). நிதி நெருக்கடி = காப்பு நடவடிக்கை, மறுசீரமைப்பு அல்லது கலைப்பு; சுமார் 3-ல் 2 கலைப்பில் முடிகின்றன."
      ar: "المصادر: متوسط الهامش الصافي ~3% (مرصد Fiducial، بيان UMIH/GHR/SNARR، يونيو 2025)؛ حالات التعثر 2024 و+80% خلال سنتين (Altares 2024، عبر L'Hôtellerie-Restauration/GHR). التعثر = إجراء حماية أو تسوية قضائية أو تصفية؛ ونحو 2 من كل 3 تنتهي بالتصفية."
      ar-lb: "المصادر: متوسّط الربح الصافي ~3% (Observatoire Fiducial، بيان UMIH/GHR/SNARR، حزيران 2025)؛ تعتّرات 2024 و+80% بسنتين (Altares 2024، عبر L'Hôtellerie-Restauration/GHR). التعتّر = حماية قضائية أو إعادة هيكلة أو تصفية؛ تقريباً 2 من كل 3 بينتهوا بالتصفية."
      he: "מקורות: רווח נקי ממוצע כ-3% (Observatoire Fiducial, הודעת UMIH/GHR/SNARR, יוני 2025); קריסות 2024 ועלייה של 80%+ בשנתיים (Altares 2024, דרך L'Hôtellerie-Restauration/GHR). ״קריסה״ = הליך הגנה, הבראה או פירוק; בערך 2 מכל 3 מסתיימות בפירוק."
  problem.stat_failures:
    messages:
      fr: "<strong>établissements de restauration en défaillance</strong> en France en 2024, soit <strong>+80 %</strong> en deux ans."
      en: "<strong>restaurant businesses in insolvency</strong> in France in 2024 — that's <strong>+80%</strong> in two years."
      es: "<strong>establecimientos de restauración en concurso</strong> en Francia en 2024, es decir, <strong>+80 %</strong> en dos años."
      it: "<strong>attività di ristorazione in procedura concorsuale</strong> in Francia nel 2024, ovvero <strong>+80%</strong> in due anni."
      pt: "<strong>estabelecimentos de restauração em insolvência</strong> em França em 2024, ou seja, <strong>+80%</strong> em dois anos."
      de: "<strong>Gastronomiebetriebe gerieten 2024 in Frankreich in die Insolvenz</strong> — das sind <strong>+80 %</strong> in zwei Jahren."
      tr: "2024'te Fransa'da <strong>batık duruma düşen restoran işletmesi</strong> — yani iki yılda <strong>+%80</strong> artış."
      el: "<strong>επιχειρήσεις εστίασης σε πτωχευτική διαδικασία</strong> στη Γαλλία το 2024, δηλαδή <strong>+80 %</strong> μέσα σε δύο χρόνια."
      ro: "<strong>unități de restaurație intrate în insolvență</strong> în Franța în 2024, adică <strong>+80%</strong> în doi ani."
      zh: "<strong>家餐饮企业陷入经营困境</strong>（2024年，法国全国），两年间暴增<strong>+80%</strong>。"
      ja: "2024年にフランスで<strong>経営破綻した飲食店</strong>の数。2年間で<strong>+80%</strong>です。"
      th: "<strong>กิจการร้านอาหารที่เข้าสู่กระบวนการล้มละลาย</strong>ในฝรั่งเศสปี 2024 เพิ่มขึ้น <strong>+80 %</strong> ภายในสองปี"
      hi: "<strong>खान-पान प्रतिष्ठान 2024 में फ़्रांस में दिवालियेपन की प्रक्रिया में</strong> — यानी दो साल में <strong>+80%</strong>।"
      ta: "2024-ல் பிரான்சில் <strong>நிதி நெருக்கடியில் சிக்கிய உணவக நிறுவனங்கள்</strong> — அதாவது இரண்டு ஆண்டுகளில் <strong>+80 %</strong>."
      ar: "<strong>مؤسسة مطاعم في حالة تعثّر</strong> في فرنسا سنة 2024، أي <strong>+80%</strong> خلال سنتين."
      ar-lb: "<strong>مطعم تعتّر ووقع مالياً</strong> بفرنسا بـ2024، يعني <strong>+80%</strong> بسنتين."
      he: "<strong>עסקי מסעדנות בקריסה כלכלית</strong> בצרפת ב-2024 — זינוק של <strong>80%+</strong> בתוך שנתיים."
  problem.stat_margin:
    messages:
      fr: "c'est la <strong>marge nette moyenne</strong> d'un restaurant — bien moins que la commission (~30 %) prélevée sur chaque commande livrée."
      en: "is the <strong>average net margin</strong> of a restaurant — far less than the ~30% commission taken on every delivered order."
      es: "es el <strong>margen neto medio</strong> de un restaurante — mucho menos que la comisión (~30 %) que se llevan de cada pedido entregado."
      it: "è il <strong>margine netto medio</strong> di un ristorante — molto meno della commissione (~30%) prelevata su ogni ordine consegnato."
      pt: "é a <strong>margem líquida média</strong> de um restaurante — muito menos do que a comissão (~30%) cobrada em cada encomenda entregue."
      de: "beträgt die <strong>durchschnittliche Nettomarge</strong> eines Restaurants — weit weniger als die Provision (~30 %), die auf jeder gelieferten Bestellung liegt."
      tr: "bir restoranın <strong>ortalama net kâr marjı</strong> bu — teslim edilen her siparişten kesilen komisyonun (~%30) çok altında."
      el: "είναι το <strong>μέσο καθαρό περιθώριο</strong> ενός εστιατορίου — πολύ λιγότερο από την προμήθεια (~30 %) που παρακρατείται σε κάθε παραγγελία με διανομή."
      ro: "atât e <strong>marja netă medie</strong> a unui restaurant — cu mult sub comisionul (~30%) reținut la fiecare comandă livrată."
      zh: "——这是一家餐厅的<strong>平均净利润率</strong>，远低于每份外送订单被抽走的佣金（约30%）。"
      ja: "— レストランの<strong>平均純利益率</strong>です。配達注文のたびに引かれる手数料（約30%）より、はるかに小さい数字。"
      th: "คือ<strong>กำไรสุทธิเฉลี่ย</strong>ของร้านอาหาร — น้อยกว่าค่าคอมมิชชั่น (~30 %) ที่ถูกหักจากทุกออร์เดอร์เดลิเวอรีอยู่หลายเท่า"
      hi: "यह है एक रेस्टोरेंट का <strong>औसत शुद्ध मार्जिन</strong> — हर डिलीवर हुए ऑर्डर से काटे जाने वाले कमीशन (~30%) से कहीं कम।"
      ta: "இதுதான் ஒரு உணவகத்தின் <strong>சராசரி நிகர லாபம்</strong> — ஒவ்வொரு டெலிவரி ஆர்டரிலும் பிடிக்கப்படும் கமிஷனை (~30 %) விட மிகக் குறைவு."
      ar: "هو <strong>متوسط هامش الربح الصافي</strong> للمطعم — أقل بكثير من العمولة (~30%) المقتطعة من كل طلب مع التوصيل."
      ar-lb: "هيدا <strong>متوسّط الربح الصافي</strong> لمطعم — أقل بكتير من العمولة (~30%) يلّي بتنقصّ من كل طلب موصّل."
      he: "זה <strong>הרווח הנקי הממוצע</strong> של מסעדה — הרבה פחות מהעמלה (כ-30%) שנגבית על כל הזמנה במשלוח."
  problem.title:
    messages:
      fr: "Elles abusent !"
      en: "They've gone too far!"
      es: "¡Se están pasando!"
      it: "Esagerano!"
      pt: "Elas abusam!"
      de: "Das ist Abzocke!"
      tr: "Bu kadarı da fazla!"
      el: "Το παρατραβάνε!"
      ro: "Au întrecut măsura!"
      zh: "它们太过分了！"
      ja: "取りすぎだ！"
      th: "พวกแพลตฟอร์มเอาเปรียบเกินไป!"
      hi: "ये तो हद कर रही हैं!"
      ta: "இது அப்பட்டமான அநியாயம்!"
      ar: "إنها تستغلّك!"
      ar-lb: "هودي عم يبالغوا!"
      he: "הן פשוט מגזימות!"

  # ---- quote ----
  quote.body:
    messages:
      fr: "C'est ce que beaucoup se disent. Mais tes prix gonflent, le client commande moins — ou ailleurs. Ces commandes perdues, tu ne les vois jamais."
      en: "That's what a lot of owners tell themselves. But your prices swell, customers order less — or somewhere else. Those lost orders? You never see them."
      es: "Es lo que muchos se dicen. Pero tus precios se hinchan, el cliente pide menos — o en otro sitio. Esos pedidos perdidos no los ves nunca."
      it: "È quello che si dicono in molti. Ma i tuoi prezzi lievitano, il cliente ordina meno — o altrove. Quegli ordini persi, tu non li vedi mai."
      pt: "É o que muitos pensam. Mas os teus preços incham, o cliente encomenda menos — ou noutro sítio. Essas encomendas perdidas, nunca as chegas a ver."
      de: "Das denken viele. Aber deine Preise steigen, der Gast bestellt weniger — oder woanders. Diese verlorenen Bestellungen siehst du nie."
      tr: "Çoğu kişi böyle düşünüyor. Ama fiyatların şişiyor, müşteri daha az sipariş veriyor — ya da başka yerden. O kaybedilen siparişleri hiçbir zaman görmüyorsun."
      el: "Έτσι σκέφτονται πολλοί. Μόνο που οι τιμές σου φουσκώνουν, ο πελάτης παραγγέλνει λιγότερο — ή αλλού. Αυτές τις χαμένες παραγγελίες δεν τις βλέπεις ποτέ."
      ro: "Așa își spun mulți. Dar prețurile tale se umflă, clientul comandă mai puțin — sau în altă parte. Comenzile pierdute nu le vezi niciodată."
      zh: "很多人都这么想。可价格一涨，客人就点得少了——或者去别家点了。这些流失的订单，你永远看不见。"
      ja: "多くの店主がそう考えます。でも価格が膨らめば、お客様は注文を減らすか、よそへ行く。その失われた注文は、あなたの目には決して映りません。"
      th: "หลายคนคิดแบบนั้น แต่พอราคาของคุณพองขึ้น ลูกค้าก็สั่งน้อยลง — หรือไปสั่งที่อื่น ออร์เดอร์ที่หายไปเหล่านั้น คุณไม่มีวันได้เห็นมัน"
      hi: "बहुत-से लोग यही सोचते हैं। पर आपके दाम फूल जाते हैं, ग्राहक कम ऑर्डर करता है — या कहीं और से। ये खोए हुए ऑर्डर आपको कभी दिखते ही नहीं।"
      ta: "பலரும் இப்படித்தான் நினைக்கிறார்கள். ஆனால் உங்கள் விலைகள் உயர்கின்றன, வாடிக்கையாளர் குறைவாக ஆர்டர் செய்கிறார் — அல்லது வேறு இடத்தில். இழந்த அந்த ஆர்டர்கள் உங்கள் கண்ணுக்கே தெரிவதில்லை."
      ar: "هذا ما يقوله كثيرون لأنفسهم. لكن أسعارك ترتفع، فيطلب الزبون أقل — أو من مكان آخر. وتلك الطلبات الضائعة، لن تراها أبدًا."
      ar-lb: "هيك كتار بيقولوا لحالهن. بس أسعارك بتنفخ، والزبون بيطلب أقل — أو من محل تاني. وهالطلبات الضايعة، ما بتشوفها بحياتك."
      he: "ככה הרבה אומרים לעצמם. אבל המחירים שלך מתנפחים, הלקוח מזמין פחות — או במקום אחר. את ההזמנות האבודות האלה אתה אף פעם לא רואה."
  quote.kicker:
    messages:
      fr: "Répercuter la commission, ce n'est pas l'annuler. C'est la faire payer à ton chiffre d'affaires."
      en: "Passing the commission on doesn't cancel it. It just makes your revenue pay for it."
      es: "Repercutir la comisión no es anularla. Es hacérsela pagar a tu facturación."
      it: "Scaricare la commissione non significa annullarla. Significa farla pagare al tuo fatturato."
      pt: "Repercutir a comissão não é anulá-la. É fazê-la pagar pela tua faturação."
      de: "Die Provision weiterzugeben heißt nicht, sie loszuwerden. Es heißt, sie deinen Umsatz bezahlen zu lassen."
      tr: "Komisyonu yansıtmak onu yok etmek değildir. Faturayı cirona kesmektir."
      el: "Το να περνάς την προμήθεια στις τιμές δεν την εξαφανίζει. Απλώς τη χρεώνεις στον τζίρο σου."
      ro: "Să pasezi comisionul în prețuri nu înseamnă să-l anulezi. Înseamnă să-l pui în cârca cifrei tale de afaceri."
      zh: "把佣金转嫁出去，不等于把它消灭。只是换成你的营业额来买单。"
      ja: "手数料の上乗せは、手数料の帳消しではありません。あなたの売上に払わせているだけです。"
      th: "การบวกค่าคอมมิชชั่นเข้าไปในราคา ไม่ได้ทำให้มันหายไป แค่ย้ายภาระให้ยอดขายของคุณเป็นคนจ่ายแทน"
      hi: "कमीशन को दामों में जोड़ देना उसे मिटाना नहीं है। यह उसकी क़ीमत अपनी बिक्री से चुकवाना है।"
      ta: "கமிஷனை விலையில் சேர்ப்பது அதை அழிப்பது அல்ல. அதை உங்கள் விற்பனையே கட்டச் செய்வது."
      ar: "تحميل العمولة على الأسعار لا يلغيها، بل يجعل رقم مبيعاتك هو من يدفعها."
      ar-lb: "لمّا تحمّل العمولة على أسعارك، ما ألغيتها. خلّيت مبيعاتك هيّي يلّي تدفعها."
      he: "לגלגל את העמלה זה לא לבטל אותה. זה לגרום למחזור שלך לשלם אותה."
  quote.lead:
    messages:
      fr: "« Je m'en moque, je répercute la commission sur mes prix. »"
      en: "“I don't care, I just pass the commission on in my prices.”"
      es: "«Me da igual: repercuto la comisión en mis precios.»"
      it: "«Chi se ne frega, la commissione la scarico sui prezzi.»"
      pt: "«Tanto faz, repercuto a comissão nos meus preços.»"
      de: "„Ist mir egal, ich schlage die Provision einfach auf meine Preise drauf.“"
      tr: "« Bana ne, komisyonu fiyatlarıma yansıtırım olur biter. »"
      el: "«Δεν με νοιάζει, την προμήθεια την περνάω στις τιμές μου.»"
      ro: "„Mi-e egal, bag comisionul în prețurile mele.”"
      zh: "「我无所谓，把佣金加进菜价就行了。」"
      ja: "「関係ないね。手数料は価格に上乗せするだけだから。」"
      th: "« ฉันไม่สนหรอก ก็แค่บวกค่าคอมมิชชั่นเข้าไปในราคา »"
      hi: "« मुझे क्या फ़र्क़ पड़ता है — कमीशन मैं अपने दामों में जोड़ देता हूँ। »"
      ta: "« எனக்குக் கவலை இல்லை, கமிஷனை என் விலைகளில் சேர்த்துவிடுகிறேன். »"
      ar: "«لا يهمني، أُحمّل العمولة على أسعاري.»"
      ar-lb: "« ما بهمّني، بحمّل العمولة على أسعاري. »"
      he: "״לא אכפת לי, אני מגלגל את העמלה על המחירים שלי.״"

  # ---- repercuss ----
  repercuss.aria:
    messages:
      fr: "Part de la commission répercutée sur tes prix"
      en: "Share of the commission passed on to your prices"
      es: "Parte de la comisión repercutida en tus precios"
      it: "Quota della commissione scaricata sui tuoi prezzi"
      pt: "Parte da comissão repercutida nos teus preços"
      de: "Anteil der Provision, den du auf deine Preise aufschlägst"
      tr: "Fiyatlarına yansıttığın komisyon payı"
      el: "Ποσοστό της προμήθειας που περνάει στις τιμές σου"
      ro: "Partea din comision trecută în prețurile tale"
      zh: "转嫁到菜价上的佣金比例"
      ja: "価格に上乗せする手数料の割合"
      th: "สัดส่วนค่าคอมมิชชั่นที่บวกเข้าไปในราคาของคุณ"
      hi: "कमीशन का कितना हिस्सा आप दामों में जोड़ते हैं"
      ta: "விலைகளில் சேர்க்கப்படும் கமிஷன் பங்கு"
      ar: "نسبة العمولة المحمَّلة على أسعارك"
      ar-lb: "قدّيش من العمولة عم تحمّل على أسعارك"
      he: "חלק העמלה שמגולגל על המחירים שלך"
  repercuss.msg100:
    messages:
      fr: "Tes prix en ligne gonflent nettement. Le client compare, te trouve plus cher, et commande moins — ou ailleurs. Ta marge est sauve sur le papier, mais les ventes perdues, tu ne les vois jamais."
      en: "Your online prices swell noticeably. Customers compare, find you more expensive, and order less — or somewhere else. Your margin looks safe on paper, but the lost sales? You never see them."
      es: "Tus precios online se disparan. El cliente compara, te ve más caro y pide menos — o en otro sitio. Tu margen se salva sobre el papel, pero las ventas perdidas no las ves nunca."
      it: "I tuoi prezzi online lievitano parecchio. Il cliente confronta, ti trova più caro e ordina meno — o altrove. Il tuo margine è salvo sulla carta, ma le vendite perse non le vedi mai."
      pt: "Os teus preços online incham a olhos vistos. O cliente compara, acha-te mais caro e encomenda menos — ou noutro sítio. A tua margem salva-se no papel, mas as vendas perdidas, nunca as chegas a ver."
      de: "Deine Online-Preise steigen deutlich. Der Gast vergleicht, findet dich teurer und bestellt weniger — oder woanders. Auf dem Papier ist deine Marge gerettet, aber die verlorenen Verkäufe siehst du nie."
      tr: "Online fiyatların iyice şişer. Müşteri karşılaştırır, seni pahalı bulur, daha az sipariş verir — ya da başka yerden. Kâğıt üzerinde marjın kurtulur ama kaybettiğin satışları asla görmezsin."
      el: "Οι online τιμές σου φουσκώνουν αισθητά. Ο πελάτης συγκρίνει, σε βρίσκει ακριβότερο και παραγγέλνει λιγότερο — ή αλλού. Το περιθώριό σου σώζεται στα χαρτιά, αλλά τις χαμένες πωλήσεις δεν τις βλέπεις ποτέ."
      ro: "Prețurile tale online se umflă vizibil. Clientul compară, te găsește mai scump și comandă mai puțin — sau în altă parte. Marja ta e salvată pe hârtie, dar vânzările pierdute nu le vezi niciodată."
      zh: "你的线上价格明显虚高。客人一比价，觉得你贵，就点得少——或者去别家。账面上利润保住了，但流失的销量，你永远看不见。"
      ja: "オンライン価格が大きく膨らみます。お客様は比較して「高い」と感じ、注文を減らすか、よそへ。帳簿の上では利益は無事でも、失われた売上は決して見えません。"
      th: "ราคาออนไลน์ของคุณพองขึ้นชัดเจน ลูกค้าเปรียบเทียบราคา เห็นว่าคุณแพงกว่า แล้วก็สั่งน้อยลง — หรือไปสั่งที่อื่น บนกระดาษกำไรของคุณดูปลอดภัยดี แต่ยอดขายที่หายไป คุณไม่มีวันได้เห็นมัน"
      hi: "आपके ऑनलाइन दाम साफ़ बढ़ जाते हैं। ग्राहक तुलना करता है, आपको महँगा पाता है, और कम ऑर्डर करता है — या कहीं और से। काग़ज़ पर आपका मार्जिन बचा रहता है, पर खोई हुई बिक्री आपको कभी दिखती नहीं।"
      ta: "உங்கள் ஆன்லைன் விலைகள் கணிசமாக உயர்கின்றன. வாடிக்கையாளர் ஒப்பிட்டு, உங்களை விலை அதிகம் என்று கண்டு, குறைவாக ஆர்டர் செய்கிறார் — அல்லது வேறு இடத்தில். காகிதத்தில் உங்கள் லாபம் பத்திரம், ஆனால் இழந்த விற்பனையை நீங்கள் ஒருபோதும் பார்க்க மாட்டீர்கள்."
      ar: "أسعارك على الإنترنت ترتفع بوضوح. الزبون يقارن، يجدك أغلى، فيطلب أقل — أو من مكان آخر. هامشك سليم على الورق، لكن المبيعات الضائعة لن تراها أبدًا."
      ar-lb: "أسعارك أونلاين بتنفخ منيح. الزبون بيقارن، بيلاقيك أغلى، وبيطلب أقل — أو من محل تاني. عالورق ربحك محفوظ، بس المبيعات الضايعة ما بتشوفها بحياتك."
      he: "המחירים שלך אונליין מזנקים. הלקוח משווה, מוצא אותך יקר יותר, ומזמין פחות — או במקום אחר. הרווח שלך ניצל על הנייר, אבל את המכירות שאבדו אתה אף פעם לא רואה."
  repercuss.msg50:
    messages:
      fr: "Tu perds sur les deux tableaux : tes prix montent quand même (donc du volume en moins), <strong>et</strong> tu absorbes l'autre moitié (donc de la marge en moins)."
      en: "You lose on both fronts: your prices still go up (so less volume), <strong>and</strong> you swallow the other half (so less margin)."
      es: "Pierdes por partida doble: tus precios suben igualmente (menos volumen), <strong>y</strong> absorbes la otra mitad (menos margen)."
      it: "Perdi su entrambi i fronti: i tuoi prezzi salgono comunque (quindi meno volume), <strong>e</strong> l'altra metà la assorbi tu (quindi meno margine)."
      pt: "Perdes dos dois lados: os teus preços sobem na mesma (logo, menos volume), <strong>e</strong> absorves a outra metade (logo, menos margem)."
      de: "Du verlierst doppelt: Deine Preise steigen trotzdem (also weniger Volumen), <strong>und</strong> du schluckst die andere Hälfte (also weniger Marge)."
      tr: "İki cephede birden kaybedersin: fiyatların yine de artar (yani satış kaybı), <strong>üstelik</strong> diğer yarısını da sen yutarsın (yani marj kaybı)."
      el: "Χάνεις και στα δύο μέτωπα: οι τιμές σου ανεβαίνουν έτσι κι αλλιώς (άρα λιγότερες παραγγελίες), <strong>και</strong> απορροφάς το άλλο μισό (άρα λιγότερο περιθώριο)."
      ro: "Pierzi pe ambele fronturi: prețurile tot cresc (deci volum în minus), <strong>și</strong> absorbi cealaltă jumătate (deci marjă în minus)."
      zh: "两头吃亏：价格照样涨（销量变少），<strong>而且</strong>另一半佣金还得自己扛（利润变少）。"
      ja: "二重に損をします：価格はそれでも上がり（＝売上が減る）、<strong>そのうえ</strong>残り半分は自腹（＝利益が減る）。"
      th: "คุณเสียทั้งขึ้นทั้งล่อง: ราคาก็ยังสูงขึ้นอยู่ดี (ยอดขายจึงหายไป) <strong>และ</strong>คุณยังต้องแบกรับอีกครึ่งหนึ่งเอง (กำไรจึงหายไปด้วย)"
      hi: "आप दोनों तरफ़ से हारते हैं: दाम फिर भी बढ़ते हैं (यानी बिक्री कम), <strong>और</strong> बाक़ी आधा आप ख़ुद झेलते हैं (यानी मार्जिन कम)।"
      ta: "இரண்டு பக்கமும் இழப்பு: விலைகள் எப்படியும் உயர்கின்றன (எனவே விற்பனை குறைவு), <strong>அதோடு</strong> மறு பாதியை நீங்களே தாங்குகிறீர்கள் (எனவே லாபம் குறைவு)."
      ar: "تخسر على الجبهتين: أسعارك ترتفع رغم ذلك (أي مبيعات أقل)، <strong>و</strong>تتحمل أنت النصف الآخر (أي هامش أقل)."
      ar-lb: "بتخسر عالجهتين: أسعارك بتطلع برضو (يعني مبيعات أقل)، <strong>و</strong>عم تبلع النص التاني (يعني ربح أقل)."
      he: "אתה מפסיד בשתי החזיתות: המחירים שלך עדיין עולים (כלומר פחות מכירות), <strong>וגם</strong> אתה סופג את החצי השני (כלומר פחות רווח)."
