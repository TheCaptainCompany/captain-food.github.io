      ta: "0% கமிஷன், உங்கள் உணவுகள் உங்கள் விலையில், உங்கள் வாடிக்கையாளர்கள் உங்களுக்கே. Tours-ன் சுயாதீனர்களுக்கான உள்ளூர், ஒற்றுமை அடிப்படையிலான ஆர்டர் தளம்."
      ar: "عمولة 0%، أطباقك بأسعارك، وزبائنك ملك لك. منصة الطلب المحلية والتضامنية للمستقلين في Tours."
      ar-lb: "0% عمولة، أكلك بأسعارك، وزبايناتك إلك. الطلب المحلّي والتضامني للمستقلّين بـTours."
      he: "0% עמלה, המנות שלך במחירים שלך, הלקוחות שלך. הזמנות מקומיות וסולידריות לעצמאים של Tours."
