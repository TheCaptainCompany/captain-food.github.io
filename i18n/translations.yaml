  footer.langs:
    messages:
      fr: "Captain.Food parlera, à terme, les 17 langues de cette page : français, anglais, espagnol, italien, portugais, allemand, turc, grec, roumain, arabe, arabe libanais, hébreu, chinois (mandarin), japonais, thaï, hindi et tamoul."
      en: "In time, Captain.Food will speak this page's 17 languages: French, English, Spanish, Italian, Portuguese, German, Turkish, Greek, Romanian, Arabic, Lebanese Arabic, Hebrew, Chinese (Mandarin), Japanese, Thai, Hindi and Tamil."
      es: "Con el tiempo, Captain.Food hablará los 17 idiomas de esta página: francés, inglés, español, italiano, portugués, alemán, turco, griego, rumano, árabe, árabe libanés, hebreo, chino (mandarín), japonés, tailandés, hindi y tamil."
      it: "Col tempo, Captain.Food parlerà le 17 lingue di questa pagina: francese, inglese, spagnolo, italiano, portoghese, tedesco, turco, greco, rumeno, arabo, arabo libanese, ebraico, cinese (mandarino), giapponese, thailandese, hindi e tamil."
      pt: "A prazo, a Captain.Food falará as 17 línguas desta página: francês, inglês, espanhol, italiano, português, alemão, turco, grego, romeno, árabe, árabe libanês, hebraico, chinês (mandarim), japonês, tailandês, hindi e tâmil."
      de: "Mit der Zeit wird Captain.Food die 17 Sprachen dieser Seite sprechen: Französisch, Englisch, Spanisch, Italienisch, Portugiesisch, Deutsch, Türkisch, Griechisch, Rumänisch, Arabisch, Libanesisches Arabisch, Hebräisch, Chinesisch (Mandarin), Japanisch, Thailändisch, Hindi und Tamil."
      tr: "Zamanla Captain.Food bu sayfanın 17 dilini konuşacak: Fransızca, İngilizce, İspanyolca, İtalyanca, Portekizce, Almanca, Türkçe, Yunanca, Rumence, Arapça, Lübnan Arapçası, İbranice, Çince (Mandarin), Japonca, Tayca, Hintçe ve Tamilce."
      el: "Με τον καιρό, το Captain.Food θα μιλά τις 17 γλώσσες αυτής της σελίδας: γαλλικά, αγγλικά, ισπανικά, ιταλικά, πορτογαλικά, γερμανικά, τουρκικά, ελληνικά, ρουμανικά, αραβικά, λιβανέζικα αραβικά, εβραϊκά, κινεζικά (μανδαρινικά), ιαπωνικά, ταϊλανδικά, χίντι και ταμίλ."
      ro: "Cu timpul, Captain.Food va vorbi cele 17 limbi ale acestei pagini: franceză, engleză, spaniolă, italiană, portugheză, germană, turcă, greacă, română, arabă, arabă libaneză, ebraică, chineză (mandarină), japoneză, thailandeză, hindi și tamilă."
      zh: "假以时日，Captain.Food 将会说这个页面的17种语言：法语、英语、西班牙语、意大利语、葡萄牙语、德语、土耳其语、希腊语、罗马尼亚语、阿拉伯语、黎巴嫩阿拉伯语、希伯来语、中文（普通话）、日语、泰语、印地语和泰米尔语。"
      ja: "やがてCaptain.Foodは、このページの17の言語を話すようになります：フランス語、英語、スペイン語、イタリア語、ポルトガル語、ドイツ語、トルコ語、ギリシャ語、ルーマニア語、アラビア語、レバノン・アラビア語、ヘブライ語、中国語（標準語）、日本語、タイ語、ヒンディー語、タミル語。"
      th: "ในอนาคต Captain.Food จะพูดได้ครบทั้ง 17 ภาษาของหน้านี้: ฝรั่งเศส อังกฤษ สเปน อิตาลี โปรตุเกส เยอรมัน ตุรกี กรีก โรมาเนีย อาหรับ อาหรับเลบานอน ฮีบรู จีน (แมนดาริน) ญี่ปุ่น ไทย ฮินดี และทมิฬ"
      hi: "समय के साथ Captain.Food इस पेज की सभी 17 भाषाएँ बोलेगा: फ़्रेंच, अंग्रेज़ी, स्पैनिश, इतालवी, पुर्तगाली, जर्मन, तुर्की, यूनानी, रोमानियाई, अरबी, लेबनानी अरबी, हिब्रू, चीनी (मंदारिन), जापानी, थाई, हिन्दी और तमिल।"
      ta: "Captain.Food காலப்போக்கில் இந்தப் பக்கத்தின் 17 மொழிகளையும் பேசும்: பிரெஞ்சு, ஆங்கிலம், ஸ்பானிஷ், இத்தாலியன், போர்த்துகீசியம், ஜெர்மன், துருக்கியம், கிரேக்கம், ருமேனியன், அரபு, லெபனான் அரபு, ஹீப்ரு, சீனம் (மாண்டரின்), ஜப்பானியம், தாய், இந்தி மற்றும் தமிழ்."
      ar: "مع الوقت، سيتحدث Captain.Food لغات هذه الصفحة السبع عشرة: الفرنسية والإنجليزية والإسبانية والإيطالية والبرتغالية والألمانية والتركية واليونانية والرومانية والعربية والعربية اللبنانية والعبرية والصينية (الماندرين) واليابانية والتايلاندية والهندية والتاميلية."
      ar-lb: "مع الوقت، Captain.Food رح يحكي كل الـ17 لغة يلي بهالصفحة: الفرنسية والإنجليزية والإسبانية والإيطالية والبرتغالية والألمانية والتركية واليونانية والرومانية والعربية والعربية اللبنانية والعبرية والصينية (الماندرين) واليابانية والتايلاندية والهندية والتاميلية."
      he: "עם הזמן, Captain.Food ידבר את 17 השפות של הדף הזה: צרפתית, אנגלית, ספרדית, איטלקית, פורטוגזית, גרמנית, טורקית, יוונית, רומנית, ערבית, ערבית לבנונית, עברית, סינית (מנדרינית), יפנית, תאית, הינדי וטמילית."
