name: i18n check

# Gate for the translation catalog (i18n/translations.yaml):
#   - every key exists in EVERY declared language (fr en es it pt ar he)
#   - {placeholder} tokens are consistent across languages
#   - every data-i18n key used in HTML/JS exists in the catalog (and vice versa)
#   - the French messages match the French copy authored in index.html (no drift)
#   - i18n/generated/*.json are up to date with the YAML
# Single source of truth: i18n/translations.yaml; tool: tools/i18n/i18n.py.

on:
  push:
    paths:
      - "i18n/**"
      - "tools/i18n/**"
      - "**/*.html"
      - "partials.js"
      - "i18n.js"
      - "script.js"
      - ".github/workflows/i18n.yml"
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Validate translations (completeness, drift, generated files)
        run: python3 tools/i18n/i18n.py check

      - name: Validate generated per-language pages (drift gate)
        run: python3 tools/i18n/i18n.py pages --check
